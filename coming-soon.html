<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="color-scheme" content="light"/>
<meta name="theme-color" content="#1a1a18"/>
<script src="theme.js?v=20260801"></script>
<title>Připravujeme — LayersOfPrague</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:   #eeefeb;
  --paper-2: #e6e7e2;
  --paper-3: #dadcd4;
  --ink:     #1a1a18;
  --ink-2:   #3a3a36;
  --ink-3:   #6a6a64;
  --ink-4:   #9a9a94;
  --rule:    #cbcec5;
  --accent:  #b04020;
  --ok:      #3d7a4a;
  --ease:    cubic-bezier(.22,.8,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; min-height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

body {
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.box {
  max-width: 420px;
  text-align: center;
}
.kick {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--ink-4);
  margin-bottom: 14px;
}
.badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--paper-2); border: 1.5px dashed var(--rule);
  margin-bottom: 18px;
}
.badge svg { width: 22px; height: 22px; color: var(--ink-3); }
h1 {
  font-family: 'Fraunces', serif; font-weight: 500;
  font-size: 26px; line-height: 1.25;
  margin-bottom: 10px;
}
p {
  color: var(--ink-3); font-size: 14.5px; line-height: 1.6;
  margin-bottom: 24px;
}
.actions { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; border-radius: 8px;
  font-size: 13.5px; font-weight: 500;
  transition: box-shadow .15s, transform .15s;
}
.btn-dark { background: var(--ink); color: var(--paper); }
.btn-dark:hover { box-shadow: 0 3px 10px rgba(26,24,20,.28); transform: translateY(-1px); }
.btn-ghost {
  background: transparent; color: var(--ink-3);
  border: 1.5px solid var(--rule);
}
.btn-ghost:hover { border-color: var(--ink-4); color: var(--ink-2); }
</style>
</head>
<body>
  <div class="box">
    <div class="kick">Připravujeme</div>
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
    </div>
    <h1 id="placeName">Tohle místo se ještě připravuje</h1>
    <p>Zatím je jen v pracovní vrstvě mapy — vlastní stránku s fotkami a
       podrobnostmi pro něj chystáme. Mrkni zatím na Wikipedii, nebo se
       vrať na mapu a prozkoumej něco, co už je hotové.</p>
    <div class="actions" id="actions">
      <a class="btn btn-dark" href="map.html">← Zpět na mapu</a>
    </div>
  </div>
<script>
const params = new URLSearchParams(location.search);
const name = params.get('name');
if (name) document.getElementById('placeName').textContent = name;
const wiki = params.get('wiki');
if (wiki) {
  const a = document.createElement('a');
  a.className = 'btn btn-ghost';
  a.href = wiki; a.target = '_blank'; a.rel = 'noopener';
  a.textContent = 'Otevřít na Wikipedii';
  document.getElementById('actions').appendChild(a);
}
</script>
</body>
</html>

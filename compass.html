<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Kompas · LoP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #e8e4dc; }
#clip { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
#mapWrap { position: absolute; transform-origin: 50% 50%; background: #e8e4dc; }
#map { width: 100%; height: 100%; }
/* userDot now a Leaflet marker */
/* calBtn styled inline */
.arrival-hidden { display: none !important; }
.arrival-visible { display: flex !important; }
/* dbg styled inline */
</style>
<script src="castle-data.js"></script>
<script src="stamp.js"></script>
<script src="header.js"></script>
<script src="nav.js"></script>
</head>
<body>
<div id="lop-header"></div>
<div id="clip">
  <div id="mapWrap"><div id="map"></div></div>
  <!-- userDot removed, using Leaflet marker instead -->
</div>

<!-- Overlays — all position:fixed, top/bottom set by applyClipBounds() -->
<input type="file" id="calFile" accept=".json" style="display:none" onchange="importCal(this)"/>

<!-- TEST: arrival trigger (remove before production) -->
<button onclick="_arrivalShown=false;showArrival()" style="position:fixed;bottom:80px;left:8px;z-index:200;
  padding:6px 10px;border-radius:8px;
  background:#b04020;color:#fff;border:none;
  font-family:monospace;font-size:10px;cursor:pointer;opacity:.7;">
  TEST arrival
</button>

<!-- Cal button: top-left -->
<button id="calBtn" onclick="toggleCal()" ontouchstart="calTouchStart()" ontouchend="calTouchEnd()"
  style="position:fixed;left:8px;z-index:200;
    height:28px;padding:0 10px;border-radius:14px;
    font-family:monospace;font-size:11px;font-weight:600;letter-spacing:.04em;
    border:none;cursor:pointer;white-space:nowrap;
    transition:background .2s,color .2s;">
</button>

<!-- Mini compass: top-right -->
<canvas id="miniCompass" width="80" height="80"
  style="position:fixed;right:8px;z-index:200;pointer-events:none;width:60px;height:60px;">
</canvas>

<!-- Zoom buttons: below miniCompass -->
<button id="zoomInBtn" onclick="map.zoomIn()"
  style="position:fixed;right:14px;z-index:200;
    width:26px;height:26px;border-radius:4px 4px 0 0;
    background:#eeefeb;border:1px solid #cbcec5;border-bottom:none;
    box-shadow:0 2px 10px rgba(26,24,20,.06);
    cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1a1a18;font-size:16px;line-height:1;">+</button>
<button id="zoomOutBtn" onclick="map.zoomOut()"
  style="position:fixed;right:14px;z-index:200;
    width:26px;height:26px;border-radius:0 0 4px 4px;
    background:#eeefeb;border:1px solid #cbcec5;
    box-shadow:0 2px 10px rgba(26,24,20,.06);
    cursor:pointer;display:flex;align-items:center;justify-content:center;color:#1a1a18;font-size:16px;line-height:1;">−</button>



<!-- GPS debug: below calBtn -->
<div id="dbg" style="position:fixed;top:80px;left:8px;z-index:200;background:rgba(26,24,20,.65);color:#fff;font-family:monospace;font-size:11px;padding:5px 10px;border-radius:20px;white-space:nowrap;pointer-events:none;">GPS: čeká…</div>

<!-- Distance display bottom center (position:fixed, set by JS) -->
<div id="distBox" style="
  position:fixed;left:8px;
  z-index:200;pointer-events:none;
  display:flex;align-items:baseline;gap:8px;
">
  <div id="distVal" style="font-family:monospace;font-size:28px;font-weight:700;
    color:#1a1a18;text-shadow:0 1px 4px rgba(255,255,255,.8);line-height:1"></div>
  <div id="distSteps" style="font-family:monospace;font-size:11px;
    color:#3a3a36;text-shadow:0 1px 3px rgba(255,255,255,.8)"></div>
</div>

<script>
// ── PARAMS ──
const params = new URLSearchParams(location.search);
var TARGET = {
  id:    params.get('id'),
  num:   params.get('num') || params.get('id') || '?',
  lat:   parseFloat(params.get('lat')),
  lng:   parseFloat(params.get('lng')),
  name:  params.get('name') || '',
  thumb: params.get('thumb') || '',
  radius: parseFloat(params.get('radius')) || 20
};

// ── ANCHOR ──
const wrap = document.getElementById('mapWrap');
const dot  = document.getElementById('userDot');
let AX = 0, AY = 0;

function applyClipBounds() {
  var hdr = document.getElementById('lop-header');
  var nav = document.getElementById('lop-nav');
  var clip = document.getElementById('clip');
  var desktop = window.innerWidth >= 820;
  // On desktop: nav is right sidebar (84px), header spans top
  var ht = hdr ? hdr.offsetHeight : 57;
  var nb = (!desktop && nav) ? nav.offsetHeight : 0;
  var nr = (desktop && nav) ? nav.offsetWidth || 84 : 0; // right offset on desktop
  if (ht === 0) ht = 57;
  clip.style.top    = ht + 'px';
  clip.style.bottom = nb + 'px';
  clip.style.right  = nr + 'px';
  // right offset for buttons (clear nav on desktop)
  var br = nr + 14;
  var dbg  = document.getElementById('dbg');
  var dist = document.getElementById('distBox');
  var cal  = document.getElementById('calBtn');
  var mc   = document.getElementById('miniCompass');
  var zi   = document.getElementById('zoomInBtn');
  var zo   = document.getElementById('zoomOutBtn');
  if (cal) cal.style.top = (ht + 8) + 'px';
  if (mc)  { mc.style.top = (ht + 8) + 'px'; mc.style.right = br + 'px'; }
  if (zi)  { zi.style.bottom = (nb + 8 + 26 + 4) + 'px'; zi.style.right = br + 'px'; }
  if (zo)  { zo.style.bottom = (nb + 8) + 'px'; zo.style.right = br + 'px'; }
  if (dbg) { dbg.style.top = (ht + 44) + 'px'; dbg.style.left = '8px'; }
  if (dist){ dist.style.bottom = (nb + 8) + 'px'; dist.style.left = '8px'; }
  return { ht: ht, nb: nb, nr: nr };
}

function setAnchor() {
  var landscape = window.innerWidth > window.innerHeight;
  var bounds = applyClipBounds();
  var clipW = window.innerWidth - bounds.nr;
  var clipH = window.innerHeight - bounds.ht - bounds.nb;
  AX = clipW / 2;
  AY = bounds.ht + (landscape ? clipH - 60 : clipH * 0.78);

  var d = Math.ceil(Math.sqrt(clipW * clipW + clipH * clipH) * 1.5);
  wrap.style.width  = d + 'px';
  wrap.style.height = d + 'px';
  wrap.style.left   = (AX - d / 2) + 'px';
  wrap.style.top    = (AY - d / 2) + 'px';

  if (dot) { dot.style.left = AX + 'px'; dot.style.top = AY + 'px'; }
}
applyClipBounds();
setAnchor(); // run before Leaflet init so #mapWrap has dimensions

// ── MAP ──
var map = L.map('map', { zoomControl: false, attributionControl: false, touchZoom: 'center', dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false });

// touchZoom: 'center' — zoomuje na střed mapy, ne na střed gest → žádný posun
map.dragging.disable();

// Po zoomu vrať střed mapy na polohu uživatele
map.on('zoomend', function() {
  if (userPos) {
    map.setView([userPos.lat, userPos.lng], map.getZoom(), { animate: false });
  }
});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 20, keepBuffer: 4
}).addTo(map);

// Center: target or Prague
var initCenter = (!isNaN(TARGET.lat)) ? [TARGET.lat, TARGET.lng] : [50.083, 14.42];
map.setView(initCenter, 16);
[100, 400, 800].forEach(function(t){ setTimeout(function(){ map.invalidateSize(); }, t); });

// drag disabled — map follows GPS
// Re-measure after header/nav scripts have fully injected
setTimeout(function(){ applyClipBounds(); setAnchor(); }, 50);
setTimeout(function(){ applyClipBounds(); setAnchor(); map.invalidateSize(); }, 300);

// Target pin
if (!isNaN(TARGET.lat)) {
  var n = String(TARGET.num), m = n.match(/^([A-Z]+)(\d+)$/);
  // Target pin — CSS checkered circle
  var pinHtml = '<div style="'
    + 'width:34px;height:34px;border-radius:50%;'
    + 'border:2px solid #fff;box-shadow:0 2px 6px rgba(26,24,20,.35);'
    + 'background-image:linear-gradient(45deg,#1a1a18 25%,transparent 25%),'
    + 'linear-gradient(-45deg,#1a1a18 25%,transparent 25%),'
    + 'linear-gradient(45deg,transparent 75%,#1a1a18 75%),'
    + 'linear-gradient(-45deg,transparent 75%,#1a1a18 75%);'
    + 'background-size:8px 8px;background-color:#fff;'
    + 'background-position:0 0,0 4px,4px -4px,-4px 0;'
    + '"></div>'
  var tMarker = L.marker([TARGET.lat, TARGET.lng], {
    icon: L.divIcon({ html: pinHtml, className: '', iconSize: [34,34], iconAnchor: [17,17] })
  }).addTo(map);
  tMarker.on('click', function(e) { L.DomEvent.stopPropagation(e); e.originalEvent.stopPropagation(); showTip(e, TARGET); });
}

// ── TOOLTIP ──
var CAT_COLOR_TIP = { hist: '#4A4A48', arch: '#3B5F84', fun: '#E0A020' };
function showTip(e, loc) {
  var tip = document.getElementById('tipBox');
  var name = loc.name || ('Cíl ' + loc.num);
  document.getElementById('tipName').textContent = name;
  // Distance
  if (userPos && !isNaN(loc.lat)) {
    var dist = calcDistSimple(userPos, { lat: loc.lat, lng: loc.lng });
    document.getElementById('tipDist').textContent = dist < 1000 ? Math.round(dist) + ' m' : (dist/1000).toFixed(1) + ' km';
  } else {
    document.getElementById('tipDist').textContent = '';
  }
  // Photo / color bg
  var imgEl = document.getElementById('tipImgEl');
  var thumb = loc.thumb || '';
  if (thumb) {
    imgEl.style.backgroundImage = 'url(' + thumb + ')';
    document.getElementById('tipImg').style.background = '#e8e4dc';
  } else {
    imgEl.style.backgroundImage = 'none';
    var col = CAT_COLOR_TIP[loc.cat] || '#4A4A48';
    document.getElementById('tipImg').style.background = 'linear-gradient(135deg,' + col + 'aa,' + col + ')';
  }
  // Store loc id for detail button
  tip.dataset.locId = loc.id !== undefined ? loc.id : '';
  // Position
  var oe = e.originalEvent;
  var touch = (oe.touches && oe.touches[0]) || (oe.changedTouches && oe.changedTouches[0]);
  var cx = oe.clientX !== undefined ? oe.clientX : (touch ? touch.clientX : window.innerWidth/2);
  var cy = oe.clientY !== undefined ? oe.clientY : (touch ? touch.clientY : window.innerHeight/2);
  var tipW = 200, tipH = 180;
  var left = Math.min(Math.max(cx - tipW/2, 8), window.innerWidth - tipW - 8);
  var top  = cy - tipH - 12;
  if (top < 50) top = cy + 20;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
  tip.style.display = 'block';
  tipJustShown = true;
  setTimeout(function(){ tipJustShown = false; }, 300);
}
function hideTip() { document.getElementById('tipBox').style.display = 'none'; }
function tipOpenDetail() {
  var id = document.getElementById('tipBox').dataset.locId;
  if (id !== '') window.location.href = 'LayersOfPrague.html#loc=' + id;
  hideTip();
}
function tipNavigate() {
  hideTip();
  // Already on compass — just close tip
}
function calcDistSimple(a, b) {
  var R = 6371000;
  var dLat = (b.lat-a.lat)*Math.PI/180, dLng = (b.lng-a.lng)*Math.PI/180;
  var h = Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));
}
var tipJustShown = false;
// Close tip on map click
document.getElementById('clip').addEventListener('click', function(e) {
  if (tipJustShown) return;
  var tip = document.getElementById('tipBox');
  if (tip && !tip.contains(e.target)) hideTip();
});


// ── OTHER LOCATIONS (dimmed) — načteno z places.json ──
var CAT_COLOR = { hist: '#4A4A48', arch: '#3B5F84', fun: '#E0A020' };

function addDimmedMarkers(locations) {
  locations.forEach(function(loc) {
    if (String(loc.id) === String(TARGET.id)) return;
    var n = String(loc.num || loc.id), m = n.match(/^([A-Z]+)(\d+)$/);
    var col = CAT_COLOR[loc.cat] || '#4A4A48';
    var ph = m
      ? '<div style="width:30px;height:30px;border-radius:50%;background:' + col + ';border:2px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:monospace;color:#fff"><span style="font-size:10px;font-weight:700;line-height:1">' + m[1] + '</span><span style="font-size:7px;opacity:.8;line-height:1">' + m[2] + '</span></div>'
      : '<div style="width:30px;height:30px;border-radius:50%;background:' + col + ';border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:10px;font-weight:700;color:#fff">' + n + '</div>';
    var marker = L.marker([loc.lat, loc.lng], {
      icon: L.divIcon({ html: ph, className: '', iconSize: [30,30], iconAnchor: [15,15] }),
      zIndexOffset: -100
    }).addTo(map);
    (function(mk, l) {
      setTimeout(function() { var el = mk.getElement(); if (el) el.style.opacity = '0.2'; }, 150);
      mk.on('click', function(e) { L.DomEvent.stopPropagation(e); e.originalEvent.stopPropagation(); showTip(e, l); });
    })(marker, loc);
  });
}

fetch('places.json')
  .then(function(r) { return r.ok ? r.json() : []; })
  .then(function(data) {
    var locs = data
      .filter(function(p) { return p.published !== false && p.lat && p.lng; })
      .map(function(p) { return { id: p.id, name: p.name, lat: p.lat, lng: p.lng, cat: p.cat, num: p.id, thumb: p.thumb || '' }; });
    addDimmedMarkers(locs);
  })
  .catch(function() { /* places.json nedostupný — žádné potlačené piny */ });


// ── CALIBRATION ──
var yawOffset = 0, calEnabled = false;
var SUPABASE_URL = 'https://lomtaoctzetpweuepesp.supabase.co';
var SUPABASE_KEY = 'sb_publishable_uAQBxCOYWpc_PrEc78fFzw_kbeH4xj5';

function getSession() {
  try { return JSON.parse(localStorage.getItem('lop_auth_session') || 'null'); } catch(e) { return null; }
}

function getValidSession() {
  return new Promise(function(resolve) {
    var s = getSession();
    if (!s || !s.access_token || !s.user) { resolve(null); return; }
    var nowSec = Math.floor(Date.now() / 1000);
    if ((s.expires_at || 0) > nowSec + 60) { resolve(s); return; }
    if (!s.refresh_token) { resolve(null); return; }
    fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    })
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(data) {
      if (data) {
        var ns = Object.assign({}, data, { user: data.user || s.user });
        localStorage.setItem('lop_auth_session', JSON.stringify(ns));
        resolve(ns);
      } else {
        localStorage.removeItem('lop_auth_session');
        resolve(null);
      }
    })
    .catch(function() { resolve(null); });
  });
}

function applyCalData(cal) {
  var disabled = localStorage.getItem('lop_cal_disabled') === '1';
  if (cal && !disabled) { yawOffset = (cal.offsets && cal.offsets.yaw) || 0; calEnabled = true; }
  else { yawOffset = 0; calEnabled = false; }
  updateCalBtn();
}

function saveCalToSupabase(cal) {
  var s = getSession(); if (!s || !s.user) return;
  fetch(SUPABASE_URL + '/rest/v1/user_settings', {
    method: 'POST',
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + s.access_token, 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' },
    body: JSON.stringify({ user_id: s.user.id, compass_calibration: cal, updated_at: new Date().toISOString() })
  }).catch(function(){});
}

function loadCal() {
  // 1. localStorage first
  try {
    var cal = JSON.parse(localStorage.getItem('lop_sensor_calibration') || 'null');
    if (cal) { applyCalData(cal); return; }
  } catch(e) {}
  // 2. Supabase if logged in
  var s = getSession();
  if (!s || !s.user) { applyCalData(null); return; }
  fetch(SUPABASE_URL + '/rest/v1/user_settings?user_id=eq.' + s.user.id + '&select=compass_calibration', {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + s.access_token }
  })
  .then(function(r) { return r.json(); })
  .then(function(rows) {
    if (rows && rows[0] && rows[0].compass_calibration) {
      var cal = rows[0].compass_calibration;
      localStorage.setItem('lop_sensor_calibration', JSON.stringify(cal));
      applyCalData(cal);
    } else { applyCalData(null); }
  })
  .catch(function() { applyCalData(null); });
}
function updateCalBtn() {
  var btn = document.getElementById('calBtn'); if (!btn) return;
  var cal = null;
  try { cal = JSON.parse(localStorage.getItem('lop_sensor_calibration') || 'null'); } catch(e) {}
  var disabled = localStorage.getItem('lop_cal_disabled') === '1';
  if (!cal) {
    // No calibration available
    btn.textContent = 'kalibrovat kompas?';
    btn.style.background = '#b04020';
    btn.style.color = '#fff';
  } else if (calEnabled) {
    // Active
    btn.textContent = '● kalibrace kompasu';
    btn.style.background = '#3d7a4a';
    btn.style.color = '#fff';
  } else {
    // Available but disabled
    btn.textContent = '○ kalibrace kompasu';
    btn.style.background = 'rgba(26,24,20,.55)';
    btn.style.color = '#fff';
  }
}
function toggleCal() {
  var cal = null;
  try { cal = JSON.parse(localStorage.getItem('lop_sensor_calibration') || 'null'); } catch(e) {}
  if (!cal) {
    // No calibration — redirect to calibration tool
    window.location.href = 'usercalibrationtool.html';
    return;
  }
  var d = localStorage.getItem('lop_cal_disabled') === '1';
  if (d) localStorage.removeItem('lop_cal_disabled'); else localStorage.setItem('lop_cal_disabled', '1');
  loadCal();
}

// ── ARRIVAL ──
var _arrivalShown = false;

function arScoreToStampScore(arScore) {
  if (arScore == null || arScore === 0) return 1;
  if (arScore <= 25) return 25;
  if (arScore <= 50) return 45;
  if (arScore <= 75) return 65;
  return 90;
}

function showArrival() {
  if (_arrivalShown) return;
  _arrivalShown = true;

  // Ulož lokálně (score null = jen návštěva, 100 bodů)
  try {
    var visited = JSON.parse(localStorage.getItem('lop_visited_v1') || '[]').map(String);
    if (!visited.includes(String(TARGET.id))) {
      visited.push(String(TARGET.id));
      localStorage.setItem('lop_visited_v1', JSON.stringify(visited));
    }
    var scores = JSON.parse(localStorage.getItem('lop_scores_v1') || '{}');
    if (!scores[String(TARGET.id)]) {
      scores[String(TARGET.id)] = { score: null, date: new Date().toISOString() };
      localStorage.setItem('lop_scores_v1', JSON.stringify(scores));
    }
  } catch(e) {}

  // Ulož do Supabase
  getValidSession().then(function(s) {
    if (!s || !s.user) return;
    fetch(SUPABASE_URL + '/rest/v1/visited?on_conflict=user_id,place_id', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + s.access_token,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      },
      body: JSON.stringify({
        user_id: s.user.id,
        place_id: String(TARGET.id),
        score: null,
        points: 100.0,
        visited_at: new Date().toISOString()
      })
    }).catch(function(){});
  });

  var ov = document.getElementById('arrivalOverlay');
  if (!ov) return;

  // Název
  var nameEl = document.getElementById('arrivalName');
  if (nameEl) nameEl.textContent = TARGET.name || 'Místo';

  // Razítko
  if (window.stampSVG) {
    var stampEl = document.getElementById('arrivalStamp');
    if (stampEl) {
      var today = new Date();
      var dateLabel = today.getDate() + '. ' + (today.getMonth()+1) + '. ' + today.getFullYear();
      stampEl.innerHTML = window.stampSVG({
        orientation: 'sealF', style: 'rough', castle: 'ink', eccentric: true,
        code: String(TARGET.num || TARGET.id),
        name: TARGET.name || '',
        year: null,
        cat: 'hist',
        score: 1,  // level 1 — jen návštěva
        dateLabel: dateLabel,
        k: TARGET.id + '-arrival',
      });
    }
  }

  ov.classList.remove('arrival-hidden');
  ov.classList.add('arrival-visible');
}
function arrGoAR() {
  var url = 'AR_simple.html?id=' + TARGET.id
    + '&num=' + encodeURIComponent(TARGET.num || '')
    + '&lat=' + TARGET.lat
    + '&lng=' + TARGET.lng
    + '&name=' + encodeURIComponent(TARGET.name || '');
  if (TARGET.thumb) url += '&thumb=' + encodeURIComponent(TARGET.thumb);
  location.href = url;
}
function arrGoDetail() { location.href = 'place/' + TARGET.id + '.html'; }
function arrGoMap() { location.href = 'index.html'; }

function importCal(input) {
  var file = input.files[0]; if (!file) return;
  var r = new FileReader();
  r.onload = function(ev) {
    try {
      var cal = JSON.parse(ev.target.result);
      if (!cal.offsets) throw new Error('Chybí offsets');
      localStorage.setItem('lop_sensor_calibration', JSON.stringify(cal));
      localStorage.removeItem('lop_cal_disabled');
      loadCal();
      var btn = document.getElementById('calBtn');
      btn.style.background = '#b8922a';
      setTimeout(loadCal, 800);
    } catch(e) { alert('Chyba: ' + e.message); }
    input.value = '';
  };
  r.readAsText(file);
}
var calTimer = null;
function calTouchStart() { calTimer = setTimeout(function(){ calTimer = null; document.getElementById('calFile').click(); }, 600); }
function calTouchEnd() { if (calTimer) { clearTimeout(calTimer); calTimer = null; } }
loadCal();

// ── DISTANCE ──
function toRad(d) { return d * Math.PI / 180; }
function calcDist(a, b) {
  var R = 6371000;
  var dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}
function updateDist() {
  if (!userPos || isNaN(TARGET.lat)) return;
  var dist = calcDist(userPos, TARGET);
  var dv = document.getElementById('distVal');
  var ds = document.getElementById('distSteps');
  if (!dv) return;
  if (dist < 1000) dv.textContent = Math.round(dist) + ' m';
  else dv.textContent = (dist/1000).toFixed(1).replace('.', ',') + ' km';
  var steps = Math.round(dist / 0.75);
  ds.textContent = steps < 9999 ? '≈ ' + steps.toLocaleString('cs') + ' kroků' : '';
}

// ── SENSORS ──
var userPos = null, smoothH = null, lastH = 0;
var userMarker = null;

// Two-stage smoothing: fast lerp into buffer, slow lerp to display
var rawH = null;
var LP_FAST = 0.25;  // raw → buffer (tracks movement)
var LP_SLOW = 0.04;  // buffer → display (suppresses jitter)

function addHeadingSample(raw) {
  // Stage 1: fast lerp on raw value
  if (rawH === null) { rawH = raw; }
  else {
    var d = raw - rawH;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    rawH = (rawH + LP_FAST * d + 360) % 360;
  }
  // Stage 2: slow lerp rawH → smoothH
  if (smoothH === null) { smoothH = rawH; }
  else {
    var d2 = rawH - smoothH;
    if (d2 > 180) d2 -= 360; if (d2 < -180) d2 += 360;
    smoothH = (smoothH + LP_SLOW * d2 + 360) % 360;
  }
}

var isLocked = true; // false = user manually panned/zoomed, stop GPS following

// zoom: GPS setView handles re-centering

var lastPanLat = null, lastPanLng = null;
navigator.geolocation && navigator.geolocation.watchPosition(
  function(pos) {
    userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    // Update/create user marker at GPS coordinates (inside map, rotates with it)
    if (userMarker) {
      userMarker.setLatLng([userPos.lat, userPos.lng]);
    } else {
      var dotHtml = '<div style="width:18px;height:18px;border-radius:50%;background:#b04020;border:3px solid #fff;box-shadow:0 0 0 3px rgba(176,64,32,.25),0 2px 8px rgba(0,0,0,.4);margin:-1px"></div>';
      userMarker = L.marker([userPos.lat, userPos.lng], {
        icon: L.divIcon({ html: dotHtml, className: '', iconSize: [18,18], iconAnchor: [9,9] }),
        zIndexOffset: 1000
      }).addTo(map);
    }
    // Only pan if locked and moved more than ~3m
    var dlat = Math.abs(userPos.lat - lastPanLat);
    var dlng = Math.abs(userPos.lng - lastPanLng);
    if (isLocked && (lastPanLat === null || dlat > 0.00003 || dlng > 0.00003)) {
      lastPanLat = userPos.lat; lastPanLng = userPos.lng;
      map.setView([userPos.lat, userPos.lng], map.getZoom(), { animate: false });
    }
    updateDist();
    // Detekce příchodu
    if (!_arrivalShown && !isNaN(TARGET.lat)) {
      var dist = calcDist(userPos, { lat: TARGET.lat, lng: TARGET.lng });
      if (dist <= TARGET.radius) showArrival();
    }
    document.getElementById('dbg').textContent = 'GPS ±' + Math.round(pos.coords.accuracy) + 'm | ' + Math.round(smoothH||0) + '°';
  },
  function(err) {
    var m = { 1: 'Poloha blokována', 2: 'Nelze určit', 3: 'Timeout' };
    document.getElementById('dbg').textContent = 'GPS: ' + (m[err.code] || 'chyba');
  },
  { enableHighAccuracy: true, maximumAge: 1500 }
);

var oriPaused = false;

function getScreenAngle() {
  if (screen.orientation && screen.orientation.angle !== undefined)
    return screen.orientation.angle;
  if (window.orientation !== undefined)
    return window.orientation;
  return 0;
}

function startOri() {
  var hasAbsolute = false;

  function toHeading(e, isAbsolute) {
    // iOS: webkitCompassHeading is always correct, no processing needed
    if (e.webkitCompassHeading !== undefined) return e.webkitCompassHeading;
    if (e.alpha === null) return null;
    if (isAbsolute) {
      // deviceorientationabsolute: alpha = degrees from north, counterclockwise
      // Convert to clockwise bearing
      return (360 - e.alpha) % 360;
    } else {
      // deviceorientation: alpha relative to screen orientation
      return (360 - e.alpha + getScreenAngle() + 360) % 360;
    }
  }

  function handleAbsolute(e) {
    if (oriPaused) return;
    hasAbsolute = true;
    var raw = toHeading(e, true);
    if (raw !== null) addHeadingSample((raw + yawOffset + 360) % 360);
  }

  function handleRelative(e) {
    if (oriPaused || hasAbsolute) return;
    var raw = toHeading(e, false);
    if (raw !== null) addHeadingSample((raw + yawOffset + 360) % 360);
  }

  window.addEventListener('deviceorientationabsolute', handleAbsolute, true);
  window.addEventListener('deviceorientation', handleRelative, true);
}

// Pause orientation briefly on resize to avoid sensor glitch during rotation
window.addEventListener('resize', function() {
  oriPaused = true;
  setTimeout(function() { oriPaused = false; }, 800);
});
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
  document.addEventListener('touchstart', function u() {
    DeviceOrientationEvent.requestPermission().then(function(s){ if (s==='granted') startOri(); }).catch(startOri);
    document.removeEventListener('touchstart', u);
  }, { once: true });
} else { startOri(); }

// ── ROTATION ──
function rotateMap(h) {
  wrap.style.transform = 'rotate(' + (-h) + 'deg)';
  lastH = h;
}

// ── LOOP ──
function drawMiniCompass(heading) {
  var c = document.getElementById('miniCompass');
  if (!c) return;
  var ctx = c.getContext('2d');
  var S = 80, cx = 40, cy = 40, R = 36;
  ctx.clearRect(0, 0, S, S);
  // Background
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(238,239,235,0.88)'; ctx.fill();
  ctx.strokeStyle = '#cbcec5'; ctx.lineWidth = 1.5; ctx.stroke();
  // Rotating rose
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-heading * Math.PI / 180);
  // Ticks
  for (var i = 0; i < 36; i++) {
    var a = i * 10 * Math.PI / 180, big = i % 9 === 0;
    ctx.beginPath();
    ctx.moveTo(Math.sin(a)*(big?R-10:R-6), -Math.cos(a)*(big?R-10:R-6));
    ctx.lineTo(Math.sin(a)*R, -Math.cos(a)*R);
    ctx.strokeStyle = big ? '#6a6a64' : '#cbcec5';
    ctx.lineWidth = big ? 1.5 : 1; ctx.stroke();
  }
  // N label
  ctx.fillStyle = '#b04020'; ctx.font = '600 10px JetBrains Mono, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('N', 0, -(R-18));
  ctx.restore();
  // Center dot
  ctx.beginPath(); ctx.arc(cx, cy, 4, 0, Math.PI*2);
  ctx.fillStyle = '#1a1a18'; ctx.fill();
  // Heading
  ctx.fillStyle = '#1a1a18'; ctx.font = '600 9px JetBrains Mono, monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Math.round(heading) + '°', cx, cy);
}

function loop() {
  var h = smoothH !== null ? smoothH : 0;
  if (Math.abs(lastH - h) > 1.5) rotateMap(h);
  drawMiniCompass(h);
  document.getElementById('dbg').textContent = (userPos?'GPS ✓':'GPS…') + ' h:' + Math.round(h) + '° off:' + yawOffset.toFixed(1) + '°';
  requestAnimationFrame(loop);
}
loop();

// ── RESIZE ──
window.addEventListener('resize', function() {
  // Wait for browser to finish rotating before reading new dimensions
  requestAnimationFrame(function() {
    setAnchor();
    rotateMap(smoothH !== null ? smoothH : 0);
    // Re-center on user with new anchor
    if (userPos) map.setView([userPos.lat, userPos.lng], map.getZoom(), { animate: false });
    setTimeout(function() { map.invalidateSize(); }, 200);
    setTimeout(function() { map.invalidateSize(); }, 600);
  });
});
</script>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#111111"/>
<title>Přehled míst — LayersOfPrague</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:    #F8F8F6;
  --paper-2:  #F0F0EE;
  --paper-3:  #E8E8E6;
  --ink:      #111111;
  --ink-2:    #333331;
  --ink-3:    #666662;
  --ink-4:    #999994;
  --ink-5:    #BABAB6;
  --rule:     #E8E8E6;
  --rule-2:   #E0E0DE;
  --accent:   #B04020;
  --ok:       #3d7a4a;
  --cat-hist: #4A4A48;
  --cat-arch: #3B5F84;
  --cat-fun:  #E0A020;
  --cat-art:  #C0522A;
  --ease:     cubic-bezier(.22,.8,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; min-height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ── PAGE ── */
.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 28px 10px 100px;
}

/* ── HERO ── */
.hero-section {
  margin-bottom: 16px;
}
.hero-top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  margin-bottom: 10px;
}
.kick { font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-5); margin-bottom: 12px; font-weight: 500; }
.page-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: clamp(24px, 6vw, 36px); line-height: 1; letter-spacing: -.03em; color: var(--ink); white-space: nowrap; }
.page-title em { font-style: italic; font-weight: 300; color: #777772; }
.page-intro { font-size: 14px; color: var(--ink-4); line-height: 1.6; text-wrap: pretty; }

/* ── TOOLBAR (filtr + toggle) ── */
/* ── CONTROLS BAR ── */
.controls-bar {
  display: flex; align-items: center;
  background: #fff; border: 1.5px solid var(--rule);
  border-radius: 10px; box-shadow: 0 2px 16px rgba(0,0,0,.05);
  overflow: hidden; flex-shrink: 0;
}
.ctrl-btn {
  appearance: none; border: none; background: transparent;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  cursor: pointer; color: var(--ink-4);
  transition: background .15s, color .15s;
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500;
  white-space: nowrap; flex-shrink: 0;
}
.ctrl-btn:hover { background: var(--paper-2); color: var(--ink-2); }
.ctrl-btn.active { background: var(--ink); color: #fff; }
.ctrl-btn svg { width: 14px; height: 14px; pointer-events: none; flex-shrink: 0; }
.ctrl-btn-filter {
  padding: 8px 10px;
  border-right: 1px solid var(--rule);
}
.ctrl-btn-filter .filter-dots { display: flex; gap: 3px; }
.ctrl-btn-filter .filter-dots span { width: 6px; height: 6px; border-radius: 50%; }
.ctrl-btn-filter .filter-cnt { font-size: 10px; color: var(--ink-5); margin-left: 2px; }
.ctrl-btn-filter.has-filter .filter-cnt { color: var(--accent); font-weight: 600; }
.ctrl-btn-view { width: 38px; padding: 8px 0; }
.ctrl-btn-view + .ctrl-btn-view { border-left: 1px solid var(--rule); }

/* ── FILTER MODAL ── */
.filter-modal-backdrop {
  position: fixed;
  top: var(--header-h, 52px); left: 0; right: 0; bottom: 0;
  z-index: 450;
  display: none; pointer-events: none;
  background: transparent; transition: background .22s;
}
.filter-modal-backdrop.open {
  display: block; pointer-events: auto;
  background: rgba(17,17,17,.18);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.filter-modal {
  position: absolute;
  top: 12px; left: 12px; right: 12px; bottom: 12px;
  background: rgba(248,248,246,.96);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid var(--rule); border-radius: 14px;
  box-shadow: 0 8px 40px rgba(0,0,0,.14);
  opacity: 0; transform: scale(.97) translateY(-6px);
  transition: opacity .22s var(--ease), transform .22s var(--ease);
  pointer-events: none; overflow-y: auto;
  display: flex; flex-direction: column;
}
.filter-modal-backdrop.open .filter-modal {
  opacity: 1; transform: none; pointer-events: auto;
}
.filter-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 0;
}
.filter-modal-title {
  font-family: 'Inter', sans-serif;
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-4); font-weight: 500;
}
.filter-modal-close {
  appearance: none; background: transparent; border: none;
  width: 28px; height: 28px; border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-4); transition: background .15s, color .15s;
}
.filter-modal-close:hover { background: var(--paper-2); color: var(--ink); }
.filter-modal-close svg { width: 14px; height: 14px; }
.filter-modal-inner { padding: 14px 16px 20px; flex: 1; }

/* chip-wrap se stavovým popiskem — stejné jako index.html */
.chip-wrap {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
}
.chip-state-lbl {
  font-family: 'Inter', sans-serif;
  font-size: 9px; letter-spacing: .01em; text-transform: none;
  color: var(--ink-4); line-height: 1;
  width: 72px;
  padding-left: 13px;
  transition: color .15s;
}
@media (max-width: 819px) and (orientation: portrait) {
  .chip-wrap { flex-direction: row; align-items: center; gap: 8px; }
  .chip-state-lbl { padding-left: 0; width: 52px; text-align: left; }
}
.filter-row { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.filter-row:first-child { padding-top: 4px; }
.filter-row:last-of-type { border-bottom: none; }
.filter-lbl { display: flex; justify-content: space-between; align-items: baseline; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 10px; }
.filter-lbl-val { color: var(--ink); letter-spacing: .04em; font-size: 10px; }
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }

/* ── CHIP ── */
.chip {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; background: #fff; border: 1.5px solid var(--rule); border-radius: 6px;
  font-size: 12px; font-weight: 500; color: var(--ink-2);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.chip:hover { border-color: var(--ink-4); }
.chip .chip-swatch { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.chip .chip-icon { width: 12px; height: 12px; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; }
.chip .chip-icon-check {
  background-color: var(--ok);
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>");
          mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>");
}
.chip .chip-icon-heart {
  background-color: var(--accent);
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z'/></svg>");
          mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z'/></svg>");
  width: 11px; height: 11px;
}
.chip.state-dim { opacity: .5; }
.chip.state-force { background: var(--accent) !important; color: #fff !important; border-color: var(--accent) !important; }
.chip[data-filter="visited"].state-force { background: var(--ok) !important; border-color: var(--ok) !important; }
.chip.state-force .chip-swatch, .chip.state-force .chip-icon-check, .chip.state-force .chip-icon-heart { background: #fff !important; }
.chip.state-force svg { color: #fff !important; fill: #fff !important; stroke: #fff !important; }
.chip.chip-locked { position: relative; }
.chip.chip-locked::before {
  content: attr(data-tooltip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; font-size: 11px; line-height: 1.4; padding: 6px 10px; border-radius: 6px;
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 1000;
  font-family: 'Inter', sans-serif; font-weight: 400; box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.chip.chip-locked::after {
  content: ''; position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%);
  border: 4px solid transparent; border-top-color: var(--ink); pointer-events: none; opacity: 0; transition: opacity .15s;
}
.chip.chip-locked:hover::before, .chip.chip-locked:hover::after { opacity: 1; }
.chip.state-hide { background: var(--ink) !important; color: #fff !important; border-color: var(--ink) !important; }
.chip.state-hide .chip-swatch { background: #fff !important; }
.chip.state-hide:not(.chip-locked)::after { content: none; }
.chip .chip-count { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-5); margin-left: 2px; }
.chip .chip-filter-icon {
  display: none; width: 9px; height: 9px; margin-left: 2px; flex-shrink: 0; background: currentColor;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3'/></svg>") center/contain no-repeat;
}
.chip.state-dim .chip-count { display: none; }
.chip.state-dim .chip-filter-icon { display: inline-block; }
.chip.state-hide .chip-count { display: none; }
.chip.state-hide .chip-filter-icon { display: inline-block; background: #fff; }
.chip.all { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.all .chip-count { color: rgba(255,255,255,.5); }
.chip-lock { opacity: .5; }
.filter-chip { display: none; }

/* ── ERA TIMELINE ── */
.filter-timeline { position: relative; height: 70px; padding: 0 4px; }
.filter-timeline .ft-track { position: absolute; left: 4px; right: 4px; top: 20px; height: 4px; background: var(--rule); border-radius: 2px; }
.filter-timeline .ft-fill { position: absolute; top: 20px; height: 4px; background: var(--ink); border-radius: 2px; }
.filter-timeline .ft-h { position: absolute; top: 22px; transform: translate(-50%,-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.2); cursor: grab; z-index: 3; touch-action: none; }
.filter-timeline .ft-h:active { cursor: grabbing; }
.filter-timeline .ft-div { position: absolute; top: 14px; width: 1px; height: 16px; background: var(--rule-2); pointer-events: none; }
.filter-timeline .ft-lbl { position: absolute; top: 36px; transform: translateX(-50%); font-size: 10px; font-weight: 500; color: var(--ink-2); white-space: nowrap; pointer-events: none; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
.filter-timeline .ft-lbl.off { color: var(--ink-5); opacity: .4; }
.filter-timeline .ft-year { position: absolute; top: 54px; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-5); letter-spacing: .05em; pointer-events: none; }
.filter-timeline .ft-year-tick { position: absolute; top: 50px; width: 1px; height: 3px; background: var(--rule-2); transform: translateX(-50%); pointer-events: none; }
.filter-range-input { appearance: none; -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px; background: var(--rule); outline: none; margin-top: 2px; }
.filter-range-input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.filter-range-input::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); cursor: pointer; }
.filter-footer { display: flex; justify-content: flex-end; padding-top: 10px; }
.filter-reset { background: transparent; border: none; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); cursor: pointer; padding: 4px 0; }
.filter-reset:hover { color: var(--ink); }

/* ── SECTION LABEL ── */
.section-label {
  display: flex; align-items: center; gap: 12px;
  margin-top: 32px; margin-bottom: 10px;
}
#placesList.grid-mode .section-label { grid-column: 1 / -1; margin-top: 28px; margin-bottom: 8px; }
.section-label .sn { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-5); white-space: nowrap; }
.section-label .sl { flex: 1; height: 1px; background: var(--rule); }
.section-label .ct { font-size: 10px; color: var(--ink-5); }

/* ── LIST MODE ── */
#placesList {
  display: flex; flex-direction: column; gap: 0;
}
.place-section-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 5px; }

/* ── LIST CARD ── */
.place-card {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  align-items: stretch;
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
  cursor: pointer;
  transition: box-shadow .2s var(--ease), transform .2s var(--ease);
}
.place-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.09); transform: translateY(-1px); }
.place-card:hover .place-name { color: #000; }

.place-thumb {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 700;
  letter-spacing: -.04em; color: rgba(0,0,0,.10);
  min-height: 62px; flex-shrink: 0;
  background: #EFEFED;
}
.place-thumb[data-cat="arch"] { background: #EEF2F7; }
.place-thumb[data-cat="fun"]  { background: #F5F2E8; }
.place-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.place-thumb-fallback { position: relative; z-index: 1; pointer-events: none; }
.place-cat-line { position: absolute; top: 0; left: 0; bottom: 0; width: 3px; z-index: 2; }

/* body */
.place-body {
  position: relative;
  padding: 6px 6px 6px 8px;
  border-left: 1px solid var(--paper-2);
  min-width: 0; display: flex; flex-direction: column; justify-content: center;
}
.place-kick {
  display: flex; align-items: center; gap: 5px;
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-5); margin-bottom: 2px;
}
.place-kick .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.place-name {
  font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
  color: var(--ink); letter-spacing: -.01em; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color .15s;
}
.place-sub {
  font-size: 11px; color: var(--ink-4); margin-top: 2px; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* stamp — absolutně, zarovnán na střed POPISU (kick+name+sub), ne celé karty */
.place-stamp-body {
  position: absolute; bottom: 6px; right: 8px;
  width: 46px; height: 46px;
  pointer-events: none; z-index: 3;
}
.place-stamp-body svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* meta column — pevná šířka, nikdy se nemění, wish je zde */
.place-meta {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  gap: 4px; padding: 6px 6px;
  border-left: 1px solid var(--paper-2);
  width: 52px; flex-shrink: 0; flex-grow: 0;
}
.place-dist { font-size: 10px; color: var(--ink-5); font-family: 'Inter', sans-serif; text-align: center; white-space: nowrap; }
.place-dist-link {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  text-decoration: none; color: var(--ink-5);
  transition: color .15s;
}
.place-dist-link:hover { color: var(--ink-3); }
.place-dist-link.place-dist-grid { flex-direction: row; gap: 4px; }
.place-dist-icon svg { width: 12px; height: 12px; display: block; }
.place-dist-hint { font-size: 9px; color: var(--ink-5); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: center; }
.place-dist-hint:hover { color: var(--ink-4); }

/* meta-dist-grid: skrytý v listu, viditelný v gridu */
.meta-dist-grid { display: none; }

/* list: meta-wish-list viditelný, meta-right a meta-wish-grid skryté */
.meta-wish-list { display: flex; }
.meta-wish-grid { display: none; }
.place-meta-right { display: none; }

/* like/dislike */
.place-votes { display: flex; align-items: center; gap: 4px; }
.place-vote-btn {
  appearance: none; background: transparent; border: none;
  display: flex; align-items: center; gap: 3px;
  padding: 2px 5px; border-radius: 5px; cursor: pointer;
  color: var(--ink-5); transition: color .15s, background .15s;
  flex-shrink: 0;
}
.place-vote-btn:hover { background: var(--paper-3); color: var(--ink-2); }
.place-vote-btn.up.voted svg,
.place-vote-btn.down.voted svg { fill: var(--ink-2); stroke: var(--ink-5); }
.place-vote-btn svg { width: 14px; height: 14px; pointer-events: none; }
/* čísla liků — Inter 10px stejně v obou módech */
.place-vote-count {
  font-family: 'Inter', sans-serif;
  font-size: 10px; line-height: 1; color: inherit;
  min-width: 14px; text-align: left;
}
.place-kick .place-votes { margin-left: auto; }

/* wish wrapper */
.place-wish-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: pointer;
}
/* wish label — stejný font jako dist-hint */
.place-wish-lbl {
  font-size: 9px; font-family: 'Inter', sans-serif;
  color: var(--ink-5); text-align: center;
  white-space: nowrap; letter-spacing: .01em;
  pointer-events: none;
}
.place-wish-lbl.active { color: var(--accent); }

/* wish button */
.place-wish-btn {
  appearance: none; background: transparent; border: none;
  display: flex; align-items: center; justify-content: center;
  padding: 3px; border-radius: 6px; cursor: pointer;
  color: var(--ink-5); position: relative;
  transition: color .15s; flex-shrink: 0;
}
.place-wish-btn:hover { color: var(--ink-3); }
.place-wish-btn.wished { color: var(--accent); }
.place-wish-btn svg { width: 16px; height: 16px; pointer-events: none; }
.place-wish-lock {
  position: absolute; top: 0; right: 0;
  width: 9px; height: 9px; background: var(--ink-4); border-radius: 50%;
}
.place-wish-lock::after {
  content: ''; position: absolute; inset: 0; margin: auto; width: 5px; height: 5px; background: white;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center/contain no-repeat;
}

/* dist-hint: šedé, kurzíva, bez podtržení */
.place-dist-hint {
  font-size: 9px; font-family: 'Inter', sans-serif;
  font-style: italic; color: var(--ink-4);
  cursor: pointer; text-align: center; line-height: 1.3;
  pointer-events: auto; text-decoration: none;
}

// nav.js nastavuje body.style.paddingRight inline — v landscape na mobilu

(function fixLandscapePadding() {
  function apply() {
    const isLandscapeMobile = window.innerWidth < 820 && window.innerWidth > window.innerHeight;
    if (isLandscapeMobile) {
      document.body.style.paddingRight = '0';
      document.body.style.paddingBottom = '';
      const page = document.querySelector('.page');
      if (page) { page.style.paddingRight = '74px'; page.style.paddingLeft = '10px'; }
    } else if (window.innerWidth < 820) {
      // portrait — nav je dole, body padding-bottom nastavuje nav.js, page okraje reset
      const page = document.querySelector('.page');
      if (page) { page.style.paddingRight = ''; page.style.paddingLeft = ''; }
    }
  }
  // Spustit po nav.js (který běží v rAF)
  requestAnimationFrame(() => requestAnimationFrame(apply));
  window.addEventListener('resize', apply);
  window.addEventListener('orientationchange', () => setTimeout(apply, 100));
})();

const STAMP_PROPS = { orientation: 'sealF', style: 'rough', castle: 'ink', eccentric: true };

function arScoreToStampScore(arScore) {
  if (arScore == null || arScore === 0) return 1;
  if (arScore <= 25) return 25;
  if (arScore <= 50) return 45;
  if (arScore <= 75) return 65;
  return 90;
}

function makeStampSVG(p, arScore) {
  if (!window.stampSVG) return ''; // stamp.js ještě nenačteno
  return window.stampSVG({
    ...STAMP_PROPS,
    code:      p.id,
    name:      p.name,
    year:      p.yearBuilt || p.yearThen || '',
    cat:       p.cat,
    score:     arScoreToStampScore(arScore),
    dateLabel: '',
    k:         p.id,
  });
}

/* ── Auth / session ── */
function getSession() { try { return JSON.parse(localStorage.getItem('lop_auth_session') || 'null'); } catch(e) { return null; } }
async function getValidSession() {
  const s = getSession();
  if (!s?.access_token || !s?.user) return null;
  const nowSec = Math.floor(Date.now() / 1000);
  if ((s.expires_at || 0) > nowSec + 60) return s;
  if (!s.refresh_token) return null;
  try {
    const r = await fetch(SUPA_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if (!r.ok) { localStorage.removeItem('lop_auth_session'); return null; }
    const data = await r.json();
    localStorage.setItem('lop_auth_session', JSON.stringify({ ...data, user: data.user || s.user }));
    return data;
  } catch(e) { return null; }
}
function isLoggedIn() { try { const s = getSession(); return !!(s && s.access_token && s.user); } catch(e) { return false; } }
function getWished()  { try { return JSON.parse(localStorage.getItem(WISH_KEY)  || '[]').map(String); } catch(e) { return []; } }

function haversineM(lat1, lng1, lat2, lng2) {
  const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function buildEraTimeline() {
  const el=document.getElementById('eraTimeline'); if(!el) return;
  const years=[1000,1400,1800,2000], html=[];
  html.push('<div class="ft-track"></div>','<div class="ft-fill" id="eraFill"></div>');
  ERAS.slice(1).forEach(e=>html.push(`<span class="ft-div" style="left:${eraPct(e.from)}%"></span>`));
  ERAS.forEach(e=>{ const mid=(e.from+e.to)/2, w=eraPct(e.to)-eraPct(e.from); html.push(`<span class="ft-lbl" data-era="${e.id}" style="left:${eraPct(mid)}%;max-width:calc(${w}% - 4px)">${e.name}</span>`); });
  years.forEach(y=>{ html.push(`<span class="ft-year-tick" style="left:${eraPct(y)}%"></span>`,`<span class="ft-year" style="left:${eraPct(y)}%">${y===2000?'souč.':y}</span>`); });
  html.push('<div class="ft-h" id="eraHFrom" data-which="from"></div>','<div class="ft-h" id="eraHTo" data-which="to"></div>');
  el.innerHTML=html.join(''); renderEra();
  el.querySelectorAll('.ft-h').forEach(h=>{
    const onDown=ev=>{
      ev.preventDefault(); const which=h.dataset.which, rect=el.getBoundingClientRect();
      const onMove=e=>{ const cx=e.touches?e.touches[0].clientX:e.clientX; const p=Math.max(0,Math.min(1,(cx-rect.left)/rect.width)), y=pctToYear(p); if(which==='from') ERA_STATE.from=Math.min(y,ERA_STATE.to-20); else ERA_STATE.to=Math.max(y,ERA_STATE.from+20); renderEra(); applyFilter(); };
      const onUp=()=>{ window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); window.removeEventListener('touchmove',onMove); window.removeEventListener('touchend',onUp); };
      window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp);
      window.addEventListener('touchmove',onMove,{passive:false}); window.addEventListener('touchend',onUp);
    };
    h.addEventListener('mousedown',onDown); h.addEventListener('touchstart',onDown,{passive:false});
  });
}

function renderEra() {
  const fromP=eraPct(ERA_STATE.from), toP=eraPct(ERA_STATE.to);
  const fromH=document.getElementById('eraHFrom'), toH=document.getElementById('eraHTo'), fill=document.getElementById('eraFill');
  if(fromH) fromH.style.left=fromP+'%'; if(toH) toH.style.left=toP+'%';
  if(fill){ fill.style.left=fromP+'%'; fill.style.width=(toP-fromP)+'%'; }
  const fv=document.getElementById('eraFromV'), tv=document.getElementById('eraToV');
  if(fv) fv.textContent=ERA_STATE.from; if(tv) tv.textContent=ERA_STATE.to>=2025?'2000+':ERA_STATE.to;
  document.querySelectorAll('.ft-lbl').forEach(lbl=>{ const era=ERAS.find(e=>e.id===lbl.dataset.era); if(era) lbl.classList.toggle('off',!(era.to>ERA_STATE.from&&era.from<ERA_STATE.to)); });
}

function initDistSlider() {
  const slider=document.getElementById('distSlider'), label=document.getElementById('distV'); if(!slider) return;
  slider.addEventListener('input',()=>{
    const v=+slider.value;
    if(v>=100){ DIST_STATE.max=null; label.textContent='libovolná'; }
    else{ DIST_STATE.max=0.2+(v/100)*4.8; label.textContent='< '+DIST_STATE.max.toFixed(1)+' km'; }
    applyFilter();
  });
}

function haversineKm(a,b) {
  const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  const lat1=a[0]*Math.PI/180, lat2=b[0]*Math.PI/180;
  return 2*R*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2));
}

function resetFilters() {
  FILTER.hist=FILTER.arch=FILTER.fun='full'; FILTER.visited=FILTER.wished='full';
  ERA_STATE.from=ERA_START; ERA_STATE.to=ERA_END; DIST_STATE.max=null;
  document.querySelectorAll('.filter-chips .chip').forEach(c=>c.classList.remove('state-hide','state-dim','state-force'));
  const ds=document.getElementById('distSlider'); if(ds) ds.value=100;
  const dv=document.getElementById('distV'); if(dv) dv.textContent='libovolná';
  renderEra(); applyFilter();
}

function locYear(p) {
  if(p.yearBuilt) return p.yearBuilt;
  const parse=s=>{ const v=String(s), y=v.match(/\d{3,4}/); if(y) return parseInt(y[0]); const cc=v.match(/(\d{1,2})\.\s*stol/i); if(cc) return (parseInt(cc[1])-1)*100+50; return null; };
  if(p.facts){ for(const f of p.facts){ if(/postaveno|otevřeno|dokončeno|vybudováno/i.test(f.k)){ const y=parse(f.v); if(y) return y; } } for(const f of p.facts){ const y=parse(f.v); if(y) return y; } }
  if(p.yearThen){ const y=parse(p.yearThen); if(y) return y; }
  return null;
}

function applyFilter() { render(); }

document.addEventListener('click', e=>{

async function loadPlaces() {
  try {
    const res=await fetch('places.json'); if(!res.ok) throw new Error('404');
    PLACES=await res.json();
  } catch(e) {
    document.getElementById('placesList').innerHTML='<div class="empty"><h3>Nepodařilo se načíst místa</h3><p>Zkontrolujte připojení.</p></div>';
    return;
  }
  updateCounts();
}

function updateCounts() {
  const visited=getVisited(), wished=getWished(), loggedIn=isLoggedIn();
  const lockSVG='<svg class="chip-lock" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  const el=id=>document.getElementById(id);
  const chipV=el('chipVisited'),chipW=el('chipWished'),wrapV=el('ctVisitedWrap'),wrapW=el('ctWishedWrap');
  if(chipV) chipV.classList.toggle('chip-locked',!loggedIn);
  if(chipW) chipW.classList.toggle('chip-locked',!loggedIn);
  if(wrapV) wrapV.innerHTML=loggedIn?'<span class="count">'+PLACES.filter(p=>visited.includes(String(p.id))).length+'</span>':lockSVG;
  if(wrapW) wrapW.innerHTML=loggedIn?'<span class="count">'+PLACES.filter(p=>wished.includes(String(p.id))).length+'</span>':lockSVG;
}

function render() {
  const visited=getVisited(), wished=getWished();
  const eraActive=ERA_STATE.from>ERA_START||ERA_STATE.to<ERA_END;
  const distActive=DIST_STATE.max!==null&&userPos;

  const filtered=PLACES.filter(p=>{
    const wish=wished.includes(String(p.id)), vis=visited.includes(String(p.id));
    const catState=FILTER[p.cat], wishState=FILTER.wished, visState=FILTER.visited;
    let s='full';
    if      (wishState==='force'&&wish) s='full';
    else if (visState==='force'&&vis)   s='full';
    else if (catState==='hide')          s='hide';
    else if (wishState==='hide'&&wish)   s='hide';
    else if (visState==='hide'&&vis)     s='hide';
    else {
      const votes=[catState];
      if(wish) votes.push(wishState); if(vis) votes.push(visState);
      s=votes.reduce((best,v)=>RANK[v]<=RANK[best]?v:best,'hide');
    }
    if(s==='hide') return false;
    if(eraActive){ const y=locYear(p); if(y!=null&&(y<ERA_STATE.from||y>ERA_STATE.to)) return false; }
    if(distActive){ if(haversineKm([userPos[0],userPos[1]],[p.lat,p.lng])>DIST_STATE.max) return false; }
    return true;
  });

  if(filtered.length===0){
    document.getElementById('placesList').innerHTML='<div class="empty"><h3>Žádná místa</h3><p>Zkuste jiný filtr.</p></div>';
    return;
  }

  let html='';
  ['hist','arch','fun'].forEach(cat=>{
    const items=filtered.filter(p=>p.cat===cat); if(!items.length) return;
    html += `<div class="section-label section-${cat}"><span class="sn">${CAT_NAME[cat]}</span><div class="sl"></div><span class="ct">${items.length}</span></div>`;
    html += `<div class="place-section-list">`;
    html += items.map(p=>cardHTML(p,visited,wished)).join('');
    html += `</div>`;
  });

  const list=document.getElementById('placesList');
  list.innerHTML=html;
  list.classList.toggle('grid-mode', viewMode==='grid');
  const _cnt=document.getElementById('filterHeadActive'); if(_cnt) _cnt.textContent=filtered.length;
  const _tot=document.getElementById('filterHeadTotal'); if(_tot) _tot.textContent='/'+PLACES.length;
  const _fbtn=document.getElementById('filterBtn');
  if(_fbtn) _fbtn.classList.toggle('has-filter', filtered.length < PLACES.length);
  updateChipCounts();
}

function cardHTML(p, visited, wished) {
  const color   = CAT_COLOR[p.cat]  || '#4A4A48';
  const letter  = CAT_LETTER[p.cat] || 'H';
  const catName = CAT_NAME[p.cat]   || '';
  const vis     = visited.includes(String(p.id));
  const wish    = wished && wished.includes(String(p.id));
  const thumb   = p.thumb || '';
  const lede    = p.lede  || '';
  const detailUrl = 'place/' + p.id + '.html';
  const dist = userPos && p.lat && p.lng ? formatDist(haversineM(userPos[0],userPos[1],p.lat,p.lng)) : '';
  const loggedIn = isLoggedIn();

  // Stamp pro navštívená místa — vždy přes pravý horní roh textu
  const arScore = _arScores[String(p.id)] ?? null;
  const stampHtml = vis && loggedIn
    ? `<div class="place-stamp-body">${makeStampSVG(p, arScore)}</div>`
    : '';

  // Vzdálenost + odkaz na kompas
  const compassUrl = p.lat && p.lng
    ? `compass.html?id=${p.id}&lat=${p.lat}&lng=${p.lng}&name=${encodeURIComponent(p.name)}${p.thumb?'&thumb='+encodeURIComponent(p.thumb):''}${p.arRadius?'&radius='+p.arRadius:''}`
    : null;

  const compassIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>`;

  // Seznam: ikona nad číslem (flex-column)
  const distListHtml = dist
    ? `<a class="place-dist place-dist-link" href="${compassUrl||'#'}" onclick="event.stopPropagation()" title="Navigovat na místo">
        <span class="place-dist-icon list">${compassIcon}</span>
        <span>${dist}</span>
       </a>`
    : `<span class="place-dist-hint place-dist-hint-list" onclick="requestLoc(event)">povolit<br>polohu</span>`;

  // Dlaždice: ikona před číslem (flex-row)
  const distGridHtml = dist
    ? `<a class="place-dist place-dist-link place-dist-grid" href="${compassUrl||'#'}" onclick="event.stopPropagation()" title="Navigovat na místo">
        <span class="place-dist-icon grid">${compassIcon}</span>
        <span>${dist}</span>
       </a>`
    : `<span class="place-dist-hint" onclick="requestLoc(event)">povolit polohu</span>`;

  // Like/dislike — čisté šipky, s počty (TODO: Supabase)
  const voteUp   = p._voteUp   ?? Math.floor(Math.random()*40+2);  // placeholder
  const voteDown = p._voteDown ?? Math.floor(Math.random()*8);      // placeholder
  const votedUp   = p._votedUp   || false;
  const votedDown = p._votedDown || false;

  // Vote ikony — thumbs up/down, stejná tloušťka a barva linky jako srdce (stroke-width 1.5, var(--ink-5))
  const arrowUp   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>`;
  const arrowDown = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>`;

  const votesHtml = `<div class="place-votes">
    <button class="place-vote-btn up${votedUp?' voted':''}" onclick="votePlace(event,'${p.id}','up')" title="Líbí se">
      ${arrowUp}<span class="place-vote-count">${voteUp}</span>
    </button>
    <button class="place-vote-btn down${votedDown?' voted':''}" onclick="votePlace(event,'${p.id}','down')" title="Nelíbí se">
      ${arrowDown}<span class="place-vote-count">${voteDown}</span>
    </button>
  </div>`;

  // Wish — s labelem, obaleno v place-wish-wrap
  const wishLbl = `<span class="place-wish-lbl${wish?' active':''}">${wish?'v plánu':'do plánu?'}</span>`;
  const wishBtn = loggedIn
    ? `<div class="place-wish-wrap" onclick="toggleWish(event,'${p.id}')">
        ${wishLbl}
        <button class="place-wish-btn ${wish?'wished':''}" title="${wish?'Odebrat z plánu':'Přidat do plánu'}">

  return `<div class="place-card" data-cat="${p.cat}" onclick="location.href='${detailUrl}'">

      <div class="place-cat-line" style="background:${color}"></div>
      <div class="place-cat-pill"><span class="dot" style="background:${color}"></span>${catName}</div>
    </div>
    <div class="place-body">
      <div class="place-kick">
        <span class="dot" style="background:${color}"></span>
        <span>${catName}</span>
        ${votesHtml}
      </div>
      <div class="place-name">${p.name}</div>
      <div class="place-sub">${lede}</div>
      ${stampHtml}
    </div>
    <div class="place-meta">
      ${distListHtml}
      <span class="meta-wish-list">${wishBtn}</span>
      <span class="meta-dist-grid">${distGridHtml}</span>
      <div class="place-meta-right">${votesHtml}</div>
      <span class="meta-wish-grid">${wishBtn}</span>
    </div>
  </div>`;
}

function votePlace(e, id, dir) {
  e.preventDefault(); e.stopPropagation();
  // TODO: napojit na Supabase votes tabulku
  const btn = e.currentTarget;
  const card = btn.closest('.place-card');
  const allUp   = card.querySelectorAll('.place-vote-btn.up');
  const allDown = card.querySelectorAll('.place-vote-btn.down');
  if (dir === 'up') {
    const wasVoted = btn.classList.contains('voted');
    allUp.forEach(b => b.classList.toggle('voted', !wasVoted));
    allDown.forEach(b => b.classList.remove('voted'));
  } else {
    const wasVoted = btn.classList.contains('voted');
    allDown.forEach(b => b.classList.toggle('voted', !wasVoted));
    allUp.forEach(b => b.classList.remove('voted'));
  }
}

function toggleWish(e, id) {
  e.preventDefault(); e.stopPropagation();
  const wrap = e.currentTarget.closest ? e.currentTarget.closest('.place-wish-wrap') : e.currentTarget;
  const btn = wrap ? wrap.querySelector('.place-wish-btn') : null;
  const lbl = wrap ? wrap.querySelector('.place-wish-lbl') : null;
  const w=[...new Set(getWished())], idx=w.indexOf(String(id));
  if(idx>=0){ w.splice(idx,1); dbRemoveWish(id); } else{ w.push(String(id)); dbAddWish(id); }
  localStorage.setItem(WISH_KEY, JSON.stringify(w));
  const wished=idx<0;
  if(btn) {
    btn.classList.toggle('wished', wished);
    const svg = btn.querySelector('svg');
    if(svg) svg.setAttribute('fill', wished ? 'currentColor' : 'none');
  }
  if(lbl) {
    lbl.textContent = wished ? 'v plánu' : 'do plánu?';
    lbl.classList.toggle('active', wished);
  }
  updateCounts();
  if(window.lopNav) window.lopNav.refresh();
}

function authHeaders() {

  return { 'apikey':SUPA_KEY, 'Authorization':'Bearer '+(s?.access_token||SUPA_KEY), 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates' };

function dbAddWish(id)    { getValidSession().then(s=>{if(!s?.user) return; fetch(SUPA_URL+'/rest/v1/wishlist',{method:'POST',headers:authHeaders(),body:JSON.stringify({user_id:s.user.id,place_id:String(id)})}).catch(()=>{}); }); }
function dbRemoveWish(id) { getValidSession().then(s=>{if(!s?.user) return; fetch(SUPA_URL+'/rest/v1/wishlist?user_id=eq.'+s.user.id+'&place_id=eq.'+id,{method:'DELETE',headers:authHeaders()}).catch(()=>{}); }); }

async function syncFromDB(onDone) {
  const s=await getValidSession();
  if(!s?.access_token||!s?.user){ if(onDone) onDone(); return; }
  const SYNC_TIMEOUT_MS=10000;
  function _injectSyncUI() {
    if(document.getElementById('lop-sync-bar')) return;
    const style=document.createElement('style');
    style.textContent='#lop-sync-bar{position:fixed;bottom:0;left:0;right:0;z-index:8000;background:rgba(17,17,17,.85);color:#F8F8F6;padding:10px 16px;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.4;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.8,.36,1);font-family:Inter,system-ui,sans-serif;backdrop-filter:blur(10px);}#lop-sync-bar.show{transform:translateY(0);}#lop-sync-bar .sb-text{flex:1;}#lop-sync-bar .sb-retry{flex-shrink:0;background:transparent;border:1px solid rgba(248,248,246,.4);color:#F8F8F6;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;}#lop-sync-spinner{position:fixed;bottom:0;left:0;right:0;z-index:7999;height:2px;background:linear-gradient(90deg,transparent,#B04020,transparent);background-size:200% 100%;animation:lop-slide 1.4s linear infinite;opacity:0;transition:opacity .2s;}#lop-sync-spinner.show{opacity:1;}@keyframes lop-slide{0%{background-position:200% 0;}100%{background-position:-200% 0;}}';
    document.head.appendChild(style);
    const spinner=document.createElement('div'); spinner.id='lop-sync-spinner'; document.body.appendChild(spinner);
    const bar=document.createElement('div'); bar.id='lop-sync-bar';
    bar.innerHTML='<span class="sb-text">Nepodařilo se načíst data ze serveru.</span><button class="sb-retry" onclick="window._lopSyncRetry()">Zkusit znovu</button>';
    document.body.appendChild(bar);
  }
  function _showSyncSpinner(on){ const el=document.getElementById('lop-sync-spinner'); if(el) el.classList.toggle('show',on); }
  function _showSyncBar(on){
    const el=document.getElementById('lop-sync-bar'); if(!el) return;
    if(on){ const nav=document.getElementById('lop-nav'); el.style.bottom=(window.innerWidth<820?nav?.getBoundingClientRect().height||56:0)+'px'; }
    el.classList.toggle('show',on);
  }
  _injectSyncUI(); _showSyncSpinner(true); _showSyncBar(false);
  window._lopSyncRetry=()=>{ _showSyncBar(false); syncFromDB(()=>{ render(); updateCounts(); }); };
  const ft=(url,opts)=>new Promise((res,rej)=>{ const t=setTimeout(()=>rej(new Error('timeout')),SYNC_TIMEOUT_MS); fetch(url,opts).then(r=>{clearTimeout(t);res(r);}).catch(e=>{clearTimeout(t);rej(e);}); });
  try {
    const [wRes,vRes]=await Promise.all([
      ft(SUPA_URL+'/rest/v1/wishlist?user_id=eq.'+s.user.id+'&select=place_id',{headers:authHeaders()}),
      ft(SUPA_URL+'/rest/v1/visited?user_id=eq.'+s.user.id+'&select=place_id,score',{headers:authHeaders()}),
    ]);
    if(!wRes.ok||!vRes.ok) throw new Error('HTTP '+(!wRes.ok?wRes.status:vRes.status));
    localStorage.setItem(WISH_KEY,  JSON.stringify((await wRes.json()).map(r=>String(r.place_id))));
    const vRows = await vRes.json();
    localStorage.setItem(VISIT_KEY, JSON.stringify(vRows.map(r=>String(r.place_id))));
    // Ulož AR score pro razítka
    _arScores = {};
    vRows.forEach(r => { _arScores[String(r.place_id)] = r.score ?? null; });
    fetch(SUPA_URL+'/rest/v1/profiles?user_id=eq.'+s.user.id+'&select=role',{headers:authHeaders()})
      .then(r=>r.ok?r.json():[]).then(rows=>{if(rows[0]?.role) localStorage.setItem('lop_user_role',rows[0].role);}).catch(()=>{});
    _showSyncSpinner(false); _showSyncBar(false); if(onDone) onDone();
  } catch(e) {
    _showSyncSpinner(false); _showSyncBar(true);
    const sb=document.getElementById('lop-sync-bar'); if(sb){const t=sb.querySelector('.sb-text');if(t) t.textContent='Chyba: '+(e?.message||String(e));}
    if(onDone) onDone();
  }
}

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a1a18"/>
<title>Přehled míst — LayersOfPrague</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:   #eeefeb;
  --paper-2: #e6e7e2;
  --paper-3: #dadcd4;
  --ink:     #1a1a18;
  --ink-2:   #3a3a36;
  --ink-3:   #6a6a64;
  --ink-4:   #9a9a94;
  --rule:    #cbcec5;
  --accent:  #b04020;
  --ok:      #3d7a4a;
  --cat-hist: #4A4A48;
  --cat-arch: #3B5F84;
  --cat-fun:  #E0A020;
  --ease:    cubic-bezier(.22,.8,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; min-height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ── PAGE ── */
.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 18px 100px;
}

/* ── HERO ── */
.hero-section { margin-bottom: 28px; }
.kick {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 6px;
}
.page-title {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1; letter-spacing: -.02em;
  color: var(--ink);
}
.page-title em { font-style: italic; color: var(--ink-3); }
.page-intro {
  font-size: 14px; color: var(--ink-3);
  margin-top: 10px; line-height: 1.55;
  max-width: 34em;
}

/* ── FILTRY ── */
.filter-row {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.filter-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 100px;
  font-size: 12px; font-weight: 500;
  color: var(--ink-2); cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  appearance: none;
  font-family: inherit;
}
.filter-chip:hover { border-color: var(--ink-3); }

.filter-chip.state-hide { opacity: .35; }

.filter-chip .dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}
.filter-chip .count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; opacity: .6;
}

/* ── SEKCE ── */
.section-label {
  display: flex; align-items: baseline; justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 4px;
}
.section-label .ct { color: var(--ink-4); }

/* ── PLACE CARD ── */
.place-card {
  display: grid;
  grid-template-columns: 72px 1fr auto;
  align-items: center; gap: 14px;
  padding: 14px 0;
  border-top: 1px solid var(--rule);
  cursor: pointer;
  transition: background .15s;
  text-decoration: none; color: inherit;
  width: 100%;
}
.place-card:first-of-type { border-top: none; padding-top: 6px; }
.place-card:hover .place-name { color: var(--accent); }

.place-thumb {
  width: 72px; height: 72px;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
  background: var(--paper-3);
  grid-column: 1;
}
.place-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.place-thumb-fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-style: italic; font-size: 28px;
  color: rgba(26,24,20,.3);
}
.place-id {
  position: absolute; bottom: 4px; right: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; font-weight: 600;
  color: var(--paper);
  background: rgba(26,24,20,.5);
  border-radius: 3px; padding: 1px 4px;
}

.place-body { min-width: 0; }
.place-kick {
  display: flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 3px;
}
.place-kick .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.place-name {
  font-family: 'Fraunces', serif;
  font-size: 18px; font-weight: 500;
  line-height: 1.2; color: var(--ink);
  transition: color .15s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.place-sub {
  font-size: 12.5px; color: var(--ink-3);
  margin-top: 3px; line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

.place-meta {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  flex-shrink: 0; align-self: center; justify-self: end;
}
.place-visited {
  width: 14px; height: 14px;
  background: var(--ok);
  display: none;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>") center/contain no-repeat;
  filter: drop-shadow(0 0 1px rgba(255,255,255,.8));
}
.place-visited.show { display: block; margin: 0 auto; }
.place-visited-lbl { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ok); letter-spacing: .06em; text-align: center; margin-top: 2px; }
.place-year {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-4);
  letter-spacing: .06em;
}
.place-dist {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-4);
  letter-spacing: .06em;
}
.place-wish-btn {
  appearance: none; background: transparent; border: none;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 4px 6px; border-radius: 8px;
  cursor: pointer; color: var(--ink-4);
  transition: background .15s, color .15s;
  flex-shrink: 0;
}
.place-wish-btn:hover { background: var(--paper-2); color: var(--ink-2); }
a.place-wish-btn { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 8px; cursor: pointer; color: var(--ink-4); transition: background .15s, color .15s; flex-shrink: 0; width: 47px; box-sizing: border-box; }
.place-wish-btn.wished { color: var(--accent); }
.place-wish-btn svg { width: 16px; height: 16px; pointer-events: none; }
.place-wish-lbl { font-size: 9px; font-weight: 500; letter-spacing: .01em; pointer-events: none; }
/* vzdálenost */
.place-dist-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; min-width: 44px; text-align: center; }
.place-dist { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-4); letter-spacing: .06em; }
.place-dist-hint { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-4); letter-spacing: .06em; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.place-dist-hint:hover { color: var(--ink-3); }

/* ── PRÁZDNÝ STAV ── */
.empty {
  text-align: center; padding: 48px 20px;
  color: var(--ink-3);
}
.empty h3 {
  font-family: 'Fraunces', serif;
  font-size: 22px; font-weight: 400;
  color: var(--ink); margin-bottom: 8px;
}

/* ── LOADING ── */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 48px; color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
}

.filter-bar {
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 12px;
  box-shadow: 0 3px 18px rgba(26,24,20,.08);
  overflow: visible;
  pointer-events: auto;
}
.filter-head {
  width: 100%;
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 14px;
  background: transparent; border: none; cursor: pointer;
  font-family: inherit;
  color: var(--ink);
}
.filter-head-lead {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px;
}
.filter-head-dots { display: flex; gap: 3px; }
.filter-head-dots span {
  width: 7px; height: 7px; border-radius: 50%;
}
.filter-head-lbl { font-weight: 500; }
.filter-head-cnt {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .08em;
  color: var(--ink-4);
  text-transform: uppercase;
}
.filter-head-chev {
  color: var(--ink-3);
  transition: transform .28s var(--ease);
  display: flex;
}
.filter-bar.open .filter-head-chev { transform: rotate(180deg); }
.filter-panel {
  max-height: 0;
  overflow: hidden;
  transition: max-height .32s var(--ease);
  border-top: 0 solid var(--rule);
}
.filter-bar.open .filter-panel {
  max-height: 480px;
  border-top: 1px solid var(--rule);
}
.filter-panel-inner {
  padding: 14px 16px 12px;
  background: var(--paper-2);
}
.filter-row {
  padding: 10px 0;
  border-bottom: 1px solid var(--rule);
}
.filter-row:first-child { padding-top: 4px; }
.filter-row:last-of-type { border-bottom: none; }
.filter-lbl {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 8px;
}
.filter-lbl-val {
  color: var(--ink);
  letter-spacing: .04em;
  font-size: 10px;
}
.filter-chips {
  display: flex; gap: 6px; flex-wrap: wrap;
}

.filter-timeline {
  position: relative;
  height: 70px;
  padding: 0 4px;
}
.filter-timeline .ft-track {
  position: absolute; left: 4px; right: 4px; top: 20px;
  height: 4px; background: var(--rule); border-radius: 2px;
}
.filter-timeline .ft-fill {
  position: absolute; top: 20px;
  height: 4px; background: var(--ink); border-radius: 2px;
}
.filter-timeline .ft-h {
  position: absolute; top: 22px; transform: translate(-50%, -50%);
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--ink);
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
  cursor: grab; z-index: 3;
  touch-action: none;
}
.filter-timeline .ft-h:active { cursor: grabbing; }
.filter-timeline .ft-div {
  position: absolute; top: 14px;
  width: 1px; height: 16px;
  background: var(--rule-2);
  pointer-events: none;
}
.filter-timeline .ft-lbl {
  position: absolute; top: 36px;
  transform: translateX(-50%);
  font-size: 10px; font-weight: 500;
  color: var(--ink-2);
  white-space: nowrap;
  pointer-events: none;
  max-width: 90px;
  overflow: hidden; text-overflow: ellipsis;
}
.filter-timeline .ft-lbl.off { color: var(--ink-4); opacity: .5; }
.filter-timeline .ft-year {
  position: absolute; top: 54px;
  transform: translateX(-50%);
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--ink-4);
  letter-spacing: .05em;
  pointer-events: none;
}
.filter-timeline .ft-year-tick {
  position: absolute; top: 50px;
  width: 1px; height: 3px; background: var(--rule-2);
  transform: translateX(-50%);
  pointer-events: none;
}

.filter-range-input {
  appearance: none; -webkit-appearance: none;
  width: 100%; height: 4px; border-radius: 2px;
  background: var(--rule);
  outline: none;
  margin-top: 2px;
}
.filter-range-input::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--ink);
  cursor: pointer;
  box-shadow: 0 1px 3px rgba(0,0,0,.2);
}
.filter-range-input::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--paper); border: 2px solid var(--ink);
  cursor: pointer;
}

.filter-footer {
  display: flex; justify-content: flex-end;
  padding-top: 10px;
}
.filter-reset {
  background: transparent;
  border: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3);
  cursor: pointer;
  padding: 4px 0;
}
.filter-reset:hover { color: var(--ink); }

.chip {
  flex-shrink: 0;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 13px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 100px;
  font-size: 12px; font-weight: 500;
  color: var(--ink-2);
  cursor: pointer;
  transition: all .15s;
  box-shadow: 0 2px 10px rgba(26,24,20,.05);
  white-space: nowrap;
}
.chip:hover { border-color: var(--ink-3); }
.chip .chip-swatch {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}
.chip .chip-icon {
  width: 13px; height: 13px; border-radius: 0;
  background: transparent;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center; mask-position: center;
  -webkit-mask-size: contain; mask-size: contain;
  filter: drop-shadow(0 0 1px var(--paper));
}
.chip .chip-icon-check {
  background-color: var(--ok);
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>");
          mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>");
}
.chip .chip-icon-heart {
  background-color: var(--accent);
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z'/></svg>");
          mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z'/></svg>");
  width: 11px; height: 11px;
}
.chip.state-dim { opacity: .55; }
.chip.state-dim .chip-swatch { opacity: .4; }
.chip.state-force { background: var(--accent) !important; color: var(--paper) !important; border-color: var(--accent) !important; opacity: 1; }
.chip[data-filter="visited"].state-force { background: var(--accent) !important; border-color: var(--accent) !important; }
.chip.state-force .chip-swatch { background: var(--paper) !important; }
.chip.state-force .chip-icon-heart { background: var(--paper) !important; }
.chip.state-force svg { color: var(--paper) !important; fill: var(--paper) !important; stroke: var(--paper) !important; }
.chip.chip-locked { cursor: pointer; position: relative; }
.chip.chip-locked .chip-lock { opacity: .5; }
.chip.chip-locked::before {
  content: attr(data-tooltip);
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  font-size: 11px; line-height: 1.4;
  padding: 6px 10px; border-radius: 6px;
  white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity .15s;
  z-index: 1000;
  font-family: 'Inter', sans-serif; font-weight: 400;
  box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.chip.chip-locked::after {
  content: ''; position: absolute; bottom: calc(100% + 2px); left: 50%;
  transform: translateX(-50%);
  border: 4px solid transparent; border-top-color: var(--ink);
  pointer-events: none; opacity: 0; transition: opacity .15s;
}
.chip.chip-locked:hover::before,
.chip.chip-locked:hover::after { opacity: 1; }
.chip.state-force .chip-icon-check { background: var(--paper) !important; }

.chip.state-hide { background: var(--ink) !important; color: var(--paper) !important; border-color: var(--ink) !important; opacity: 1; }
.chip.state-hide .chip-swatch { background: var(--paper) !important; }
.chip.state-hide:not(.chip-locked)::after { content: none; }
.chip .chip-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-4);
  margin-left: 2px;
}
.chip .chip-filter-icon {
  display: none;
  width: 9px; height: 9px; margin-left: 2px; flex-shrink: 0;
  background: currentColor;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3'/></svg>") center/contain no-repeat;
}
.chip.state-dim .chip-count { display: none; }
.chip.state-dim .chip-filter-icon { display: inline-block; }
.chip.state-hide .chip-count { display: none; }
.chip.state-hide .chip-filter-icon { display: inline-block; background: var(--paper); }
.chip.all { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip.all .chip-count { color: rgba(255,255,255,.55); }


.place-wish-lock {
  position: absolute; top: 0; right: 2px;
  width: 12px; height: 12px;
  background: var(--accent);
  border-radius: 50%;
}
.place-wish-lock::after {
  content: '';
  position: absolute; inset: 0; margin: auto;
  width: 7px; height: 7px;
  background: white;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center/contain no-repeat;
}
.map-header { position: relative; top: auto; left: auto; right: auto; pointer-events: auto; margin-bottom: 20px; }
</style>
</head>
<body>

<div id="lop-header"></div>
<script src="header.js"></script>

<div class="page">

  <div class="hero-section">
    <div class="kick">Layers of Prague</div>
    <h1 class="page-title">Přehled <em>míst</em></h1>
    <p class="page-intro">Všechna místa seřazená podle kategorie. Kliknutím otevřete detail, historické fotografie a AR záběr.</p>
  </div>

  <!-- Filtry -->
  <div class="map-header" style="position:relative;top:auto;left:auto;right:auto;margin-bottom:20px;pointer-events:auto;">
    <div class="filter-bar" id="filterBar">
          <button class="filter-head" id="filterHead" onclick="toggleFilter()">
            <span class="filter-head-lead">
              <span class="filter-head-dots">
                <span style="background:var(--cat-hist)"></span>
                <span style="background:var(--cat-arch)"></span>
                <span style="background:var(--cat-fun)"></span>
              </span>
              <span class="filter-head-lbl">Filtr</span>
              <span class="filter-head-cnt" id="filterHeadCnt">· <span id="filterHeadActive">26</span> MÍST</span>
            </span>

<script>
// Pročisti localStorage od duplicit při načtení
(function() {
  try {
    ['lop_wishlist_v2','lop_visited_v1'].forEach(key => {
      const raw = JSON.parse(localStorage.getItem(key) || '[]');
      const clean = [...new Set(raw.map(String).filter(x => x && x !== 'undefined' && x !== 'null'))];
      if (clean.length !== raw.length) localStorage.setItem(key, JSON.stringify(clean));
    });
  } catch(e) {}
})();

const CAT_COLOR  = { hist: '#4A4A48', arch: '#3B5F84', fun: '#E0A020' };
const CAT_LETTER = { hist: 'H', arch: 'A', fun: 'Z' };
const CAT_NAME   = { hist: 'Historie', arch: 'Architektura', fun: 'Zajímavosti' };
const VISIT_KEY  = 'lop_visited_v1';
function getSession() {
  try { return JSON.parse(localStorage.getItem('lop_auth_session') || 'null'); } catch(e) { return null; }
}
async function getValidSession() {
  const s = getSession();
  if (!s?.access_token || !s?.user) return null;
  const nowSec = Math.floor(Date.now() / 1000);
  if ((s.expires_at || 0) > nowSec + 60) return s;
  if (!s.refresh_token) return null;
  try {
    const r = await fetch(SUPA_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if (!r.ok) { localStorage.removeItem('lop_auth_session'); return null; }
    const data = await r.json();
    localStorage.setItem('lop_auth_session', JSON.stringify({ ...data, user: data.user || s.user }));
    return data;
  } catch(e) { return null; }
}

function isLoggedIn() {
  try { const s = getSession(); return !!(s && s.access_token && s.user); } catch(e) { return false; }
}

const WISH_KEY   = 'lop_wishlist_v2';

let PLACES   = [];
const _urlFilter = new URLSearchParams(location.search).get('filter');
if (_urlFilter === 'wished') { /* aktivujeme po načtení */ }

function getWished() {

function isWished(id) {

function getVisited() {

/* ── Načtení dat ── */
function haversineM(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function formatDist(m) {
  if (m < 1000) return Math.round(m) + ' m';
  return (m/1000).toFixed(1).replace('.', ',') + ' km';
}

let userPos = null;

function requestLoc(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  navigator.geolocation.getCurrentPosition(pos => {
    userPos = [pos.coords.latitude, pos.coords.longitude];
    render();
  }, err => {
    // Pokud zamítnuto, odkáže na nastavení prohlížeče
    if (err.code === 1) {
      alert('Přístup k poloze byl zamítnut. Povolte polohu v nastavení prohlížeče a obnovte stránku.');
    }
  }, { enableHighAccuracy: true, timeout: 8000 });
}

function locateUser() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    userPos = [pos.coords.latitude, pos.coords.longitude];
    render(); // překresli s vzdálenostmi
  }, () => {}, { enableHighAccuracy: true, timeout: 8000 });
}

let LOCATIONS = []; // alias pro buildChips/applyFilter kompatibilitu
async function loadPlaces() { // vrací Promise

}

/* ── Počty ── */
function updateCounts() {

  if (chipW) chipW.classList.toggle('chip-locked', !loggedIn);

  if (wrapW) wrapW.innerHTML = loggedIn ? '<span class="count">' + PLACES.filter(p=>wished.includes(String(p.id))).length + '</span>' : lockSVG;
}

/* ── Filtr — přesně jako index.html ── */
const FILTER = { hist:'full', arch:'full', fun:'full', visited:'full', wished:'full' };
const FILTER_NEXT = { full:'dim', dim:'hide', hide:'full' };
const FILTER_NEXT_WISHED  = { full:'dim', dim:'hide', hide:'force', force:'full' };
const FILTER_NEXT_VISITED = { full:'dim', dim:'hide', hide:'force', force:'full' };
const RANK   = { full:0, dim:1, hide:2, force:0 };
const BETTER = (a,b) => RANK[a] <= RANK[b] ? a : b;
const ERAS = [
  { id:'rom', name:'Románský',    from: 1000, to: 1230 },
  { id:'got', name:'Gotika',      from: 1230, to: 1500 },
  { id:'ren', name:'Renesance',   from: 1500, to: 1620 },
  { id:'bar', name:'Baroko',      from: 1620, to: 1780 },
  { id:'emp', name:'Klasicismus', from: 1780, to: 1850 },
  { id:'sec', name:'Secese',      from: 1850, to: 1918 },
  { id:'mod', name:'Moderna',     from: 1918, to: 2000 },
];
const ERA_START = 1000, ERA_END = 2000;
const ERA_STATE = { from: ERA_START, to: ERA_END };
const DIST_STATE = { max: null };

function toggleFilter() {
  const bar = document.getElementById('filterBar');
  bar.classList.toggle('open');
}
function buildChips() {
  const el = document.getElementById('mapChips');
  const counts = { hist:0, arch:0, fun:0 };
  LOCATIONS.forEach(l => counts[l.cat]++);
  el.innerHTML = `
    <button class="chip" data-cat="hist">
      <span class="chip-swatch" style="background: var(--cat-hist)"></span>

    </button>
    <button class="chip" data-cat="arch">
      <span class="chip-swatch" style="background: var(--cat-arch)"></span>
      Architektura <span class="chip-count">${counts.arch}</span><span class="chip-filter-icon"></span>
    </button>
    <button class="chip" data-cat="fun">
      <span class="chip-swatch" style="background: var(--cat-fun)"></span>

    </button>
    <button class="chip" id="chipVisited" data-filter="visited" data-tooltip="Pro správu navštívených míst je nutné přihlášení">
      <span class="chip-swatch chip-icon chip-icon-check"></span>
      Navštíveno <span id="ctVisitedWrap"></span>
    </button>
    <button class="chip" id="chipWished" data-filter="wished" data-tooltip="Pro správu plánovaných míst je nutné přihlášení">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="#b04020" stroke="#b04020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      Plán <span id="ctWishedWrap"></span>
    </button>
  `;
  el.querySelectorAll('.chip[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.dataset.cat;
      FILTER[cat] = FILTER_NEXT[FILTER[cat]];
      btn.classList.remove('state-dim', 'state-hide');
      if (FILTER[cat] === 'dim')  btn.classList.add('state-dim');
      else if (FILTER[cat] === 'hide') btn.classList.add('state-hide');
      applyFilter();
    });
  });
  el.querySelectorAll('.chip[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!isLoggedIn()) {
        if (window.lopAuth) window.lopAuth.open();
        else location.href = 'login.html?return=' + encodeURIComponent(location.href);
        return;
      }
      const f = btn.dataset.filter;
      FILTER[f] = (f === 'wished' ? FILTER_NEXT_WISHED : f === 'visited' ? FILTER_NEXT_VISITED : FILTER_NEXT)[FILTER[f]];
      btn.classList.remove('state-dim', 'state-hide', 'state-force');
      if (FILTER[f] === 'dim')   btn.classList.add('state-dim');
      else if (FILTER[f] === 'hide')  btn.classList.add('state-hide');
      else if (FILTER[f] === 'force') btn.classList.add('state-force');
      applyFilter();
    });
  });
  buildEraTimeline();
  initDistSlider();
  updateChipCounts();
}
function buildEraTimeline() {
  const el = document.getElementById('eraTimeline');
  if (!el) return;
  const years = [1000, 1200, 1400, 1600, 1800, 2000];
  const html = [];
  html.push('<div class="ft-track"></div>');
  html.push(`<div class="ft-fill" id="eraFill"></div>`);
  ERAS.slice(1).forEach(e => {
    html.push(`<span class="ft-div" style="left:${eraPct(e.from)}%"></span>`);
  });
  ERAS.forEach(e => {
    const mid = (e.from + e.to) / 2;
    const w = eraPct(e.to) - eraPct(e.from);
    html.push(`<span class="ft-lbl" data-era="${e.id}" style="left:${eraPct(mid)}%; max-width: calc(${w}% - 4px)">${e.name}</span>`);
  });
  years.forEach(y => {
    html.push(`<span class="ft-year-tick" style="left:${eraPct(y)}%"></span>`);
    html.push(`<span class="ft-year" style="left:${eraPct(y)}%">${y}</span>`);
  });
  html.push(`<div class="ft-h" id="eraHFrom" data-which="from"></div>`);
  html.push(`<div class="ft-h" id="eraHTo" data-which="to"></div>`);
  el.innerHTML = html.join('');
  renderEra();

  const hs = el.querySelectorAll('.ft-h');
  hs.forEach(h => {
    const onDown = (ev) => {
      ev.preventDefault();
      const which = h.dataset.which;
      const rect = el.getBoundingClientRect();
      const onMove = (e) => {
        const cx = (e.touches ? e.touches[0].clientX : e.clientX);
        const p = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
        const y = pctToYear(p);
        if (which === 'from') {
          ERA_STATE.from = Math.min(y, ERA_STATE.to - 20);
        } else {
          ERA_STATE.to = Math.max(y, ERA_STATE.from + 20);
        }
        renderEra();
        applyFilter();
      };
      const onUp = () => {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
        window.removeEventListener('touchmove', onMove);
        window.removeEventListener('touchend', onUp);
      };
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onUp);
    };
    h.addEventListener('mousedown', onDown);
    h.addEventListener('touchstart', onDown, { passive: false });
  });
}
function renderEra() {
  const fromP = eraPct(ERA_STATE.from);
  const toP = eraPct(ERA_STATE.to);
  const fromH = document.getElementById('eraHFrom');
  const toH = document.getElementById('eraHTo');
  const fill = document.getElementById('eraFill');
  if (fromH) fromH.style.left = fromP + '%';
  if (toH) toH.style.left = toP + '%';
  if (fill) {
    fill.style.left = fromP + '%';
    fill.style.width = (toP - fromP) + '%';
  }
  document.getElementById('eraFromV').textContent = ERA_STATE.from;
  document.getElementById('eraToV').textContent = ERA_STATE.to;
  document.querySelectorAll('.ft-lbl').forEach(lbl => {
    const era = ERAS.find(e => e.id === lbl.dataset.era);
    const overlap = era.to > ERA_STATE.from && era.from < ERA_STATE.to;
    lbl.classList.toggle('off', !overlap);
  });
}
function initDistSlider() {
  const slider = document.getElementById('distSlider');
  const label = document.getElementById('distV');
  if (!slider) return;
  slider.addEventListener('input', () => {
    const v = +slider.value;
    if (v >= 100) {
      DIST_STATE.max = null;
      label.textContent = 'libovolná';
    } else {
      const km = 0.2 + (v / 100) * 4.8;
      DIST_STATE.max = km;
      label.textContent = '< ' + km.toFixed(1) + ' km';
    }
    applyFilter();
  });
}
function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b[0] - a[0]) * Math.PI / 180;
  const dLon = (b[1] - a[1]) * Math.PI / 180;
  const lat1 = a[0] * Math.PI / 180;
  const lat2 = b[0] * Math.PI / 180;
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function resetFilters() {
  FILTER.hist = FILTER.arch = FILTER.fun = 'full';
  FILTER.visited = FILTER.wished = 'full';
  ERA_STATE.from = ERA_START; ERA_STATE.to = ERA_END;
  DIST_STATE.max = null;
  document.querySelectorAll('.filter-chips .chip').forEach(c => c.classList.remove('state-hide', 'state-dim', 'state-force'));
  const ds = document.getElementById('distSlider'); if (ds) ds.value = 100;
  const dv = document.getElementById('distV'); if (dv) dv.textContent = 'libovolná';
  renderEra();
  applyFilter();
}
function locYear(loc) {
  // Nové schema: yearBuilt je přímé číslo
  if (loc.yearBuilt) return loc.yearBuilt;

  const parseYearOrCentury = (s) => {
    const v = String(s);
    const y = v.match(/\d{3,4}/);
    if (y) return parseInt(y[0]);
    const c = v.match(/(\d{1,2})\.\s*stol/i);
    if (c) return (parseInt(c[1]) - 1) * 100 + 50;
    return null;
  };
  if (loc.facts && loc.facts.length) {
    const buildKeys = /postaveno|otevřeno|dokončeno|vybudováno|výstavba|první zmínka|orloj od|od\b/i;
    for (const f of loc.facts) {
      if (buildKeys.test(f.k)) {
        const y = parseYearOrCentury(f.v);
        if (y != null) return y;
      }
    }
    for (const f of loc.facts) {
      const y = parseYearOrCentury(f.v);
      if (y != null) return y;
    }
  }
  if (loc.yearThen) {
    const y = parseYearOrCentury(loc.yearThen);
    if (y != null) return y;
  }
  return null;
}
function applyFilter() {
  render();
}



function haversineM(lat1, lng1, lat2, lng2) {
  return haversineKm([lat1,lng1],[lat2,lng2]) * 1000;
}

function toggleCat(cat) {
  FILTER[cat] = FILTER_NEXT[FILTER[cat]];
  const btn = document.querySelector('[data-cat="' + cat + '"]');
  if (btn) {
    btn.classList.remove('state-dim','state-hide','state-force');
    if (FILTER[cat] === 'dim')  btn.classList.add('state-dim');
    else if (FILTER[cat] === 'hide') btn.classList.add('state-hide');
  }
  applyFilter();
}

function setFilter(cat) {
  if (!isLoggedIn()) {
    if (window.lopAuth) window.lopAuth.open();
    else location.href = 'login.html?return=' + encodeURIComponent(location.href);
    return;
  }
  FILTER[cat] = (cat==='wished' ? FILTER_NEXT_WISHED : cat==='visited' ? FILTER_NEXT_VISITED : FILTER_NEXT)[FILTER[cat]];
  const btn = document.querySelector('.filter-chip[data-cat="' + cat + '"]');
  if (btn) {
    btn.classList.remove('state-dim','state-hide','state-active');
    if (FILTER[cat]==='dim')   btn.classList.add('state-dim');
    if (FILTER[cat]==='hide')  btn.classList.add('state-hide');
    if (FILTER[cat]==='force') btn.classList.add('state-active');
  }
  applyFilter();
}

/* ── Render ── */
function render() {
  const visited = getVisited();
  const wished  = getWished();

  const RANK   = { full: 0, dim: 1, hide: 2 };
  const BETTER = (a, b) => RANK[a] <= RANK[b] ? a : b;
  const eraActive = ERA_STATE.from > ERA_START || ERA_STATE.to < ERA_END;

  const filtered = PLACES.filter(p => {
    const wish = wished.includes(String(p.id));
    const vis  = visited.includes(String(p.id));

    const catState  = FILTER[p.cat];
    const wishState = FILTER.wished;
    const visState  = FILTER.visited;
    let s = 'full';

    // force = vždy zobrazit příznakové piny
    if      (wishState === 'force' && wish)    { s = 'full'; }
    else if (visState  === 'force' && vis)     { s = 'full'; }
    // hide = tvrdé skrytí bez výjimek
    else if (catState  === 'hide')             { s = 'hide'; }
    else if (wishState === 'hide' && wish)     { s = 'hide'; }
    else if (visState  === 'hide' && vis)      { s = 'hide'; }
    else {
      // dim = měkké skrytí — hlasování, příznaky mohou zachránit
      const votes = [catState];
      if (wish) votes.push(wishState);
      if (vis)  votes.push(visState);
      s = votes.reduce((best, v) => BETTER(best, v), 'hide');
    }

    if (s === 'hide') return false;

    // Era filtr
    if (eraActive) {
      const y = locYear(p);
      if (y != null && (y < ERA_STATE.from || y > ERA_STATE.to)) return false;
    }

    return true;
  });

  if (filtered.length === 0) {
    document.getElementById('placesList').innerHTML =
      '<div class="empty"><h3>Žádná místa</h3><p>Zkuste jiný filtr.</p></div>';
    return;
  }

  let html = '';
  ['hist','arch','fun'].forEach(cat => {
    const items = filtered.filter(p => p.cat === cat);
    if (!items.length) return;
    html += `<div class="section-label" style="margin-top:20px">${CAT_NAME[cat]}</div>`;
    html += items.map(p => cardHTML(p, visited, wished)).join('');
  });

  document.getElementById('placesList').innerHTML = html;
  // Aktualizuj počet v hlavičce filtru
  const cnt = document.getElementById('filterHeadActive');
  if (cnt) cnt.textContent = filtered.length;
}

function cardHTML(p, visited, wished) {
  const color  = CAT_COLOR[p.cat]  || '#4A4A48';
  const letter = CAT_LETTER[p.cat] || 'H';
  const catName = CAT_NAME[p.cat]  || '';
  const vis    = visited.includes(String(p.id));
  const wish   = wished && wished.includes(String(p.id));
  const thumb  = p.thumb || '';
  const lede   = p.lede || '';
  const detailUrl = 'place/' + p.id + '.html';
  const dist   = userPos && p.lat && p.lng
    ? formatDist(haversineM(userPos[0], userPos[1], p.lat, p.lng))
    : '';

  const loggedIn = isLoggedIn();
  const wishBtn = loggedIn
    ? `<button class="place-wish-btn ${wish ? 'wished' : ''}" onclick="toggleWish(event, '${p.id}')" title="${wish ? 'Odebrat z plánu' : 'Přidat do plánu'}">
        <svg viewBox="0 0 24 24" fill="${wish ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="place-wish-lbl">Plán</span>
      </button>`
    : `<button class="place-wish-btn" onclick="event.stopPropagation(); window.lopAuth ? window.lopAuth.open() : location.href='login.html?return='+encodeURIComponent(location.href);" title="Pro správu plánovaných míst je nutné přihlášení" style="position:relative">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="place-wish-lock"></span>
        <span class="place-wish-lbl">Plán</span>
      </button>`;
  const visitedHtml = vis && loggedIn
    ? `<div class="place-visited show"></div><div class="place-visited-lbl">Navštíveno</div>`
    : dist
      ? `<div class="place-dist">${dist}</div>`
      : `<div class="place-dist">? m</div><span class="place-dist-hint" onclick="requestLoc(event)">povolit?</span>`;

  return `<div class="place-card" onclick="location.href='${detailUrl}'">
    <div class="place-thumb">
      ${thumb ? `<img src="${thumb}" alt="${p.name}" onerror="this.style.display='none'"/>` : ''}
      <div class="place-thumb-fallback">${letter}</div>
      <div class="place-id">${p.id}</div>
    </div>
    <div class="place-body">
      <div class="place-kick">
        <span class="dot" style="background:${color}"></span>
        <span>${catName}</span>
      </div>
      <div class="place-name">${p.name}</div>
      <div class="place-sub">${lede}</div>
    </div>
    <div class="place-meta">
      <div class="place-dist-wrap">${visitedHtml}</div>
      ${wishBtn}
    </div>
  </div>`;
}

function toggleWish(e, id) {
  e.preventDefault(); e.stopPropagation();
  const btn = e.currentTarget;
  const w = [...new Set(getWished())];
  const idx = w.indexOf(String(id));
  if (idx >= 0) { w.splice(idx, 1); dbRemoveWish(id); }
  else { w.push(String(id)); dbAddWish(id); }
  localStorage.setItem(WISH_KEY, JSON.stringify(w));
  const wished = idx < 0;
  btn.classList.toggle('wished', wished);
  btn.querySelector('svg').setAttribute('fill', wished ? 'currentColor' : 'none');
  btn.title = wished ? 'Odebrat z plánu' : 'Přidat do plánu';
  updateCounts();
  if (window.lopNav) window.lopNav.refresh();
}

/* ── Supabase ── */
const SUPA_URL = 'https://lomtaoctzetpweuepesp.supabase.co';
const SUPA_KEY = 'sb_publishable_uAQBxCOYWpc_PrEc78fFzw_kbeH4xj5';


function authHeaders() {
  const s = getSession();
  return { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + (s?.access_token || SUPA_KEY),
    'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' };
}
function dbAddWish(id) {
  getValidSession().then(s => {
    if (!s?.user) return;
    fetch(SUPA_URL + '/rest/v1/wishlist', { method:'POST', headers: authHeaders(),
      body: JSON.stringify({ user_id: s.user.id, place_id: String(id) }) }).catch(()=>{});
  });
}
function dbRemoveWish(id) {
  getValidSession().then(s => {
    if (!s?.user) return;
    fetch(SUPA_URL + '/rest/v1/wishlist?user_id=eq.' + s.user.id + '&place_id=eq.' + id,
      { method:'DELETE', headers: authHeaders() }).catch(()=>{});
  });
}
async function syncFromDB() {
  const s = getSession(); if (!s?.access_token || !s?.user) return;
  try {
    const [wRes, vRes] = await Promise.all([
      fetch(SUPA_URL + '/rest/v1/wishlist?user_id=eq.' + s.user.id + '&select=place_id', { headers: authHeaders() }),
      fetch(SUPA_URL + '/rest/v1/visited?user_id=eq.' + s.user.id + '&select=place_id',  { headers: authHeaders() })
    ]);
    if (wRes.ok) {
      const remote = (await wRes.json()).map(r => r.place_id).filter(id => (typeof LOCATIONS !== 'undefined' ? LOCATIONS : PLACES || []).find(p => String(p.id) === String(id)));
      const local  = [...new Set(JSON.parse(localStorage.getItem(WISH_KEY)||'[]').map(String))];
      localStorage.setItem(WISH_KEY, JSON.stringify([...new Set([...remote, ...local])]));
      local.filter(id => !remote.includes(id)).forEach(id => {
        fetch(SUPA_URL + '/rest/v1/wishlist', { method:'POST', headers: authHeaders(),
          body: JSON.stringify({ user_id: s.user.id, place_id: id }) }).catch(()=>{});
      });
    }
    if (vRes.ok) {
      const remote = (await vRes.json()).map(r => r.place_id);
      const local  = [...new Set(JSON.parse(localStorage.getItem(VISIT_KEY)||'[]').map(String))];
      localStorage.setItem(VISIT_KEY, JSON.stringify([...new Set([...remote, ...local])]));
    }
  } catch(e) { console.warn('Sync failed:', e); }
}

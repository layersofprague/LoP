<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a1a18"/>
<title>Přehled míst — LayersOfPrague</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:   #eeefeb;
  --paper-2: #e6e7e2;
  --paper-3: #dadcd4;
  --ink:     #1a1a18;
  --ink-2:   #3a3a36;
  --ink-3:   #6a6a64;
  --ink-4:   #9a9a94;
  --rule:    #cbcec5;
  --accent:  #b04020;
  --ok:      #3d7a4a;
  --cat-hist: #4A4A48;
  --cat-arch: #3B5F84;
  --cat-fun:  #E0A020;
  --ease:    cubic-bezier(.22,.8,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; min-height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ── PAGE ── */
.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 18px 100px;
}

/* ── HERO ── */
.hero-section { margin-bottom: 28px; }
.kick {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 6px;
}
.page-title {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1; letter-spacing: -.02em;
  color: var(--ink);
}
.page-title em { font-style: italic; color: var(--ink-3); }
.page-intro {
  font-size: 14px; color: var(--ink-3);
  margin-top: 10px; line-height: 1.55;
  max-width: 34em;
}

/* ── FILTRY ── */
.filter-row {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.filter-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 100px;
  font-size: 12px; font-weight: 500;
  color: var(--ink-2); cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  appearance: none;
  font-family: inherit;
}
.filter-chip:hover { border-color: var(--ink-3); }

.filter-chip.state-hide { opacity: .35; }

.filter-chip .dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}
.filter-chip .count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; opacity: .6;
}

/* ── SEKCE ── */
.section-label {
  display: flex; align-items: baseline; justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 4px;
}
.section-label .ct { color: var(--ink-4); }

/* ── PLACE CARD ── */
.place-card {
  display: grid;
  grid-template-columns: 72px 1fr auto;
  align-items: center; gap: 14px;
  padding: 14px 0;
  border-top: 1px solid var(--rule);
  cursor: pointer;
  transition: background .15s;
  text-decoration: none; color: inherit;
  width: 100%;
}
.place-card:first-of-type { border-top: none; padding-top: 6px; }
.place-card:hover .place-name { color: var(--accent); }

.place-thumb {
  width: 72px; height: 72px;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
  background: var(--paper-3);
  grid-column: 1;
}
.place-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.place-thumb-fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-style: italic; font-size: 28px;
  color: rgba(26,24,20,.3);
}
.place-id {
  position: absolute; bottom: 4px; right: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; font-weight: 600;
  color: var(--paper);
  background: rgba(26,24,20,.5);
  border-radius: 3px; padding: 1px 4px;
}

.place-body { min-width: 0; }
.place-kick {
  display: flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 3px;
}
.place-kick .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.place-name {
  font-family: 'Fraunces', serif;
  font-size: 18px; font-weight: 500;
  line-height: 1.2; color: var(--ink);
  transition: color .15s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.place-sub {
  font-size: 12.5px; color: var(--ink-3);
  margin-top: 3px; line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

.place-meta {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  flex-shrink: 0; align-self: center; justify-self: end;
}
.place-visited {
  width: 14px; height: 14px;
  background: var(--ok);
  display: none;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>") center/contain no-repeat;
  filter: drop-shadow(0 0 1px rgba(255,255,255,.8));
}
.place-visited.show { display: block; margin: 0 auto; }
.place-visited-lbl { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ok); letter-spacing: .06em; text-align: center; margin-top: 2px; }
.place-year {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-4);
  letter-spacing: .06em;
}
.place-dist {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-4);
  letter-spacing: .06em;
}
.place-wish-btn {
  appearance: none; background: transparent; border: none;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 4px 6px; border-radius: 8px;
  cursor: pointer; color: var(--ink-4);
  transition: background .15s, color .15s;
  flex-shrink: 0;
}
.place-wish-btn:hover { background: var(--paper-2); color: var(--ink-2); }
a.place-wish-btn { text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 8px; cursor: pointer; color: var(--ink-4); transition: background .15s, color .15s; flex-shrink: 0; width: 47px; box-sizing: border-box; }
.place-wish-btn.wished { color: var(--accent); }
.place-wish-btn svg { width: 16px; height: 16px; pointer-events: none; }
.place-wish-lbl { font-size: 9px; font-weight: 500; letter-spacing: .01em; pointer-events: none; }
/* vzdálenost */
.place-dist-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; min-width: 44px; text-align: center; }
.place-dist { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-4); letter-spacing: .06em; }
.place-dist-hint { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--ink-4); letter-spacing: .06em; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.place-dist-hint:hover { color: var(--ink-3); }

/* ── PRÁZDNÝ STAV ── */
.empty {
  text-align: center; padding: 48px 20px;
  color: var(--ink-3);
}
.empty h3 {
  font-family: 'Fraunces', serif;
  font-size: 22px; font-weight: 400;
  color: var(--ink); margin-bottom: 8px;
}

/* ── LOADING ── */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 48px; color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
}

.filter-chip.state-dim { background: var(--ink) !important; color: var(--paper) !important; border-color: var(--ink) !important; }
.filter-chip.state-dim .chip-filter-icon,
.filter-chip.state-hide .chip-filter-icon { display: inline-block; }
.filter-chip .chip-filter-icon { display: none; width: 9px; height: 9px; margin-left: 2px;
  background: currentColor;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3'/></svg>") center/contain no-repeat; }
.filter-chip.state-hide { background: var(--ink) !important; color: var(--paper) !important; border-color: var(--ink) !important; }
.filter-chip.state-active { background: var(--accent) !important; color: var(--paper) !important; border-color: var(--accent) !important; }
.filter-chip.chip-locked { cursor: pointer; position: relative; }
.filter-chip.chip-locked::before {
  content: attr(data-tooltip);
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  background: var(--ink); color: var(--paper);
  font-size: 11px; padding: 6px 10px; border-radius: 6px;
  white-space: nowrap; pointer-events: none;
  opacity: 0; transition: opacity .15s; z-index: 1000;
}
.filter-chip.chip-locked:hover::before { opacity: 1; }

.place-wish-lock {
  position: absolute; top: 0; right: 2px;
  width: 12px; height: 12px;
  background: var(--accent);
  border-radius: 50%;
}
.place-wish-lock::after {
  content: '';
  position: absolute; inset: 0; margin: auto;
  width: 7px; height: 7px;
  background: white;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center/contain no-repeat;
}
</style>
</head>
<body>

<div id="lop-header"></div>
<script src="header.js"></script>

<div class="page">

  <div class="hero-section">
    <div class="kick">Layers of Prague</div>
    <h1 class="page-title">Přehled <em>míst</em></h1>
    <p class="page-intro">Všechna místa seřazená podle kategorie. Kliknutím otevřete detail, historické fotografie a AR záběr.</p>
  </div>

  <!-- Filtry -->
  <div class="filter-row" id="filterRow">
    <button class="filter-chip" data-cat="hist" onclick="toggleCat('hist')">
      <span class="dot" style="background:var(--cat-hist)"></span>
      Historie <span class="count" id="ctHist">—</span><span class="chip-filter-icon"></span>
    </button>
    <button class="filter-chip" data-cat="arch" onclick="toggleCat('arch')">
      <span class="dot" style="background:var(--cat-arch)"></span>
      Architektura <span class="count" id="ctArch">—</span><span class="chip-filter-icon"></span>
    </button>
    <button class="filter-chip" data-cat="fun" onclick="toggleCat('fun')">
      <span class="dot" style="background:var(--cat-fun)"></span>
      Zajímavosti <span class="count" id="ctFun">—</span><span class="chip-filter-icon"></span>
    </button>
    <button class="filter-chip" id="chipVisited" data-cat="visited" data-tooltip="Pro správu navštívených míst je nutné přihlášení" onclick="setFilter('visited')">
      <span style="font-size:11px">✓</span>
      Navštíveno <span id="ctVisitedWrap"></span>
    </button>
    <button class="filter-chip" id="chipWished" data-cat="wished" data-tooltip="Pro správu plánovaných míst je nutné přihlášení" onclick="setFilter('wished')">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="#b04020" stroke="#b04020" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      Plán <span id="ctWishedWrap"></span>
    </button>
  </div>

  <!-- Seznam -->
  <div id="placesList">
    <div class="loading">Načítám místa…</div>
  </div>

</div>

<div id="lop-nav"></div>
<script src="nav.js"></script>

<script>
// Pročisti localStorage od duplicit při načtení
(function() {
  try {
    ['lop_wishlist_v2','lop_visited_v1'].forEach(key => {
      const raw = JSON.parse(localStorage.getItem(key) || '[]');
      const clean = [...new Set(raw.map(String).filter(x => x && x !== 'undefined' && x !== 'null'))];
      if (clean.length !== raw.length) localStorage.setItem(key, JSON.stringify(clean));
    });
  } catch(e) {}
})();

const CAT_COLOR  = { hist: '#4A4A48', arch: '#3B5F84', fun: '#E0A020' };
const CAT_LETTER = { hist: 'H', arch: 'A', fun: 'Z' };
const CAT_NAME   = { hist: 'Historie', arch: 'Architektura', fun: 'Zajímavosti' };
const VISIT_KEY  = 'lop_visited_v1';
function getSession() {
  try { return JSON.parse(localStorage.getItem('lop_auth_session') || 'null'); } catch(e) { return null; }
}
function isLoggedIn() {
  try { const s = getSession(); return !!(s && s.access_token && s.user); } catch(e) { return false; }
}

const WISH_KEY   = 'lop_wishlist_v2';

let PLACES   = [];
const _urlFilter = new URLSearchParams(location.search).get('filter');
if (_urlFilter === 'wished') { /* aktivujeme po načtení */ }

function getWished() {
  try { return JSON.parse(localStorage.getItem(WISH_KEY) || '[]').map(String); } catch(e) { return []; }
}

function isWished(id) {
  return getWished().includes(String(id));
}

function getVisited() {
  try { return JSON.parse(localStorage.getItem(VISIT_KEY) || '[]').map(String); } catch(e) { return []; }
}

function isVisited(id) {
  return getVisited().includes(String(id));
}

/* ── Načtení dat ── */
function haversineM(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function formatDist(m) {
  if (m < 1000) return Math.round(m) + ' m';
  return (m/1000).toFixed(1).replace('.', ',') + ' km';
}

let userPos = null;

function requestLoc(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  navigator.geolocation.getCurrentPosition(pos => {
    userPos = [pos.coords.latitude, pos.coords.longitude];
    render();
  }, err => {
    // Pokud zamítnuto, odkáže na nastavení prohlížeče
    if (err.code === 1) {
      alert('Přístup k poloze byl zamítnut. Povolte polohu v nastavení prohlížeče a obnovte stránku.');
    }
  }, { enableHighAccuracy: true, timeout: 8000 });
}

function locateUser() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    userPos = [pos.coords.latitude, pos.coords.longitude];
    render(); // překresli s vzdálenostmi
  }, () => {}, { enableHighAccuracy: true, timeout: 8000 });
}

async function loadPlaces() { // vrací Promise
  try {
    const res = await fetch('places.json');
    if (!res.ok) throw new Error('404');
    PLACES = await res.json();
  } catch(e) {
    document.getElementById('placesList').innerHTML =
      '<div class="empty"><h3>Nepodařilo se načíst místa</h3><p>Zkontrolujte připojení a obnovte stránku.</p></div>';
    return;
  }
  updateCounts();
}

/* ── Počty ── */
function updateCounts() {
  const visited  = getVisited();
  const wished   = getWished();
  const loggedIn = isLoggedIn();
  const lockSVG  = '<svg class="chip-lock" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
  const el = id => document.getElementById(id);
  if (el('ctHist')) el('ctHist').textContent = PLACES.filter(p=>p.cat==='hist').length;
  if (el('ctArch')) el('ctArch').textContent = PLACES.filter(p=>p.cat==='arch').length;
  if (el('ctFun'))  el('ctFun').textContent  = PLACES.filter(p=>p.cat==='fun').length;
  const chipV = el('chipVisited'), chipW = el('chipWished');
  const wrapV = el('ctVisitedWrap'), wrapW = el('ctWishedWrap');
  if (chipV) chipV.classList.toggle('chip-locked', !loggedIn);
  if (chipW) chipW.classList.toggle('chip-locked', !loggedIn);
  if (wrapV) wrapV.innerHTML = loggedIn ? '<span class="count">' + PLACES.filter(p=>visited.includes(String(p.id))).length + '</span>' : lockSVG;
  if (wrapW) wrapW.innerHTML = loggedIn ? '<span class="count">' + PLACES.filter(p=>wished.includes(String(p.id))).length + '</span>' : lockSVG;
}

/* ── Filtr — přesně jako index.html ── */
const FILTER = { hist:'full', arch:'full', fun:'full', visited:'full', wished:'full' };
const FILTER_NEXT = { full:'hide', hide:'full' };
const FILTER_NEXT_WISHED  = { full:'dim', dim:'hide', hide:'force', force:'full' };
const FILTER_NEXT_VISITED = { full:'dim', dim:'hide', hide:'force', force:'full' };
const RANK   = { full:0, dim:1, hide:2, force:0 };
const BETTER = (a,b) => RANK[a] <= RANK[b] ? a : b;

function toggleCat(cat) {
  FILTER[cat] = FILTER_NEXT[FILTER[cat]];
  const btn = document.querySelector('.filter-chip[data-cat="' + cat + '"]');
  if (btn) {
    btn.classList.remove('state-dim','state-hide','state-active');
    if (FILTER[cat]==='dim')  btn.classList.add('state-dim');
    if (FILTER[cat]==='hide') btn.classList.add('state-hide');
  }
  render();
}

function setFilter(cat) {
  if (!isLoggedIn()) { location.href = 'login.html?return=' + encodeURIComponent(location.href); return; }
  FILTER[cat] = (cat==='wished' ? FILTER_NEXT_WISHED : cat==='visited' ? FILTER_NEXT_VISITED : FILTER_NEXT)[FILTER[cat]];
  const btn = document.querySelector('.filter-chip[data-cat="' + cat + '"]');
  if (btn) {
    btn.classList.remove('state-dim','state-hide','state-active');
    if (FILTER[cat]==='dim')   btn.classList.add('state-dim');
    if (FILTER[cat]==='hide')  btn.classList.add('state-hide');
    if (FILTER[cat]==='force') btn.classList.add('state-active');
  }
  render();
}

/* ── Render ── */
function render() {
  const visited = getVisited();
  const wished  = getWished();

  const filtered = PLACES.filter(p => {
    const wish = wished.includes(String(p.id));
    const vis  = visited.includes(String(p.id));
    if (FILTER.wished  === 'force' && wish) return true;
    if (FILTER.visited === 'force' && vis)  return true;
    const votes = [FILTER[p.cat]];
    if (wish) votes.push(FILTER.wished  === 'force' ? 'full' : FILTER.wished);
    if (vis)  votes.push(FILTER.visited === 'force' ? 'full' : FILTER.visited);
    const s = votes.reduce((best, v) => BETTER(best, v), 'hide');
    return s === 'full';
  });

  if (filtered.length === 0) {
    document.getElementById('placesList').innerHTML =
      '<div class="empty"><h3>Žádná místa</h3><p>Zkuste jiný filtr.</p></div>';
    return;
  }

  let html = '';
  ['hist','arch','fun'].forEach(cat => {
    const items = filtered.filter(p => p.cat === cat);
    if (!items.length) return;
    html += `<div class="section-label" style="margin-top:20px">${CAT_NAME[cat]}</div>`;
    html += items.map(p => cardHTML(p, visited, wished)).join('');
  });

  document.getElementById('placesList').innerHTML = html;
}

function cardHTML(p, visited, wished) {
  const color  = CAT_COLOR[p.cat]  || '#4A4A48';
  const letter = CAT_LETTER[p.cat] || 'H';
  const catName = CAT_NAME[p.cat]  || '';
  const vis    = visited.includes(String(p.id));
  const wish   = wished && wished.includes(String(p.id));
  const thumb  = p.thumb || '';
  const lede   = p.lede || '';
  const detailUrl = 'place/' + p.id + '.html';
  const dist   = userPos && p.lat && p.lng
    ? formatDist(haversineM(userPos[0], userPos[1], p.lat, p.lng))
    : '';

  const loggedIn = isLoggedIn();
  const wishBtn = loggedIn
    ? `<button class="place-wish-btn ${wish ? 'wished' : ''}" onclick="toggleWish(event, '${p.id}')" title="${wish ? 'Odebrat z plánu' : 'Přidat do plánu'}">
        <svg viewBox="0 0 24 24" fill="${wish ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="place-wish-lbl">Plán</span>
      </button>`
    : `<button class="place-wish-btn" onclick="event.stopPropagation(); location.href='login.html?return='+encodeURIComponent(location.href);" title="Pro správu plánovaných míst je nutné přihlášení" style="position:relative">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        <span class="place-wish-lock"></span>
        <span class="place-wish-lbl">Plán</span>
      </button>`;
  const visitedHtml = vis && loggedIn
    ? `<div class="place-visited show"></div><div class="place-visited-lbl">Navštíveno</div>`
    : dist
      ? `<div class="place-dist">${dist}</div>`
      : `<div class="place-dist">? m</div><span class="place-dist-hint" onclick="requestLoc(event)">povolit?</span>`;

  return `<div class="place-card" onclick="location.href='${detailUrl}'">
    <div class="place-thumb">
      ${thumb ? `<img src="${thumb}" alt="${p.name}" onerror="this.style.display='none'"/>` : ''}
      <div class="place-thumb-fallback">${letter}</div>
      <div class="place-id">${p.id}</div>
    </div>
    <div class="place-body">
      <div class="place-kick">
        <span class="dot" style="background:${color}"></span>
        <span>${catName}</span>
      </div>
      <div class="place-name">${p.name}</div>
      <div class="place-sub">${lede}</div>
    </div>
    <div class="place-meta">
      <div class="place-dist-wrap">${visitedHtml}</div>
      ${wishBtn}
    </div>
  </div>`;
}

function toggleWish(e, id) {
  e.preventDefault(); e.stopPropagation();
  const btn = e.currentTarget;
  const w = [...new Set(getWished())];
  const idx = w.indexOf(String(id));
  if (idx >= 0) { w.splice(idx, 1); dbRemoveWish(id); }
  else { w.push(String(id)); dbAddWish(id); }
  localStorage.setItem(WISH_KEY, JSON.stringify(w));
  const wished = idx < 0;
  btn.classList.toggle('wished', wished);
  btn.querySelector('svg').setAttribute('fill', wished ? 'currentColor' : 'none');
  btn.title = wished ? 'Odebrat z plánu' : 'Přidat do plánu';
  updateCounts();
  if (window.lopNav) window.lopNav.refresh();
}

/* ── Supabase ── */
const SUPA_URL = 'https://lomtaoctzetpweuepesp.supabase.co';
const SUPA_KEY = 'sb_publishable_uAQBxCOYWpc_PrEc78fFzw_kbeH4xj5';


function authHeaders() {
  const s = getSession();
  return { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + (s?.access_token || SUPA_KEY),
    'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates' };
}
function dbAddWish(id) {
  if (_syncOffline) return;
  const s = getSession(); if (!s?.user) return;
  fetch(SUPA_URL + '/rest/v1/wishlist', { method:'POST', headers: authHeaders(),
    body: JSON.stringify({ user_id: s.user.id, place_id: String(id) }) }).catch(()=>{});
}
function dbRemoveWish(id) {
  if (_syncOffline) return;
  const s = getSession(); if (!s?.user) return;
  fetch(SUPA_URL + '/rest/v1/wishlist?user_id=eq.' + s.user.id + '&place_id=eq.' + id,
    { method:'DELETE', headers: authHeaders() }).catch(()=>{});
}
/* ── Sync UI ── */
const SYNC_TIMEOUT_MS = 10000;
let _syncOffline = false;

function _injectSyncUI() {
  if (document.getElementById('lop-sync-bar')) return;
  const style = document.createElement('style');
  style.textContent = `#lop-sync-bar{position:fixed;bottom:0;left:0;right:0;z-index:8000;background:rgba(26,24,20,.82);color:var(--paper,#eeefeb);padding:10px 16px;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.4;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.8,.36,1);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
@media(max-width:819px){#lop-sync-bar{bottom:calc(56px + env(safe-area-inset-bottom,0px));}}
@media(min-width:820px){#lop-sync-bar{bottom:0;right:84px;}}
#lop-sync-bar.show{transform:translateY(0);}
#lop-sync-bar .sb-text{flex:1;}
#lop-sync-bar .sb-retry{flex-shrink:0;background:transparent;border:1px solid rgba(238,239,235,.35);color:var(--paper,#eeefeb);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;transition:background .15s;}
#lop-sync-bar .sb-retry:hover{background:rgba(238,239,235,.12);}
#lop-sync-spinner{position:fixed;bottom:0;left:0;right:0;z-index:7999;height:2px;background:linear-gradient(90deg,transparent,var(--accent,#b04020),transparent);background-size:200% 100%;animation:lop-slide 1.4s linear infinite;opacity:0;transition:opacity .2s;}
@media(max-width:819px){#lop-sync-spinner{bottom:calc(56px + env(safe-area-inset-bottom,0px));}}
@media(min-width:820px){#lop-sync-spinner{bottom:0;right:84px;}}
#lop-sync-spinner.show{opacity:1;}
@keyframes lop-slide{0%{background-position:200% 0;}100%{background-position:-200% 0;}}`;
  document.head.appendChild(style);
  const spinner = document.createElement('div');
  spinner.id = 'lop-sync-spinner';
  document.body.appendChild(spinner);
  const bar = document.createElement('div');
  bar.id = 'lop-sync-bar';
  bar.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;opacity:.7"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span class="sb-text">Nepodařilo se načíst data ze serveru. Zobrazujeme naposledy uložený stav.</span><button class="sb-retry" onclick="window._lopSyncRetry()">Zkusit znovu</button>`;
  document.body.appendChild(bar);
}
function _showSyncSpinner(on) { const el = document.getElementById('lop-sync-spinner'); if (el) el.classList.toggle('show', on); }
function _showSyncBar(on)     { const el = document.getElementById('lop-sync-bar');     if (el) el.classList.toggle('show', on); }

window._lopSyncRetry = () => {
  _showSyncBar(false);
  syncFromDB(() => { render(); updateCounts(); if (window.lopNav) window.lopNav.refresh(); });
};

async function syncFromDB(onDone) {
  const s = getSession(); if (!s?.access_token || !s?.user) return;
  _injectSyncUI();
  _showSyncSpinner(true);
  _showSyncBar(false);
  _syncOffline = false;
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), SYNC_TIMEOUT_MS);
  try {
    const [wRes, vRes] = await Promise.all([
      fetch(SUPA_URL + '/rest/v1/wishlist?user_id=eq.' + s.user.id + '&select=place_id', { headers: authHeaders(), signal: ctrl.signal }),
      fetch(SUPA_URL + '/rest/v1/visited?user_id=eq.' + s.user.id + '&select=place_id',  { headers: authHeaders(), signal: ctrl.signal }),
    ]);
    clearTimeout(tid);
    if (wRes.ok) localStorage.setItem(WISH_KEY,  JSON.stringify((await wRes.json()).map(r => String(r.place_id))));
    if (vRes.ok) localStorage.setItem(VISIT_KEY, JSON.stringify((await vRes.json()).map(r => String(r.place_id))));
    // Role — separátní fetch, nezastaví sync při chybě
    fetch(SUPA_URL + '/rest/v1/profiles?user_id=eq.' + s.user.id + '&select=role', { headers: authHeaders() })
      .then(r => r.ok ? r.json() : [])
      .then(rows => { if (rows[0]?.role) localStorage.setItem('lop_user_role', rows[0].role); })
      .catch(() => {});
    _showSyncSpinner(false);
    _syncOffline = false;
    if (onDone) onDone();
  } catch(e) {
    clearTimeout(tid);
    _showSyncSpinner(false);
    _syncOffline = true;
    if (onDone) onDone();
    _showSyncBar(true);
    console.warn('Sync failed (offline fallback):', e);
  }
}

loadPlaces().then(() => {
  syncFromDB(() => {
    updateCounts();
    if (_urlFilter === 'wished') {
      FILTER.hist = 'hide'; FILTER.arch = 'hide'; FILTER.fun = 'hide';
      FILTER.visited = 'hide';
      document.querySelectorAll('.filter-chip[data-cat="hist"], .filter-chip[data-cat="arch"], .filter-chip[data-cat="fun"], .filter-chip[data-cat="visited"]').forEach(b => b.classList.add('state-hide'));
    }
    render();
  });
});
locateUser();

// Refresh nav badge po načtení
requestAnimationFrame(() => { if (window.lopNav) window.lopNav.refresh(); });

// Chipy se inicializují při render()

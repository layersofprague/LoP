<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a1a18"/>
<title>Přehled míst — LayersOfPrague</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:   #eeefeb;
  --paper-2: #e6e7e2;
  --paper-3: #dadcd4;
  --ink:     #1a1a18;
  --ink-2:   #3a3a36;
  --ink-3:   #6a6a64;
  --ink-4:   #9a9a94;
  --rule:    #cbcec5;
  --accent:  #b04020;
  --ok:      #3d7a4a;
  --cat-hist: #4A4A48;
  --cat-arch: #3B5F84;
  --cat-fun:  #E0A020;
  --ease:    cubic-bezier(.22,.8,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; min-height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ── PAGE ── */
.page {
  max-width: 820px;
  margin: 0 auto;
  padding: 24px 18px 100px;
}

/* ── HERO ── */
.hero-section { margin-bottom: 28px; }
.kick {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 6px;
}
.page-title {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: clamp(32px, 8vw, 48px);
  line-height: 1; letter-spacing: -.02em;
  color: var(--ink);
}
.page-title em { font-style: italic; color: var(--ink-3); }
.page-intro {
  font-size: 14px; color: var(--ink-3);
  margin-top: 10px; line-height: 1.55;
  max-width: 34em;
}

/* ── FILTRY ── */
.filter-row {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 20px;
}
.filter-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 100px;
  font-size: 12px; font-weight: 500;
  color: var(--ink-2); cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
  appearance: none;
  font-family: inherit;
}
.filter-chip:hover { border-color: var(--ink-3); }
.filter-chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filter-chip .dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}
.filter-chip .count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; opacity: .6;
}

/* ── SEKCE ── */
.section-label {
  display: flex; align-items: baseline; justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--ink-3);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 4px;
}
.section-label .ct { color: var(--ink-4); }

/* ── PLACE CARD ── */
.place-card {
  display: grid;
  grid-template-columns: 72px 1fr auto;
  align-items: center; gap: 14px;
  padding: 14px 0;
  border-top: 1px solid var(--rule);
  cursor: pointer;
  transition: background .15s;
  text-decoration: none; color: inherit;
}
.place-card:first-of-type { border-top: none; padding-top: 6px; }
.place-card:hover .place-name { color: var(--accent); }

.place-thumb {
  width: 72px; height: 72px;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  flex-shrink: 0;
  background: var(--paper-3);
}
.place-thumb img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.place-thumb-fallback {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-style: italic; font-size: 28px;
  color: rgba(26,24,20,.3);
}
.place-id {
  position: absolute; bottom: 4px; right: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; font-weight: 600;
  color: var(--paper);
  background: rgba(26,24,20,.5);
  border-radius: 3px; padding: 1px 4px;
}

.place-body { min-width: 0; }
.place-kick {
  display: flex; align-items: center; gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-3); margin-bottom: 3px;
}
.place-kick .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.place-name {
  font-family: 'Fraunces', serif;
  font-size: 18px; font-weight: 500;
  line-height: 1.2; color: var(--ink);
  transition: color .15s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.place-sub {
  font-size: 12.5px; color: var(--ink-3);
  margin-top: 3px; line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

.place-meta {
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  flex-shrink: 0;
}
.place-visited {
  width: 20px; height: 20px;
  background: var(--ok);
  border-radius: 50%;
  display: none; align-items: center; justify-content: center;
}
.place-visited.show { display: flex; }
.place-visited svg { width: 11px; height: 11px; }
.place-year {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-4);
  letter-spacing: .06em;
}
.place-dist {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-4);
  letter-spacing: .06em;
}
.place-wish {
  width: 20px; height: 20px;
  display: none; align-items: center; justify-content: center;
  color: var(--accent);
}
.place-wish.show { display: flex; }
.place-wish svg { width: 13px; height: 13px; }

/* ── PRÁZDNÝ STAV ── */
.empty {
  text-align: center; padding: 48px 20px;
  color: var(--ink-3);
}
.empty h3 {
  font-family: 'Fraunces', serif;
  font-size: 22px; font-weight: 400;
  color: var(--ink); margin-bottom: 8px;
}

/* ── LOADING ── */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 48px; color: var(--ink-4);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
}
</style>
</head>
<body>

<div id="lop-header"></div>
<script src="header.js"></script>

<div class="page">

  <div class="hero-section">
    <div class="kick">Layers of Prague</div>
    <h1 class="page-title">Přehled <em>míst</em></h1>
    <p class="page-intro">Všechna místa seřazená podle kategorie. Kliknutím otevřete detail, historické fotografie a AR záběr.</p>
  </div>

  <!-- Filtry -->
  <div class="filter-row" id="filterRow">
    <button class="filter-chip active" data-cat="all" onclick="setFilter('all')">
      Vše <span class="count" id="ctAll">—</span>
    </button>
    <button class="filter-chip" data-cat="hist" onclick="setFilter('hist')">
      <span class="dot" style="background:var(--cat-hist)"></span>
      Historie <span class="count" id="ctHist">—</span>
    </button>
    <button class="filter-chip" data-cat="arch" onclick="setFilter('arch')">
      <span class="dot" style="background:var(--cat-arch)"></span>
      Architektura <span class="count" id="ctArch">—</span>
    </button>
    <button class="filter-chip" data-cat="fun" onclick="setFilter('fun')">
      <span class="dot" style="background:var(--cat-fun)"></span>
      Zajímavosti <span class="count" id="ctFun">—</span>
    </button>
    <button class="filter-chip" data-cat="visited" onclick="setFilter('visited')">
      <span style="font-size:11px">✓</span>
      Navštíveno <span class="count" id="ctVisited">—</span>
    </button>
  </div>

  <!-- Seznam -->
  <div id="placesList">
    <div class="loading">Načítám místa…</div>
  </div>

</div>

<div id="lop-nav"></div>
<script src="nav.js"></script>

<script>
const CAT_COLOR  = { hist: '#4A4A48', arch: '#3B5F84', fun: '#E0A020' };
const CAT_LETTER = { hist: 'H', arch: 'A', fun: 'Z' };
const CAT_NAME   = { hist: 'Historie', arch: 'Architektura', fun: 'Zajímavosti' };
const VISIT_KEY  = 'lop_visited_v1';
const WISH_KEY   = 'lop_wishlist_v2';

let PLACES   = [];
let activeFilter = 'all';

function getWished() {
  try { return JSON.parse(localStorage.getItem(WISH_KEY) || '[]').map(String); } catch(e) { return []; }
}

function isWished(id) {
  return getWished().includes(String(id));
}

function getVisited() {
  try { return JSON.parse(localStorage.getItem(VISIT_KEY) || '[]').map(String); } catch(e) { return []; }
}

function isVisited(id) {
  return getVisited().includes(String(id));
}

/* ── Načtení dat ── */
function haversineM(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function formatDist(m) {
  if (m < 1000) return Math.round(m) + ' m';
  return (m/1000).toFixed(1).replace('.', ',') + ' km';
}

let userPos = null;

function locateUser() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    userPos = [pos.coords.latitude, pos.coords.longitude];
    render(); // překresli s vzdálenostmi
  }, () => {}, { enableHighAccuracy: true, timeout: 8000 });
}

async function loadPlaces() {
  try {
    const res = await fetch('places.json');
    if (!res.ok) throw new Error('404');
    PLACES = await res.json();
  } catch(e) {
    document.getElementById('placesList').innerHTML =
      '<div class="empty"><h3>Nepodařilo se načíst místa</h3><p>Zkontrolujte připojení a obnovte stránku.</p></div>';
    return;
  }
  updateCounts();
  render();
}

/* ── Počty ── */
function updateCounts() {
  const visited = getVisited();
  document.getElementById('ctAll').textContent    = PLACES.length;
  document.getElementById('ctHist').textContent   = PLACES.filter(p => p.cat === 'hist').length;
  document.getElementById('ctArch').textContent   = PLACES.filter(p => p.cat === 'arch').length;
  document.getElementById('ctFun').textContent    = PLACES.filter(p => p.cat === 'fun').length;
  document.getElementById('ctVisited').textContent = PLACES.filter(p => visited.includes(String(p.id))).length;
}

/* ── Filtr ── */
function setFilter(cat) {
  activeFilter = cat;
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.cat === cat);
  });
  render();
}

/* ── Render ── */
function render() {
  const visited = getVisited();
  const wished  = getWished();
  const filtered = PLACES.filter(p => {
    if (activeFilter === 'all') return true;
    if (activeFilter === 'visited') return visited.includes(String(p.id));
    return p.cat === activeFilter;
  });

  if (filtered.length === 0) {
    document.getElementById('placesList').innerHTML =
      '<div class="empty"><h3>Žádná místa</h3><p>Zkuste jiný filtr.</p></div>';
    return;
  }

  // Seskup po kategoriích (jen při "Vše")
  let html = '';
  if (activeFilter === 'all') {
    const cats = ['hist', 'arch', 'fun'];
    cats.forEach(cat => {
      const items = filtered.filter(p => p.cat === cat);
      if (!items.length) return;
      html += `<div class="section-label" style="margin-top:20px">
        ${CAT_NAME[cat]} <span class="ct">${String(items.length).padStart(2,'0')}</span>
      </div>`;
      html += items.map(p => cardHTML(p, visited, wished)).join('');
    });
  } else {
    html += `<div class="section-label">
      ${activeFilter === 'visited' ? 'Navštíveno' : CAT_NAME[activeFilter]}
      <span class="ct">${String(filtered.length).padStart(2,'0')}</span>
    </div>`;
    html += filtered.map(p => cardHTML(p, visited, wished)).join('');
  }

  document.getElementById('placesList').innerHTML = html;
}

function cardHTML(p, visited, wished) {
  const color  = CAT_COLOR[p.cat]  || '#4A4A48';
  const letter = CAT_LETTER[p.cat] || 'H';
  const catName = CAT_NAME[p.cat]  || '';
  const vis    = visited.includes(String(p.id));
  const wish   = wished && wished.includes(String(p.id));
  const thumb  = p.thumb || '';
  const lede   = p.lede || '';
  const detailUrl = 'place/' + p.id + '.html';
  const dist   = userPos && p.lat && p.lng
    ? formatDist(haversineM(userPos[0], userPos[1], p.lat, p.lng))
    : '';

  return `<a class="place-card" href="${detailUrl}">
    <div class="place-thumb">
      ${thumb
        ? `<img src="${thumb}" alt="${p.name}" onerror="this.style.display='none'"/>`
        : ''}
      <div class="place-thumb-fallback">${letter}</div>
      <div class="place-id">${p.id}</div>
    </div>
    <div class="place-body">
      <div class="place-kick">
        <span class="dot" style="background:${color}"></span>
        <span>${catName}</span>
      </div>
      <div class="place-name">${p.name}</div>
      <div class="place-sub">${lede}</div>
    </div>
    <div class="place-meta">
      <div class="place-visited ${vis ? 'show' : ''}">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg>
      </div>
      <div class="place-wish ${wish ? 'show' : ''}">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
      </div>
      ${dist ? `<div class="place-dist">${dist}</div>` : ''}
    </div>
  </a>`;
}

loadPlaces();
locateUser();
</script>
</body>
</html>

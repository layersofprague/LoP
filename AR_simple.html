<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>AR Simple</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #f0c14e;
    --gold-dim: rgba(240,193,78,.55);
    --paper: #eeefeb;
    --ink: #0d0b08;
    --glass: rgba(13,11,8,.55);
    --glass-light: rgba(13,11,8,.35);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'JetBrains Mono', monospace;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ── CAMERA LAYER ── */
  #cam-layer {
    position: fixed; inset: 0;
    background: #111;
    overflow: hidden;
  }

  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: none;
  }

  /* Fallback when no camera */
  #cam-fallback {
    position: absolute; inset: 0;
    background-image: url('https://layersofprague.github.io/LoP/foto/h_001s.jpg');
    background-size: cover;
    background-position: center 35%;
    filter: brightness(.85);
  }

  /* ── HISTORICAL PHOTO LAYER ── */
  #hist-layer {
    position: fixed; inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  #hist-img {
    position: absolute;
    /* default: centered, full width */
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 35%;
    transform-origin: center center;
    will-change: transform;
    pointer-events: all;
    touch-action: none;
  }

  /* ── GRID OVERLAY ── */
  #grid {
    position: fixed; inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 33.33% 33.33%;
    opacity: 0;
    transition: opacity .4s;
  }
  #grid.visible { opacity: 1; }

  /* ── CROSSHAIR ── */
  #crosshair {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    width: 56px; height: 56px;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: var(--gold-dim);
  }
  #crosshair::before { top: 50%; left: -16px; right: -16px; height: 1px; margin-top: -.5px; }
  #crosshair::after  { left: 50%; top: -16px; bottom: -16px; width: 1px; margin-left: -.5px; }
  .ch-ring {
    position: absolute; inset: 0;
    border: 1.5px solid var(--gold-dim);
    border-radius: 50%;
  }
  /* Corner brackets */
  .ch-tl, .ch-tr, .ch-bl, .ch-br {
    position: absolute;
    width: 12px; height: 12px;
    border-color: var(--gold);
    border-style: solid;
  }
  .ch-tl { top: -8px; left: -8px;  border-width: 1.5px 0 0 1.5px; }
  .ch-tr { top: -8px; right: -8px; border-width: 1.5px 1.5px 0 0; }
  .ch-bl { bottom: -8px; left: -8px;  border-width: 0 0 1.5px 1.5px; }
  .ch-br { bottom: -8px; right: -8px; border-width: 0 1.5px 1.5px 0; }

  /* ── TOP BAR ── */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: env(safe-area-inset-top, 12px) 16px 12px;
    padding-top: max(env(safe-area-inset-top, 0px), 12px);
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, rgba(0,0,0,.7) 0%, transparent 100%);
    pointer-events: none;
    z-index: 100;
  }
  .top-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px;
    background: var(--glass);
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    border-radius: 99px;
    color: var(--paper);
    font-size: 9px; letter-spacing: .14em; text-transform: uppercase;
    pointer-events: all;
    border: 1px solid rgba(255,255,255,.08);
  }
  .top-chip.title {
    font-family: 'Fraunces', serif;
    font-style: italic; letter-spacing: 0;
    font-size: 13px; text-transform: none;
    font-weight: 300;
  }
  .dot-live {
    width: 6px; height: 6px; border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 0 2px rgba(74,222,128,.25);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }

  /* ── OPACITY SLIDER ── */
  #slider-wrap {
    position: fixed;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    z-index: 100;
  }
  .slider-lbl {
    font-size: 8px; letter-spacing: .14em; color: rgba(238,239,235,.5);
    text-transform: uppercase;
  }
  #opacity-slider {
    -webkit-appearance: none;
    appearance: none;
    writing-mode: vertical-lr;
    direction: rtl;
    width: 4px;
    height: 140px;
    background: transparent;
    outline: none;
    cursor: pointer;
  }
  #opacity-slider::-webkit-slider-runnable-track {
    width: 4px;
    background: rgba(255,255,255,.18);
    border-radius: 99px;
  }
  #opacity-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: 0 0 0 4px rgba(255,255,255,.2), 0 2px 8px rgba(0,0,0,.4);
    margin-left: -9px;
    cursor: pointer;
  }
  #opacity-slider::-moz-range-thumb {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--paper);
    box-shadow: 0 0 0 4px rgba(255,255,255,.2);
    border: none;
    cursor: pointer;
  }
  #opacity-slider::-moz-range-track {
    width: 4px;
    background: rgba(255,255,255,.18);
    border-radius: 99px;
  }

  /* ── BOTTOM BAR ── */
  #bottombar {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 16px 24px;
    padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px);
    background: linear-gradient(0deg, rgba(0,0,0,.75) 0%, transparent 100%);
    display: flex; align-items: center; justify-content: space-between;
    z-index: 100;
  }

  .cam-side-btn {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.1);
    display: flex; align-items: center; justify-content: center;
    color: var(--paper);
    cursor: pointer;
    transition: background .15s, transform .1s;
    flex-shrink: 0;
  }
  .cam-side-btn:active { background: rgba(255,255,255,.15); transform: scale(.93); }
  .cam-side-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Shutter button */
  #shutter {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--paper);
    border: 3px solid rgba(255,255,255,.5);
    box-shadow: 0 0 0 5px rgba(255,255,255,.18), 0 4px 20px rgba(0,0,0,.5);
    cursor: pointer;
    transition: transform .1s, box-shadow .1s;
    position: relative;
    flex-shrink: 0;
  }
  #shutter:active {
    transform: scale(.92);
    box-shadow: 0 0 0 3px rgba(255,255,255,.18), 0 2px 10px rgba(0,0,0,.5);
  }
  #shutter::after {
    content: '';
    position: absolute; inset: 5px;
    border-radius: 50%;
    border: 1.5px solid rgba(0,0,0,.15);
  }

  /* ── TOUCH HINT ── */
  #touch-hint {
    position: fixed;
    bottom: 110px; left: 50%; transform: translateX(-50%);
    padding: 8px 16px;
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 8px;
    color: var(--paper);
    font-family: 'Fraunces', serif;
    font-style: italic; font-weight: 300;
    font-size: 13px;
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    transition: opacity .4s;
    z-index: 100;
    border: 1px solid rgba(255,255,255,.08);
  }
  #touch-hint.show { opacity: 1; }

  /* ── CAM START OVERLAY ── */
  #cam-start {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    z-index: 200;
    backdrop-filter: blur(4px);
  }
  #cam-start .title {
    font-family: 'Fraunces', serif;
    font-style: italic; font-weight: 300;
    font-size: 26px;
    color: var(--paper);
    text-align: center;
    line-height: 1.2;
  }
  #cam-start .sub {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: rgba(238,239,235,.45);
    text-align: center;
    max-width: 240px;
    line-height: 1.6;
  }
  #cam-start-btn {
    padding: 14px 32px;
    background: var(--paper); color: var(--ink);
    border: none; border-radius: 99px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    cursor: pointer;
    font-weight: 500;
    transition: transform .1s, opacity .1s;
  }
  #cam-start-btn:active { transform: scale(.96); opacity: .85; }
  #cam-start-btn.secondary {
    background: transparent;
    color: rgba(238,239,235,.5);
    border: 1px solid rgba(255,255,255,.12);
    font-size: 10px;
    padding: 10px 24px;
  }

  /* ── FLASH ── */
  #flash {
    position: fixed; inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 300;
    transition: opacity .05s;
  }
  #flash.on { opacity: .85; }

  /* ── RESET HANDLE ── */
  #reset-btn {
    position: fixed;
    top: 50%;
    left: 16px;
    transform: translateY(-50%);
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--glass);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.08);
    display: flex; align-items: center; justify-content: center;
    color: rgba(238,239,235,.5);
    cursor: pointer;
    z-index: 100;
    transition: color .2s, background .2s;
  }
  #reset-btn:active { background: rgba(255,255,255,.15); color: var(--paper); }
  #reset-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }

  /* Portrait / Landscape tweaks */
  @media (orientation: landscape) {
    #slider-wrap {
      right: auto; left: 50%;
      top: auto; bottom: 20px;
      transform: translateX(-50%);
      flex-direction: row;
      align-items: center;
    }
    #opacity-slider {
      writing-mode: horizontal-tb;
      direction: ltr;
      width: 120px; height: 4px;
    }
    #opacity-slider::-webkit-slider-thumb { margin-left: 0; margin-top: -9px; }
    #bottombar { padding-bottom: max(env(safe-area-inset-bottom, 0px), 10px); padding-top: 10px; }
    #shutter { width: 60px; height: 60px; }
    .cam-side-btn { width: 42px; height: 42px; }
  }
</style>
</head>
<body>

<!-- Camera layer -->
<div id="cam-layer">
  <video id="video" autoplay playsinline muted></video>
  <div id="cam-fallback"></div>
</div>

<!-- Historical photo layer -->
<div id="hist-layer">
  <img id="hist-img"
    src="https://layersofprague.github.io/LoP/foto/h_001h.jpg"
    alt="Historická fotografie"
    draggable="false"
    crossorigin="anonymous"
  />
</div>

<!-- Grid -->
<div id="grid"></div>

<!-- Crosshair -->
<div id="crosshair">
  <div class="ch-ring"></div>
  <div class="ch-tl"></div>
  <div class="ch-tr"></div>
  <div class="ch-bl"></div>
  <div class="ch-br"></div>
</div>

<!-- Top bar -->
<div id="topbar">
  <div class="top-chip title">Layers of Prague</div>
  <div class="top-chip">
    <div class="dot-live"></div>
    <span id="live-label">Náhled</span>
  </div>
</div>

<!-- Opacity slider -->
<div id="slider-wrap">
  <span class="slider-lbl">ref</span>
  <input type="range" id="opacity-slider" min="0" max="100" value="50" step="1"/>
  <span class="slider-lbl">liv</span>
</div>

<!-- Reset button -->
<div id="reset-btn" title="Reset polohy">
  <svg viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
</div>

<!-- Touch hint -->
<div id="touch-hint">Táhni prstem pro posun</div>

<!-- Bottom bar -->
<div id="bottombar">
  <div class="cam-side-btn" id="grid-btn" title="Mřížka">
    <svg viewBox="0 0 24 24"><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
  </div>
  <div id="shutter"></div>
  <div class="cam-side-btn" id="cam-btn" title="Kamera">
    <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
  </div>
</div>

<!-- Camera start overlay -->
<div id="cam-start">
  <div class="title">Holešovický přístav<br/><em style="font-size:.75em; color:rgba(238,239,235,.5)">~&thinsp;1930</em></div>
  <div class="sub">Pohni historickou fotografii<br/>a zarovnej ji s realitou</div>
  <button id="cam-start-btn" onclick="startCamera()">Spustit kameru</button>
  <button class="cam-side-btn secondary" style="width:auto;height:auto;border-radius:99px" onclick="skipCamera()">Pokračovat bez kamery</button>
</div>

<!-- Flash effect -->
<div id="flash"></div>

<script>
// ── State ──────────────────────────────────────────────
const state = {
  tx: 0, ty: 0,        // translation
  scale: 1,            // scale
  skewX: 0,            // perspective skew (horizontal)
  opacity: 0.5,
  cameraActive: false,
};

const img = document.getElementById('hist-img');
const video = document.getElementById('video');
const fallback = document.getElementById('cam-fallback');
const slider = document.getElementById('opacity-slider');
const grid = document.getElementById('grid');
const hint = document.getElementById('touch-hint');
const liveLabel = document.getElementById('live-label');

// ── Apply transform ────────────────────────────────────
function applyTransform() {
  img.style.transform =
    `translate(${state.tx}px, ${state.ty}px) scale(${state.scale}) skewX(${state.skewX}deg)`;
  img.style.opacity = state.opacity;
}

applyTransform();

// ── Opacity slider ─────────────────────────────────────
slider.addEventListener('input', e => {
  state.opacity = e.target.value / 100;
  applyTransform();
});

// ── Touch handling ─────────────────────────────────────
let touches = {};
let lastMidpoint = null;
let lastDist = null;
let lastAngle = null;   // for perspective detection
let gestureMode = null; // 'translate' | 'scale' | 'perspective'
let hintTimer = null;

function midpoint(t1, t2) {
  return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
}
function dist(t1, t2) {
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx*dx + dy*dy);
}
function angle(t1, t2) {
  return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * 180 / Math.PI;
}

// Detect if two fingers are mostly horizontal (pinch from sides → perspective)
function isHorizontalPinch(t1, t2) {
  const dx = Math.abs(t1.clientX - t2.clientX);
  const dy = Math.abs(t1.clientY - t2.clientY);
  return dx > dy * 1.5;  // wider than tall → horizontal pinch
}
// Detect if two fingers are mostly vertical (pinch from top/bottom → scale)
function isVerticalPinch(t1, t2) {
  const dx = Math.abs(t1.clientX - t2.clientX);
  const dy = Math.abs(t1.clientY - t2.clientY);
  return dy > dx * 1.5;
}
// Diagonal → scale too
function isDiagonalPinch(t1, t2) {
  return !isHorizontalPinch(t1, t2) && !isVerticalPinch(t1, t2);
}

img.addEventListener('touchstart', e => {
  e.preventDefault();
  const tList = Array.from(e.touches);
  tList.forEach(t => { touches[t.identifier] = t; });

  if (e.touches.length === 2) {
    const [t1, t2] = [e.touches[0], e.touches[1]];
    lastMidpoint = midpoint(t1, t2);
    lastDist = dist(t1, t2);
    lastAngle = angle(t1, t2);

    // Determine gesture mode from initial finger placement
    if (isHorizontalPinch(t1, t2)) {
      gestureMode = 'perspective';
    } else {
      gestureMode = 'scale';
    }
  } else if (e.touches.length === 1) {
    gestureMode = 'translate';
    showHint('Táhni prstem pro posun');
  }
}, { passive: false });

img.addEventListener('touchmove', e => {
  e.preventDefault();
  const tList = Array.from(e.touches);
  tList.forEach(t => { touches[t.identifier] = t; });

  if (e.touches.length === 2) {
    const [t1, t2] = [e.touches[0], e.touches[1]];
    const mid = midpoint(t1, t2);
    const d = dist(t1, t2);

    if (gestureMode === 'perspective') {
      // Horizontal pinch → skewX
      const prevD = lastDist || d;
      const dDist = d - prevD;
      // Map distance change to skew: wider → less skew, narrower → more skew
      const dSkew = -dDist * 0.04;
      state.skewX = Math.max(-25, Math.min(25, state.skewX + dSkew));
      showHint('Perspektiva');
    } else {
      // Diagonal / vertical pinch → scale
      const scaleDelta = d / (lastDist || d);
      state.scale = Math.max(0.2, Math.min(4, state.scale * scaleDelta));

      // Also allow translation with two-finger drag
      if (lastMidpoint) {
        state.tx += mid.x - lastMidpoint.x;
        state.ty += mid.y - lastMidpoint.y;
      }
      showHint('Měřítko');
    }

    lastMidpoint = mid;
    lastDist = d;
    lastAngle = angle(t1, t2);

  } else if (e.touches.length === 1) {
    const t = e.touches[0];
    const prev = touches[t.identifier];
    if (prev) {
      state.tx += t.clientX - prev.clientX;
      state.ty += t.clientY - prev.clientY;
    }
  }

  // Update stored touches
  Array.from(e.touches).forEach(t => { touches[t.identifier] = t; });
  applyTransform();
}, { passive: false });

img.addEventListener('touchend', e => {
  e.preventDefault();
  Array.from(e.changedTouches).forEach(t => { delete touches[t.identifier]; });
  if (e.touches.length < 2) {
    lastMidpoint = null;
    lastDist = null;
    gestureMode = e.touches.length === 1 ? 'translate' : null;
  }
  if (e.touches.length === 0) {
    clearHint();
  }
}, { passive: false });

// ── Hint helper ────────────────────────────────────────
function showHint(text) {
  hint.textContent = text;
  hint.classList.add('show');
  clearTimeout(hintTimer);
}
function clearHint() {
  hintTimer = setTimeout(() => hint.classList.remove('show'), 800);
}

// ── Grid toggle ────────────────────────────────────────
document.getElementById('grid-btn').addEventListener('click', () => {
  grid.classList.toggle('visible');
});

// ── Reset ──────────────────────────────────────────────
document.getElementById('reset-btn').addEventListener('click', () => {
  state.tx = 0; state.ty = 0; state.scale = 1; state.skewX = 0;
  applyTransform();
  showHint('Reset');
  clearHint();
});

// ── Shutter ────────────────────────────────────────────
document.getElementById('shutter').addEventListener('click', () => {
  const flash = document.getElementById('flash');
  flash.classList.add('on');
  setTimeout(() => flash.classList.remove('on'), 120);
  // Placeholder — future: save / compare
});

// ── Camera ────────────────────────────────────────────
async function startCamera() {
  document.getElementById('cam-start').style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    video.style.display = 'block';
    fallback.style.display = 'none';
    state.cameraActive = true;
    liveLabel.textContent = 'Live';
  } catch(err) {
    console.warn('Kamera nedostupná:', err);
    fallback.style.display = 'block';
    liveLabel.textContent = 'Simulace';
  }
}

function skipCamera() {
  document.getElementById('cam-start').style.display = 'none';
  fallback.style.display = 'block';
  liveLabel.textContent = 'Simulace';
}

document.getElementById('cam-btn').addEventListener('click', () => {
  if (!state.cameraActive) {
    startCamera();
  } else {
    // Toggle camera facing if supported
    if (video.srcObject) {
      const tracks = video.srcObject.getTracks();
      tracks.forEach(t => t.stop());
    }
    video.style.display = 'none';
    fallback.style.display = 'block';
    state.cameraActive = false;
    liveLabel.textContent = 'Simulace';
  }
});

// ── Prevent default scroll/zoom on whole page ──────────
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ── Show initial hint after a beat ────────────────────
setTimeout(() => {
  showHint('Táhni prstem pro posun');
  clearHint();
}, 2000);
</script>
</body>
</html>

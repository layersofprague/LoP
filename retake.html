<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>RETAKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0a0a0a;
    --paper: #f0ebe2;
    --amber: #e8a020;
    --amber-dim: #a06810;
    --ghost: rgba(240,235,226,0.08);
    --ui-bg: rgba(10,10,10,0.72);
    --radius: 2px;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: 'Space Mono', monospace;
    color: var(--paper);
    touch-action: none;
  }

  /* ── SCREENS ── */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.4s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ── WELCOME ── */
  #screen-welcome {
    background: var(--ink);
    gap: 0;
    padding: 40px 32px;
  }
  .wordmark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(52px, 18vw, 96px);
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--paper);
    margin-bottom: 8px;
  }
  .wordmark span { color: var(--amber); }
  .tagline {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 56px;
  }
  .upload-zone {
    width: 100%;
    max-width: 340px;
    border: 1px solid #333;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--amber); background: rgba(232,160,32,0.04); }
  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-icon {
    width: 48px; height: 48px;
    border: 1px solid #444;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .upload-label { font-size: 13px; color: #aaa; text-align: center; line-height: 1.6; }
  .upload-label strong { color: var(--paper); display: block; font-size: 15px; margin-bottom: 4px; }
  .file-preview {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--amber);
    max-width: 100%;
  }
  .file-preview.visible { display: flex; }
  .file-preview span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px;
  }

  .btn-start {
    margin-top: 32px;
    width: 100%; max-width: 340px;
    padding: 16px;
    background: var(--amber);
    color: var(--ink);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    opacity: 0.3;
    pointer-events: none;
  }
  .btn-start.ready { opacity: 1; pointer-events: all; }
  .btn-start:active { transform: scale(0.98); }

  /* ── VIEWFINDER ── */
  #screen-viewfinder {
    background: #000;
    padding: 0;
    justify-content: flex-start;
  }

  .vf-stage {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  #overlay-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  /* flash effect */
  .flash {
    position: absolute; inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
    z-index: 10;
  }
  .flash.go { opacity: 1; transition: none; }

  /* ── PORTRAIT CONTROLS — panel dole ── */
  .controls-portrait {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
    padding: 16px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 5;
  }
  @media (orientation: landscape) { .controls-portrait { display: none; } }

  /* ── LANDSCAPE CONTROLS ── */
  /* Levý slider */
  .slider-left {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 44px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 5;
    padding: 16px 0;
  }
  /* Pravý slider */
  .slider-right {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 44px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 5;
    padding: 16px 0;
  }
  @media (orientation: landscape) {
    .slider-left  { display: flex; }
    .slider-right { display: flex; }
  }

  .edge-label {
    font-size: 8px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.28);
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
  .edge-val {
    font-size: 9px;
    color: rgba(255,255,255,0.28);
    font-family: 'Space Mono', monospace;
  }

  /* ── SHARED SLIDER STYLES ── */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.15);
    outline: none;
    border-radius: 0;
  }
  /* portrait — horizontal */
  @media (orientation: portrait) {
    input[type=range] { flex: 1; height: 1px; }
  }
  /* landscape — vertical */
  @media (orientation: landscape) {
    input[type=range] {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 1px;
      height: 120px;
      flex: none;
    }
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    cursor: pointer;
    border: none;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    cursor: pointer;
    border: none;
    box-shadow: none;
  }

  /* portrait slider rows */
  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .slider-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #888;
    width: 36px;
    flex-shrink: 0;
  }
  .slider-val {
    font-size: 10px;
    color: rgba(255,255,255,0.45);
    width: 32px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ── ACTION ROW (portrait) ── */
  .action-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  /* ── BACK BUTTON ── */
  .btn-back {
    width: 38px; height: 38px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.5);
    font-size: 15px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-back:active { border-color: var(--paper); color: var(--paper); }

  /* landscape back — bottom-left corner */
  .btn-back-landscape {
    position: absolute;
    bottom: 16px; left: 6px;
    width: 32px; height: 32px;
    border: 1px solid rgba(255,255,255,0.15);
    background: transparent;
    color: rgba(255,255,255,0.3);
    font-size: 13px;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    z-index: 6;
    transition: color 0.15s;
  }
  @media (orientation: landscape) {
    .btn-back-landscape { display: flex; }
  }
  .btn-back-landscape:active { color: var(--paper); }

  /* ── SHUTTER — průhledný kříž ── */
  .btn-shutter {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 6;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .shutter-cross {
    position: relative;
    width: 40px; height: 40px;
    opacity: 0.55;
    transition: opacity 0.1s, transform 0.08s;
  }
  .shutter-cross::before,
  .shutter-cross::after {
    content: '';
    position: absolute;
    background: var(--paper);
  }
  .shutter-cross::before { width: 1px; height: 100%; left: 50%; top: 0; }
  .shutter-cross::after  { height: 1px; width: 100%; top: 50%; left: 0; }
  /* corner ticks */
  .shutter-cross .tl, .shutter-cross .tr,
  .shutter-cross .bl, .shutter-cross .br {
    position: absolute;
    width: 8px; height: 8px;
    border-color: var(--paper);
    border-style: solid;
    opacity: 0.7;
  }
  .shutter-cross .tl { top: 0; left: 0;  border-width: 1px 0 0 1px; }
  .shutter-cross .tr { top: 0; right: 0; border-width: 1px 1px 0 0; }
  .shutter-cross .bl { bottom: 0; left: 0;  border-width: 0 0 1px 1px; }
  .shutter-cross .br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

  .btn-shutter:active .shutter-cross { opacity: 1; transform: scale(1.15); }

  /* ── COUNTER (portrait) ── */
  .counter-block {
    width: 38px;
    text-align: center;
    flex-shrink: 0;
  }
  .counter-label { font-size: 9px; color: #555; letter-spacing: 0.1em; text-transform: uppercase; }
  .counter-num { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px; color: var(--paper); line-height: 1; }

  /* landscape counter — bottom-right */
  .counter-landscape {
    position: absolute;
    bottom: 14px; right: 6px;
    text-align: center;
    display: none;
    z-index: 6;
  }
  @media (orientation: landscape) { .counter-landscape { display: block; } }
  .counter-landscape .counter-num  { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px; color: rgba(255,255,255,0.4); line-height: 1; }
  .counter-landscape .counter-label { font-size: 7px; color: rgba(255,255,255,0.2); letter-spacing: 0.1em; text-transform: uppercase; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 120px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ui-bg);
    border: 1px solid #333;
    padding: 10px 18px;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--amber);
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    z-index: 20;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }


</style>
</head>
<body>

<!-- WELCOME -->
<div class="screen" id="screen-welcome">
  <div class="wordmark">RE<span>T</span>AKE</div>
  <div class="tagline">Fotografuj historii znovu</div>

  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept="image/*">
    <div class="upload-icon">📷</div>
    <div class="upload-label">
      <strong>Načíst historickou fotografii</strong>
      klepni nebo přetáhni soubor
    </div>
  </div>

  <div class="file-preview" id="file-preview">
    <span id="file-name"></span>
  </div>

  <button class="btn-start" id="btn-start">Spustit hledáček →</button>
</div>

<!-- VIEWFINDER -->
<div class="screen hidden" id="screen-viewfinder">
  <div class="vf-stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay-canvas"></canvas>
    <div class="flash" id="flash"></div>

    <!-- Spoušť = průhledný kříž uprostřed -->
    <button class="btn-shutter" id="btn-shutter" title="Vyfotit">
      <div class="shutter-cross">
        <div class="tl"></div><div class="tr"></div>
        <div class="bl"></div><div class="br"></div>
      </div>
    </button>

    <!-- PORTRAIT ovládání -->
    <div class="controls-portrait">
      <div class="slider-row">
        <span class="slider-label">Překryv</span>
        <input type="range" id="opacity-slider" min="0" max="100" value="50">
        <span class="slider-val" id="opacity-val">50%</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Velikost</span>
        <input type="range" id="scale-slider" min="20" max="200" value="100">
        <span class="slider-val" id="scale-val">100%</span>
      </div>
      <div class="action-row">
        <button class="btn-back" id="btn-back-portrait" title="Zpět">←</button>
        <div style="flex:1"></div>
        <div class="counter-block">
          <div class="counter-num" id="counter-portrait">0</div>
          <div class="counter-label">fotek</div>
        </div>
      </div>
    </div>

    <!-- LANDSCAPE — levý slider (překryv) -->
    <div class="slider-left">
      <span class="edge-label">Překryv</span>
      <input type="range" id="opacity-slider-ls" min="0" max="100" value="50">
      <span class="edge-val" id="opacity-val-ls">50%</span>
    </div>

    <!-- LANDSCAPE — pravý slider (velikost) -->
    <div class="slider-right">
      <span class="edge-label">Velikost</span>
      <input type="range" id="scale-slider-ls" min="20" max="200" value="100">
      <span class="edge-val" id="scale-val-ls">100%</span>
    </div>

    <!-- LANDSCAPE — zpět (levý dolní roh) -->
    <button class="btn-back-landscape" id="btn-back-landscape" title="Zpět">←</button>

    <!-- LANDSCAPE — counter (pravý dolní roh) -->
    <div class="counter-landscape">
      <div class="counter-num" id="counter-landscape">0</div>
      <div class="counter-label">fotek</div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<!-- hidden canvas for capture -->
<canvas id="capture-canvas" style="display:none"></canvas>

<script>
  let historicImg = null;
  let baseFilename = 'retake';
  let shotCount = 0;
  let stream = null;
  let overlayOpacity = 0.5;
  let overlayScale = 1.0;
  let animFrame = null;

  const screenWelcome    = document.getElementById('screen-welcome');
  const screenViewfinder = document.getElementById('screen-viewfinder');
  const fileInput        = document.getElementById('file-input');
  const uploadZone       = document.getElementById('upload-zone');
  const filePreview      = document.getElementById('file-preview');
  const fileNameEl       = document.getElementById('file-name');
  const btnStart         = document.getElementById('btn-start');
  const video            = document.getElementById('video');
  const overlayCanvas    = document.getElementById('overlay-canvas');
  const captureCanvas    = document.getElementById('capture-canvas');
  const flash            = document.getElementById('flash');
  const toast            = document.getElementById('toast');
  const overlayCtx       = overlayCanvas.getContext('2d');

  // sliders
  const opacitySlider   = document.getElementById('opacity-slider');
  const opacityVal      = document.getElementById('opacity-val');
  const scaleSlider     = document.getElementById('scale-slider');
  const scaleVal        = document.getElementById('scale-val');
  const opacitySliderLs = document.getElementById('opacity-slider-ls');
  const opacityValLs    = document.getElementById('opacity-val-ls');
  const scaleSliderLs   = document.getElementById('scale-slider-ls');
  const scaleValLs      = document.getElementById('scale-val-ls');

  // counters & back
  const counterPortrait  = document.getElementById('counter-portrait');
  const counterLandscape = document.getElementById('counter-landscape');
  const btnBackPortrait  = document.getElementById('btn-back-portrait');
  const btnBackLandscape = document.getElementById('btn-back-landscape');
  const btnShutter       = document.getElementById('btn-shutter');

  // ── FILE ──
  fileInput.addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); });
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault(); uploadZone.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });

  function loadFile(file) {
    baseFilename = file.name.replace(/\.[^/.]+$/, '');
    fileNameEl.textContent = file.name;
    filePreview.classList.add('visible');
    const reader = new FileReader();
    reader.onload = ev => {
      historicImg = new Image();
      historicImg.onload = () => btnStart.classList.add('ready');
      historicImg.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── START ──
  btnStart.addEventListener('click', async () => {
    if (!historicImg) return;
    // fullscreen
    try {
      const el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch(e) {}
    await startCamera();
    showScreen(screenViewfinder);
    shotCount = 0; updateCounter();
    startOverlay();
  });

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      await new Promise(resolve => { video.onloadedmetadata = resolve; video.onerror = resolve; });
      await video.play();
    } catch (err) { showToast('Kamera nedostupná: ' + err.message); }
  }

  // ── OVERLAY ──
  function startOverlay() {
    if (animFrame) cancelAnimationFrame(animFrame);
    function resize() {
      overlayCanvas.width  = overlayCanvas.offsetWidth;
      overlayCanvas.height = overlayCanvas.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    function drawLoop() {
      const w = overlayCanvas.width, h = overlayCanvas.height;
      overlayCtx.clearRect(0, 0, w, h);
      if (historicImg && overlayOpacity > 0) {
        overlayCtx.globalAlpha = overlayOpacity;
        const ir = historicImg.width / historicImg.height, cr = w / h;
        let bw, bh;
        if (ir > cr) { bh = h; bw = h * ir; } else { bw = w; bh = w / ir; }
        const dw = bw * overlayScale, dh = bh * overlayScale;
        overlayCtx.drawImage(historicImg, (w-dw)/2, (h-dh)/2, dw, dh);
        overlayCtx.globalAlpha = 1;
      }
      animFrame = requestAnimationFrame(drawLoop);
    }
    drawLoop();
  }

  // ── SLIDERS — synced portrait ↔ landscape ──
  function setOpacity(v) {
    overlayOpacity = v / 100;
    opacitySlider.value = v; opacityVal.textContent = v + '%';
    opacitySliderLs.value = v; opacityValLs.textContent = v + '%';
  }
  function setScale(v) {
    overlayScale = v / 100;
    scaleSlider.value = v; scaleVal.textContent = v + '%';
    scaleSliderLs.value = v; scaleValLs.textContent = v + '%';
  }
  opacitySlider.addEventListener('input',   e => setOpacity(+e.target.value));
  opacitySliderLs.addEventListener('input', e => setOpacity(+e.target.value));
  scaleSlider.addEventListener('input',     e => setScale(+e.target.value));
  scaleSliderLs.addEventListener('input',   e => setScale(+e.target.value));

  // ── SHUTTER ──
  btnShutter.addEventListener('click', capturePhoto);

  function capturePhoto() {
    if (!stream) return;
    flash.classList.add('go');
    requestAnimationFrame(() => setTimeout(() => flash.classList.remove('go'), 80));
    const vw = video.videoWidth, vh = video.videoHeight;
    captureCanvas.width = vw; captureCanvas.height = vh;
    const ctx = captureCanvas.getContext('2d');
    ctx.drawImage(video, 0, 0, vw, vh);
    shotCount++; updateCounter();
    const filename = `${baseFilename}_${shotCount}.jpg`;
    captureCanvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast(`Uloženo: ${filename}`);
    }, 'image/jpeg', 0.92);
  }

  function updateCounter() {
    counterPortrait.textContent = shotCount;
    counterLandscape.textContent = shotCount;
  }

  // ── BACK ──
  function goBack() {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    try { if (document.exitFullscreen) document.exitFullscreen(); } catch(e) {}
    showScreen(screenWelcome);
  }
  btnBackPortrait.addEventListener('click', goBack);
  btnBackLandscape.addEventListener('click', goBack);

  // ── HELPERS ──
  function showScreen(el) {
    [screenWelcome, screenViewfinder].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>RETAKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0a0a0a;
    --paper: #f0ebe2;
    --amber: #e8a020;
    --ui-bg: rgba(10,10,10,0.72);
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: 'Space Mono', monospace;
    color: var(--paper);
    touch-action: none;
  }

  /* ── SCREENS ── */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.35s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ── WELCOME ── */
  #screen-welcome { background: var(--ink); gap: 0; padding: 40px 32px; }

  .wordmark {
    font-family: 'Syne', sans-serif; font-weight: 800;
    font-size: clamp(52px, 18vw, 96px);
    letter-spacing: -0.04em; line-height: 1;
    color: var(--paper); margin-bottom: 8px;
  }
  .wordmark span { color: var(--amber); }

  .tagline {
    font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: #666; margin-bottom: 56px;
  }

  .upload-zone {
    width: 100%; max-width: 340px;
    border: 1px solid #333; padding: 32px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
    cursor: pointer; position: relative;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--amber); background: rgba(232,160,32,0.04); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }

  .upload-icon {
    width: 48px; height: 48px; border: 1px solid #444; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .upload-label { font-size: 13px; color: #aaa; text-align: center; line-height: 1.6; }
  .upload-label strong { color: var(--paper); display: block; font-size: 15px; margin-bottom: 4px; }

  .file-preview { display: none; align-items: center; gap: 10px; font-size: 12px; color: var(--amber); max-width: 100%; }
  .file-preview.visible { display: flex; }
  .file-preview span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }

  .btn-start {
    margin-top: 32px; width: 100%; max-width: 340px; padding: 16px;
    background: var(--amber); color: var(--ink);
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 15px;
    letter-spacing: 0.08em; text-transform: uppercase;
    border: none; cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    opacity: 0.3; pointer-events: none;
  }
  .btn-start.ready { opacity: 1; pointer-events: all; }
  .btn-start:active { transform: scale(0.98); }

  /* ── VIEWFINDER ── */
  #screen-viewfinder { background: #000; padding: 0; justify-content: flex-start; }
  .vf-stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
  #overlay-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

  /* flash */
  .flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; transition: opacity 0.05s; z-index: 20; }
  .flash.go { opacity: 1; transition: none; }

  /* ── SHUTTER — kříž uprostřed ── */
  .btn-shutter {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 88px; height: 88px;
    background: transparent; border: none; cursor: pointer;
    z-index: 6; display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
  }
  .shutter-cross {
    position: relative; width: 44px; height: 44px;
    opacity: 0.45; transition: opacity 0.1s, transform 0.08s;
  }
  .shutter-cross::before, .shutter-cross::after {
    content: ''; position: absolute; background: var(--paper);
  }
  .shutter-cross::before { width: 1px; height: 100%; left: 50%; top: 0; }
  .shutter-cross::after  { height: 1px; width: 100%; top: 50%; left: 0; }
  .shutter-cross .c { position: absolute; width: 9px; height: 9px; border-color: var(--paper); border-style: solid; opacity: 0.8; }
  .shutter-cross .tl { top:0; left:0;  border-width: 1px 0 0 1px; }
  .shutter-cross .tr { top:0; right:0; border-width: 1px 1px 0 0; }
  .shutter-cross .bl { bottom:0; left:0;  border-width: 0 0 1px 1px; }
  .shutter-cross .br { bottom:0; right:0; border-width: 0 1px 1px 0; }
  .btn-shutter:active .shutter-cross { opacity: 1; transform: scale(1.18); }

  /* ── SLIDERS base ── */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.16); outline: none; border-radius: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    background: rgba(255,255,255,0.55); border-radius: 50%;
    cursor: pointer; border: none;
  }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px;
    background: rgba(255,255,255,0.55); border-radius: 50%;
    cursor: pointer; border: none; box-shadow: none;
  }

  /* ── PORTRAIT CONTROLS ── */
  .controls-portrait {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.80) 0%, transparent 100%);
    padding: 12px 18px 28px;
    display: flex; flex-direction: column; gap: 9px; z-index: 5;
  }
  @media (orientation: landscape) { .controls-portrait { display: none !important; } }

  .slider-row { display: flex; align-items: center; gap: 10px; }
  .slider-icon { flex-shrink: 0; opacity: 0.5; display: flex; align-items: center; }
  .slider-val-p { font-size: 9px; color: rgba(255,255,255,0.35); width: 28px; text-align: right; flex-shrink: 0; }

  @media (orientation: portrait) { input[type=range] { flex: 1; height: 1px; } }

  .action-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }

  /* cycle camera button */
  .btn-cam-cycle {
    width: 34px; height: 34px;
    border: 1px solid rgba(255,255,255,0.16); background: transparent;
    color: rgba(255,255,255,0.55); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-cam-cycle:active { background: rgba(255,255,255,0.18); color: var(--paper); }

  .focal-bar { flex: 1; display: flex; align-items: center; justify-content: center; }
    width: 34px; height: 34px; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.16); background: transparent;
    color: rgba(255,255,255,0.4); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .btn-back-p:active { color: var(--paper); border-color: var(--paper); }

  .counter-p { flex-shrink: 0; text-align: center; min-width: 34px; }
  .counter-p .cn { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 17px; color: var(--paper); line-height: 1; }
  .counter-p .cl { font-size: 7px; color: #555; letter-spacing: 0.1em; text-transform: uppercase; }

  /* ── LANDSCAPE CONTROLS ── */
  .slider-left {
    position: absolute; left: 0; top: 0; bottom: 0; width: 36px;
    display: none; flex-direction: column; align-items: center; z-index: 5;
  }
  .slider-right {
    position: absolute; right: 0; top: 0; bottom: 0; width: 36px;
    display: none; flex-direction: column; align-items: center; z-index: 5;
  }
  @media (orientation: landscape) {
    .slider-left  { display: flex; }
    .slider-right { display: flex; }
  }

  .edge-icon { margin-top: 16px; opacity: 0.3; flex-shrink: 0; }
  .edge-slider-wrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  .edge-val { margin-bottom: 16px; font-size: 7px; color: rgba(255,255,255,0.22); font-family: 'Space Mono', monospace; flex-shrink: 0; }

  @media (orientation: landscape) {
    input[type=range].vertical {
      writing-mode: vertical-lr; direction: rtl;
      width: 1px; height: 90px; flex: none;
    }
  }

  /* Landscape focal — bottom center, above any chrome */
  .focal-bar-ls {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 5px; z-index: 6;
  }
  @media (orientation: landscape) { .focal-bar-ls { display: flex; } }

  /* Landscape back — bottom left, clear of slider */
  .btn-back-ls {
    position: absolute; bottom: 10px; left: 44px;
    width: 28px; height: 28px;
    border: 1px solid rgba(255,255,255,0.12); background: transparent;
    color: rgba(255,255,255,0.25); font-size: 11px; cursor: pointer;
    display: none; align-items: center; justify-content: center; z-index: 6;
  }
  @media (orientation: landscape) { .btn-back-ls { display: flex; } }
  .btn-back-ls:active { color: var(--paper); }

  /* Landscape counter — bottom right, clear of slider */
  .counter-ls {
    position: absolute; bottom: 10px; right: 44px;
    display: none; text-align: center; z-index: 6;
  }
  @media (orientation: landscape) { .counter-ls { display: block; } }
  .counter-ls .cn { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 13px; color: rgba(255,255,255,0.3); line-height: 1; }
  .counter-ls .cl { font-size: 6px; color: rgba(255,255,255,0.15); letter-spacing: 0.1em; text-transform: uppercase; }

  /* ── TOAST ── */
  .toast {
    position: fixed; bottom: 90px; left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--ui-bg); border: 1px solid #333;
    padding: 8px 14px; font-size: 11px; letter-spacing: 0.04em;
    color: var(--amber); opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none; z-index: 30; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- WELCOME -->
<div class="screen" id="screen-welcome">
  <div class="wordmark">RE<span>T</span>AKE</div>
  <div class="tagline">Fotografuj historii znovu</div>

  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept="image/*">
    <div class="upload-icon">📷</div>
    <div class="upload-label">
      <strong>Načíst historickou fotografii</strong>
      klepni nebo přetáhni soubor
    </div>
  </div>

  <div class="file-preview" id="file-preview">
    <span id="file-name"></span>
  </div>

  <button class="btn-start" id="btn-start">Spustit hledáček →</button>
</div>

<!-- VIEWFINDER -->
<div class="screen hidden" id="screen-viewfinder">
  <div class="vf-stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay-canvas"></canvas>
    <div class="flash" id="flash"></div>

    <!-- Spoušť = kříž uprostřed -->
    <button class="btn-shutter" id="btn-shutter">
      <div class="shutter-cross">
        <div class="c tl"></div><div class="c tr"></div>
        <div class="c bl"></div><div class="c br"></div>
      </div>
    </button>

    <!-- ── PORTRAIT panel ── -->
    <div class="controls-portrait">
      <div class="slider-row">
        <span class="slider-icon">
          <!-- layers / overlay icon -->
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M8 1.5L14 5L8 8.5L2 5L8 1.5Z" stroke="white" stroke-width="1.1" fill="none" stroke-linejoin="round"/>
            <path d="M2 8L8 11.5L14 8" stroke="white" stroke-width="1.1" fill="none" stroke-linecap="round"/>
          </svg>
        </span>
        <input type="range" id="opacity-slider" min="0" max="100" value="50">
        <span class="slider-val-p" id="opacity-val">50%</span>
      </div>
      <div class="slider-row">
        <span class="slider-icon">
          <!-- expand/scale icon -->
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
            <path d="M1.5 1.5H5.5M1.5 1.5V5.5M1.5 1.5L5.5 5.5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
            <path d="M14.5 14.5H10.5M14.5 14.5V10.5M14.5 14.5L10.5 10.5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
        </span>
        <input type="range" id="scale-slider" min="20" max="200" value="100">
        <span class="slider-val-p" id="scale-val">100%</span>
      </div>
      <div class="action-row">
        <button class="btn-back-p" id="btn-back-p">←</button>
        <div class="focal-bar" id="focal-bar-p">
          <button class="btn-cam-cycle" id="btn-cam-p" title="Přepnout kameru">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="8" cy="8" r="3" stroke="white" stroke-width="1.1"/>
              <path d="M3 5H2V3.5C2 2.67 2.67 2 3.5 2H5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
              <path d="M13 5H14V3.5C14 2.67 13.33 2 12.5 2H11" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
              <path d="M3 11H2V12.5C2 13.33 2.67 14 3.5 14H5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
              <path d="M13 11H14V12.5C14 13.33 13.33 14 12.5 14H11" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="counter-p">
          <div class="cn" id="counter-p">0</div>
          <div class="cl">fotek</div>
        </div>
      </div>
    </div>

    <!-- ── LANDSCAPE levý okraj — opacity ── -->
    <div class="slider-left">
      <span class="edge-icon">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <path d="M8 1.5L14 5L8 8.5L2 5L8 1.5Z" stroke="white" stroke-width="1.1" fill="none" stroke-linejoin="round"/>
          <path d="M2 8L8 11.5L14 8" stroke="white" stroke-width="1.1" fill="none" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="edge-slider-wrap">
        <input type="range" class="vertical" id="opacity-slider-ls" min="0" max="100" value="50">
      </div>
      <span class="edge-val" id="opacity-val-ls">50%</span>
    </div>

    <!-- ── LANDSCAPE pravý okraj — scale ── -->
    <div class="slider-right">
      <span class="edge-icon">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
          <path d="M1.5 1.5H5.5M1.5 1.5V5.5M1.5 1.5L5.5 5.5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
          <path d="M14.5 14.5H10.5M14.5 14.5V10.5M14.5 14.5L10.5 10.5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="edge-slider-wrap">
        <input type="range" class="vertical" id="scale-slider-ls" min="20" max="200" value="100">
      </div>
      <span class="edge-val" id="scale-val-ls">100%</span>
    </div>

    <!-- LANDSCAPE zpět -->
    <button class="btn-back-ls" id="btn-back-ls">←</button>

    <!-- LANDSCAPE focal / cycle camera -->
    <div class="focal-bar-ls">
      <button class="btn-cam-cycle" id="btn-cam-ls" title="Přepnout kameru">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="3" stroke="white" stroke-width="1.1"/>
          <path d="M3 5H2V3.5C2 2.67 2.67 2 3.5 2H5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
          <path d="M13 5H14V3.5C14 2.67 13.33 2 12.5 2H5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
          <path d="M3 11H2V12.5C2 13.33 2.67 14 3.5 14H5" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
          <path d="M13 11H14V12.5C14 13.33 13.33 14 12.5 14H11" stroke="white" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- LANDSCAPE counter -->
    <div class="counter-ls">
      <div class="cn" id="counter-ls">0</div>
      <div class="cl">fotek</div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="capture-canvas" style="display:none"></canvas>

<script>
  // ── STATE ──
  let historicImg = null;
  let baseFilename = 'retake';
  let shotCount = 0;
  let stream = null;
  let overlayOpacity = 0.5;
  let overlayScale = 1.0;
  let animFrame = null;
  let viewfinderActive = false;

  // ── ELEMENTS ──
  const screenWelcome    = document.getElementById('screen-welcome');
  const screenViewfinder = document.getElementById('screen-viewfinder');
  const fileInput        = document.getElementById('file-input');
  const uploadZone       = document.getElementById('upload-zone');
  const filePreview      = document.getElementById('file-preview');
  const fileNameEl       = document.getElementById('file-name');
  const btnStart         = document.getElementById('btn-start');
  const video            = document.getElementById('video');
  const overlayCanvas    = document.getElementById('overlay-canvas');
  const captureCanvas    = document.getElementById('capture-canvas');
  const flash            = document.getElementById('flash');
  const toast            = document.getElementById('toast');
  const overlayCtx       = overlayCanvas.getContext('2d');
  const opacitySlider    = document.getElementById('opacity-slider');
  const opacityVal       = document.getElementById('opacity-val');
  const scaleSlider      = document.getElementById('scale-slider');
  const scaleVal         = document.getElementById('scale-val');
  const opacitySliderLs  = document.getElementById('opacity-slider-ls');
  const opacityValLs     = document.getElementById('opacity-val-ls');
  const scaleSliderLs    = document.getElementById('scale-slider-ls');
  const scaleValLs       = document.getElementById('scale-val-ls');
  const counterP         = document.getElementById('counter-p');
  const counterLs        = document.getElementById('counter-ls');
  const btnBackP         = document.getElementById('btn-back-p');
  const btnBackLs        = document.getElementById('btn-back-ls');
  const btnShutter       = document.getElementById('btn-shutter');
  const focalBarP        = document.getElementById('focal-bar-p');
  const focalBarLs       = document.getElementById('focal-bar-ls');

  // ── FILE ──
  fileInput.addEventListener('change', e => { const f = e.target.files[0]; if (f) loadFile(f); });
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault(); uploadZone.classList.remove('drag');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });

  function loadFile(file) {
    baseFilename = file.name.replace(/\.[^/.]+$/, '');
    fileNameEl.textContent = file.name;
    filePreview.classList.add('visible');
    const reader = new FileReader();
    reader.onload = ev => {
      historicImg = new Image();
      historicImg.onload = () => btnStart.classList.add('ready');
      historicImg.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── FULLSCREEN ──
  function enterFullscreen() {
    const el = document.documentElement;
    try {
      if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' });
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch(e) {}
  }

  // Re-request fullscreen if lost while viewfinder is active
  // (triggered by orientation change on some Android browsers)
  function onFsChange() {
    const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if (!isFs && viewfinderActive) {
      setTimeout(enterFullscreen, 350);
    }
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  // ── CAMERAS — simple cycle through all videoinput devices ──
  let allDeviceIds = [];   // populated after first getUserMedia
  let activeCamIdx = 0;

  async function gatherDeviceIds() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const ids = devices.filter(d => d.kind === 'videoinput').map(d => d.deviceId);
      if (ids.length > 0) allDeviceIds = ids;
    } catch(e) {}
    // show/hide cycle button
    const show = allDeviceIds.length > 1;
    ['btn-cam-p','btn-cam-ls'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.visibility = show ? 'visible' : 'hidden';
    });
  }

  async function cycleCamera() {
    if (allDeviceIds.length <= 1) return;
    activeCamIdx = (activeCamIdx + 1) % allDeviceIds.length;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    await startCamera();
    showToast(`Kamera ${activeCamIdx + 1} / ${allDeviceIds.length}`);
  }

  document.getElementById('btn-cam-p').addEventListener('click', cycleCamera);
  document.getElementById('btn-cam-ls').addEventListener('click', cycleCamera);

  // ── START ──
  btnStart.addEventListener('click', async () => {
    if (!historicImg) return;
    enterFullscreen();
    await startCamera();
    await gatherDeviceIds();
    viewfinderActive = true;
    showScreen(screenViewfinder);
    shotCount = 0; updateCounter();
    startOverlay();
  });

  async function startCamera() {
    try {
      let videoConstraints;
      if (allDeviceIds.length > 0 && allDeviceIds[activeCamIdx]) {
        videoConstraints = {
          deviceId: { exact: allDeviceIds[activeCamIdx] },
          width: { ideal: 1920 }, height: { ideal: 1080 }
        };
      } else {
        videoConstraints = {
          facingMode: { exact: 'environment' },
          width: { ideal: 1920 }, height: { ideal: 1080 }
        };
      }
      stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints, audio: false });
      video.srcObject = stream;
      await new Promise(resolve => { video.onloadedmetadata = resolve; video.onerror = resolve; });
      await video.play();
    } catch(err) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } }, audio: false
        });
        video.srcObject = stream;
        await new Promise(resolve => { video.onloadedmetadata = resolve; video.onerror = resolve; });
        await video.play();
      } catch(err2) { showToast('Kamera: ' + err2.message); }
    }
  }

  // ── OVERLAY ──
  function startOverlay() {
    if (animFrame) cancelAnimationFrame(animFrame);
    function resize() {
      overlayCanvas.width  = overlayCanvas.offsetWidth;
      overlayCanvas.height = overlayCanvas.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);
    function drawLoop() {
      const w = overlayCanvas.width, h = overlayCanvas.height;
      overlayCtx.clearRect(0, 0, w, h);
      if (historicImg && overlayOpacity > 0) {
        overlayCtx.globalAlpha = overlayOpacity;
        const ir = historicImg.width / historicImg.height, cr = w / h;
        let bw, bh;
        if (ir > cr) { bh = h; bw = h * ir; } else { bw = w; bh = w / ir; }
        const dw = bw * overlayScale, dh = bh * overlayScale;
        overlayCtx.drawImage(historicImg, (w-dw)/2, (h-dh)/2, dw, dh);
        overlayCtx.globalAlpha = 1;
      }
      animFrame = requestAnimationFrame(drawLoop);
    }
    drawLoop();
  }

  // ── SLIDERS ──
  function setOpacity(v) {
    overlayOpacity = v / 100;
    opacitySlider.value = v;   opacityVal.textContent   = v + '%';
    opacitySliderLs.value = v; opacityValLs.textContent = v + '%';
  }
  function setScale(v) {
    overlayScale = v / 100;
    scaleSlider.value = v;   scaleVal.textContent   = v + '%';
    scaleSliderLs.value = v; scaleValLs.textContent = v + '%';
  }
  opacitySlider.addEventListener('input',   e => setOpacity(+e.target.value));
  opacitySliderLs.addEventListener('input', e => setOpacity(+e.target.value));
  scaleSlider.addEventListener('input',     e => setScale(+e.target.value));
  scaleSliderLs.addEventListener('input',   e => setScale(+e.target.value));

  // ── SHUTTER ──
  btnShutter.addEventListener('click', capturePhoto);

  function capturePhoto() {
    if (!stream) return;
    flash.classList.add('go');
    requestAnimationFrame(() => setTimeout(() => flash.classList.remove('go'), 80));
    const vw = video.videoWidth, vh = video.videoHeight;
    captureCanvas.width = vw; captureCanvas.height = vh;
    captureCanvas.getContext('2d').drawImage(video, 0, 0, vw, vh);
    shotCount++; updateCounter();
    const filename = `${baseFilename}_${shotCount}.jpg`;
    captureCanvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast(`Uloženo: ${filename}`);
    }, 'image/jpeg', 0.92);
  }

  function updateCounter() {
    counterP.textContent  = shotCount;
    counterLs.textContent = shotCount;
  }

  // ── BACK ──
  function goBack() {
    viewfinderActive = false;
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    try {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch(e) {}
    allDeviceIds = []; activeCamIdx = 0;
    showScreen(screenWelcome);
  }
  btnBackP.addEventListener('click', goBack);
  btnBackLs.addEventListener('click', goBack);

  // ── HELPERS ──
  function showScreen(el) {
    [screenWelcome, screenViewfinder].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
  }
</script>
</body>
</html>

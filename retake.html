<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>RETAKE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0a0a0a;
    --paper: #f0ebe2;
    --amber: #e8a020;
    --amber-dim: #a06810;
    --ghost: rgba(240,235,226,0.08);
    --ui-bg: rgba(10,10,10,0.72);
    --radius: 2px;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--ink);
    font-family: 'Space Mono', monospace;
    color: var(--paper);
    touch-action: none;
  }

  /* ── SCREENS ── */
  .screen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 0.4s ease;
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  /* ── WELCOME ── */
  #screen-welcome {
    background: var(--ink);
    gap: 0;
    padding: 40px 32px;
  }
  .wordmark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(52px, 18vw, 96px);
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--paper);
    margin-bottom: 8px;
  }
  .wordmark span { color: var(--amber); }
  .tagline {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 56px;
  }
  .upload-zone {
    width: 100%;
    max-width: 340px;
    border: 1px solid #333;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s, background 0.2s;
  }
  .upload-zone:hover, .upload-zone.drag { border-color: var(--amber); background: rgba(232,160,32,0.04); }
  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .upload-icon {
    width: 48px; height: 48px;
    border: 1px solid #444;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .upload-label { font-size: 13px; color: #aaa; text-align: center; line-height: 1.6; }
  .upload-label strong { color: var(--paper); display: block; font-size: 15px; margin-bottom: 4px; }
  .file-preview {
    display: none;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--amber);
    max-width: 100%;
  }
  .file-preview.visible { display: flex; }
  .file-preview span {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px;
  }

  .btn-start {
    margin-top: 32px;
    width: 100%; max-width: 340px;
    padding: 16px;
    background: var(--amber);
    color: var(--ink);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    opacity: 0.3;
    pointer-events: none;
  }
  .btn-start.ready { opacity: 1; pointer-events: all; }
  .btn-start:active { transform: scale(0.98); }

  /* ── VIEWFINDER ── */
  #screen-viewfinder {
    background: #000;
    padding: 0;
    justify-content: flex-start;
  }

  .vf-stage {
    position: relative;
    width: 100%; height: 100%;
    overflow: hidden;
  }

  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
  }

  #overlay-canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  /* flash effect */
  .flash {
    position: absolute; inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
    z-index: 10;
  }
  .flash.go { opacity: 1; transition: none; }

  /* ── CONTROLS PANEL ── */
  .controls {
    position: absolute;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* PORTRAIT — panel dole */
  @media (orientation: portrait) {
    .controls {
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.90) 0%, transparent 100%);
      padding: 20px 20px 36px;
    }
  }

  /* LANDSCAPE — panel vpravo */
  @media (orientation: landscape) {
    .controls {
      top: 0; right: 0; bottom: 0;
      width: 160px;
      background: linear-gradient(to left, rgba(0,0,0,0.90) 0%, transparent 100%);
      padding: 16px 16px 16px 12px;
      justify-content: center;
      gap: 18px;
    }
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* landscape: slidery svisle */
  @media (orientation: landscape) {
    .slider-row {
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
  }

  .slider-label {
    font-size: 9px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #999;
    flex-shrink: 0;
  }

  @media (orientation: portrait)  { .slider-label { width: 32px; } }
  @media (orientation: landscape) { .slider-label { width: auto; } }

  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 2px;
    background: #444;
    outline: none;
    border-radius: 0;
  }

  /* svislý slider v landscape */
  @media (orientation: landscape) {
    input[type=range] {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 2px;
      height: 80px;
      flex: none;
    }
  }

  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    background: var(--amber);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid var(--ink);
  }
  input[type=range]::-moz-range-thumb {
    width: 18px; height: 18px;
    background: var(--amber);
    border-radius: 50%;
    cursor: pointer;
    border: 2px solid var(--ink);
    box-shadow: none;
  }
  .slider-val {
    font-size: 11px;
    color: var(--amber);
    flex-shrink: 0;
  }
  @media (orientation: portrait)  { .slider-val { width: 34px; text-align: right; } }
  @media (orientation: landscape) { .slider-val { width: auto; text-align: center; } }

  .action-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  @media (orientation: landscape) {
    .action-row {
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }
  }

  .btn-back {
    width: 40px; height: 40px;
    border: 1px solid #444;
    background: transparent;
    color: #aaa;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: border-color 0.15s, color 0.15s;
  }
  .btn-back:active { border-color: var(--paper); color: var(--paper); }

  .btn-shutter {
    width: 64px; height: 64px;
    border-radius: 50%;
    border: 3px solid var(--paper);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    position: relative;
    flex-shrink: 0;
    transition: transform 0.08s;
  }
  .btn-shutter::after {
    content: '';
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--paper);
    transition: background 0.1s, transform 0.08s;
  }
  .btn-shutter:active { transform: scale(0.93); }
  .btn-shutter:active::after { background: var(--amber); }

  .counter-block {
    width: 40px;
    text-align: center;
    flex-shrink: 0;
  }
  .counter-label { font-size: 9px; color: #666; letter-spacing: 0.1em; text-transform: uppercase; }
  .counter-num { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 20px; color: var(--paper); line-height: 1; }

  /* ── TOP BAR ── */
  .top-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: env(safe-area-inset-top, 12px) 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    z-index: 5;
  }
  .top-wordmark {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.02em;
    color: var(--paper);
  }
  .top-wordmark span { color: var(--amber); }
  .filename-badge {
    font-size: 10px;
    color: #888;
    max-width: 180px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    text-align: right;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 120px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ui-bg);
    border: 1px solid #333;
    padding: 10px 18px;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--amber);
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s;
    pointer-events: none;
    z-index: 20;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* crosshair */
  .crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 4;
    opacity: 0.35;
  }
  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: var(--paper);
  }
  .crosshair::before { width: 1px; height: 24px; top: -12px; left: 0; }
  .crosshair::after  { width: 24px; height: 1px; left: -12px; top: 0; }
</style>
</head>
<body>

<!-- WELCOME -->
<div class="screen" id="screen-welcome">
  <div class="wordmark">RE<span>T</span>AKE</div>
  <div class="tagline">Fotografuj historii znovu</div>

  <div class="upload-zone" id="upload-zone">
    <input type="file" id="file-input" accept="image/*">
    <div class="upload-icon">📷</div>
    <div class="upload-label">
      <strong>Načíst historickou fotografii</strong>
      klepni nebo přetáhni soubor
    </div>
  </div>

  <div class="file-preview" id="file-preview">
    <span id="file-name"></span>
  </div>

  <button class="btn-start" id="btn-start">Spustit hledáček →</button>
</div>

<!-- VIEWFINDER -->
<div class="screen hidden" id="screen-viewfinder">
  <div class="vf-stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay-canvas"></canvas>
    <div class="crosshair"></div>
    <div class="flash" id="flash"></div>

    <div class="top-bar">
      <div class="top-wordmark">RE<span>T</span>AKE</div>
      <div class="filename-badge" id="top-filename"></div>
    </div>

    <div class="controls">
      <div class="slider-row">
        <span class="slider-label">Překryv</span>
        <input type="range" id="opacity-slider" min="0" max="100" value="50">
        <span class="slider-val" id="opacity-val">50%</span>
      </div>
      <div class="slider-row">
        <span class="slider-label">Velikost</span>
        <input type="range" id="scale-slider" min="20" max="200" value="100">
        <span class="slider-val" id="scale-val">100%</span>
      </div>

      <div class="action-row">
        <button class="btn-back" id="btn-back" title="Zpět">←</button>
        <button class="btn-shutter" id="btn-shutter" title="Vyfotit"></button>
        <div class="counter-block">
          <div class="counter-num" id="counter">0</div>
          <div class="counter-label">fotek</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- hidden canvas for capture -->
<canvas id="capture-canvas" style="display:none"></canvas>

<script>
  // ── STATE ──
  let historicImg = null;
  let baseFilename = 'retake';
  let shotCount = 0;
  let stream = null;
  let overlayOpacity = 0.5;
  let overlayScale = 1.0;
  let animFrame = null;

  // ── ELEMENTS ──
  const screenWelcome   = document.getElementById('screen-welcome');
  const screenViewfinder = document.getElementById('screen-viewfinder');
  const fileInput       = document.getElementById('file-input');
  const uploadZone      = document.getElementById('upload-zone');
  const filePreview     = document.getElementById('file-preview');
  const fileNameEl      = document.getElementById('file-name');
  const btnStart        = document.getElementById('btn-start');
  const video           = document.getElementById('video');
  const overlayCanvas   = document.getElementById('overlay-canvas');
  const captureCanvas   = document.getElementById('capture-canvas');
  const opacitySlider   = document.getElementById('opacity-slider');
  const opacityVal      = document.getElementById('opacity-val');
  const scaleSlider     = document.getElementById('scale-slider');
  const scaleVal        = document.getElementById('scale-val');
  const btnShutter      = document.getElementById('btn-shutter');
  const btnBack         = document.getElementById('btn-back');
  const counterEl       = document.getElementById('counter');
  const topFilename     = document.getElementById('top-filename');
  const flash           = document.getElementById('flash');
  const toast           = document.getElementById('toast');
  const overlayCtx      = overlayCanvas.getContext('2d');

  // ── FILE LOAD ──
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    loadFile(file);
  });

  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadFile(file);
  });

  function loadFile(file) {
    const raw = file.name.replace(/\.[^/.]+$/, ''); // strip extension
    baseFilename = raw;
    fileNameEl.textContent = file.name;
    filePreview.classList.add('visible');

    const reader = new FileReader();
    reader.onload = ev => {
      historicImg = new Image();
      historicImg.onload = () => {
        btnStart.classList.add('ready');
      };
      historicImg.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  // ── START ──
  btnStart.addEventListener('click', async () => {
    if (!historicImg) return;
    await startCamera();
    showScreen(screenViewfinder);
    topFilename.textContent = baseFilename;
    shotCount = 0;
    counterEl.textContent = '0';
    startOverlay();
  });

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false
      });
      video.srcObject = stream;
      await new Promise(resolve => {
        video.onloadedmetadata = () => resolve();
        video.onerror = () => resolve();
      });
      await video.play();
    } catch (err) {
      showToast('Kamera nedostupná: ' + err.message);
    }
  }

  // ── OVERLAY LOOP ──
  function startOverlay() {
    if (animFrame) cancelAnimationFrame(animFrame);

    function resize() {
      overlayCanvas.width  = overlayCanvas.offsetWidth;
      overlayCanvas.height = overlayCanvas.offsetHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    function drawLoop() {
      const w = overlayCanvas.width;
      const h = overlayCanvas.height;
      overlayCtx.clearRect(0, 0, w, h);

      if (historicImg && overlayOpacity > 0) {
        overlayCtx.globalAlpha = overlayOpacity;

        // cover-fit then apply scale around center
        const imgRatio = historicImg.width / historicImg.height;
        const canvRatio = w / h;
        let baseW, baseH;
        if (imgRatio > canvRatio) {
          baseH = h; baseW = h * imgRatio;
        } else {
          baseW = w; baseH = w / imgRatio;
        }
        const dw = baseW * overlayScale;
        const dh = baseH * overlayScale;
        const dx = (w - dw) / 2;
        const dy = (h - dh) / 2;

        overlayCtx.drawImage(historicImg, dx, dy, dw, dh);
        overlayCtx.globalAlpha = 1;
      }

      animFrame = requestAnimationFrame(drawLoop);
    }
    drawLoop();
  }

  // ── SLIDER ──
  opacitySlider.addEventListener('input', e => {
    overlayOpacity = e.target.value / 100;
    opacityVal.textContent = e.target.value + '%';
  });

  scaleSlider.addEventListener('input', e => {
    overlayScale = e.target.value / 100;
    scaleVal.textContent = e.target.value + '%';
  });

  // ── SHUTTER ──
  btnShutter.addEventListener('click', capturePhoto);

  function capturePhoto() {
    if (!stream) return;

    // flash
    flash.classList.add('go');
    requestAnimationFrame(() => {
      setTimeout(() => flash.classList.remove('go'), 80);
    });

    const vw = video.videoWidth;
    const vh = video.videoHeight;
    captureCanvas.width  = vw;
    captureCanvas.height = vh;
    const ctx = captureCanvas.getContext('2d');

    // draw live frame
    ctx.drawImage(video, 0, 0, vw, vh);

    // save
    shotCount++;
    counterEl.textContent = shotCount;

    const filename = `${baseFilename}_${shotCount}.jpg`;
    captureCanvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      showToast(`Uloženo: ${filename}`);
    }, 'image/jpeg', 0.92);
  }

  // ── BACK ──
  btnBack.addEventListener('click', () => {
    if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    showScreen(screenWelcome);
  });

  // ── HELPERS ──
  function showScreen(el) {
    [screenWelcome, screenViewfinder].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  let toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
  }
</script>
</body>
</html>

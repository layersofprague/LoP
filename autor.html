<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#1a1a18"/>
<title>Profil autora — LayersOfPrague</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:#eeefeb;--paper-2:#e6e7e2;--paper-3:#dadcd4;
  --ink:#1a1a18;--ink-2:#3a3a36;--ink-3:#6a6a64;--ink-4:#9a9a94;
  --rule:#cbcec5;--accent:#b04020;--ok:#3d7a4a;
  --cat-hist:#4A4A48;--cat-arch:#3B5F84;--cat-fun:#E0A020;
  --ease:cubic-bezier(.22,.8,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;min-height:100%;font-family:"Inter",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
.page{max-width:640px;margin:0 auto;padding:24px 20px 100px;}
.autor-hero{display:flex;flex-direction:column;align-items:center;padding:32px 0 28px;text-align:center;}
.autor-avatar{width:80px;height:80px;border-radius:50%;background:var(--cat-hist);color:var(--paper);display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-size:36px;font-style:italic;margin-bottom:14px;border:3px solid var(--paper);box-shadow:0 0 0 1px var(--rule),0 4px 16px rgba(26,24,20,.12);}
.autor-name{font-family:"Fraunces",serif;font-size:26px;font-weight:400;letter-spacing:-.015em;margin-bottom:8px;}
.autor-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;}
.autor-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:100px;background:var(--ink);color:var(--paper);font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;}
.autor-badge.secondary{background:var(--paper-2);color:var(--ink-2);}
.autor-bio{font-size:13.5px;color:var(--ink-3);line-height:1.6;max-width:32em;margin-top:8px;}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-bottom:24px;}
.stat-cell{background:var(--paper);padding:14px 8px;text-align:center;}
.stat-num{font-family:"Fraunces",serif;font-size:24px;font-weight:400;line-height:1;color:var(--ink);margin-bottom:4px;}
.stat-lbl{font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);}
.stat-stars{display:flex;justify-content:center;gap:1px;color:var(--cat-fun);margin-bottom:4px;}
.section{margin-bottom:24px;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:8px;margin-bottom:8px;border-bottom:1px solid var(--rule);}
.section-label{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);}
.section-count{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-4);}
.place-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink);transition:color .15s;}
.place-row:last-child{border-bottom:none;}
.place-row:hover .place-row-name{color:var(--accent);}
.place-row-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.place-row-body{flex:1;min-width:0;}
.place-row-name{font-family:"Fraunces",serif;font-size:16px;font-weight:500;transition:color .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.place-row-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px;}
.place-row-arrow{color:var(--ink-4);flex-shrink:0;}
</style>
</head>
<body>
<div id="lop-header"></div>
<script src="header.js"></script>
<div class="page" id="page">
  <div class="autor-hero">
    <div class="autor-avatar" id="autorAvatar">L</div>
    <div class="autor-name" id="autorName">LayersOfPrague</div>
    <div class="autor-badges" id="autorBadges">
      <span class="autor-badge"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Kurátor</span>
      <span class="autor-badge secondary">Zakládající člen</span>
    </div>
    <div class="autor-bio" id="autorBio">Tým stojící za projektem Layers of Prague. Kurátorujeme historická zastavení napříč Prahou a propojujeme minulost s přítomností.</div>
  </div>
  <div class="stats-grid">
    <div class="stat-cell"><div class="stat-num" id="statPlaces">—</div><div class="stat-lbl">Zastavení</div></div>
    <div class="stat-cell"><div class="stat-num" id="statRoutes">3</div><div class="stat-lbl">Trasy</div></div>
    <div class="stat-cell"><div class="stat-num" id="statLikes">—</div><div class="stat-lbl">Lajků</div></div>
    <div class="stat-cell"><div class="stat-stars" id="statStars"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg></div><div class="stat-lbl">Hodnocení</div></div>
  </div>
  <div class="section">
    <div class="section-head">
      <span class="section-label">Zastavení</span>
      <span class="section-count" id="placesCount">—</span>
    </div>
    <div id="placesList"><div style="padding:20px 0;text-align:center;color:var(--ink-4);font-family:'JetBrains Mono',monospace;font-size:10px;">Načítám…</div></div>
  </div>
</div>
<div id="lop-nav"></div>
<script src="nav.js"></script>
<script>
const SUPA_URL="https://lomtaoctzetpweuepesp.supabase.co";
const SUPA_KEY="sb_publishable_uAQBxCOYWpc_PrEc78fFzw_kbeH4xj5";
const CAT_COLOR={hist:"#4A4A48",arch:"#3B5F84",fun:"#E0A020"};
const CAT_NAME={hist:"Historie",arch:"Architektura",fun:"Zajímavosti"};
const MIN_VOTES=5;
const AUTHORS={
  "layersofprague":{
    name:"LayersOfPrague",avatar:"L",
    bio:"Tým stojící za projektem Layers of Prague. Kurátorujeme historická zastavení napříč Prahou a propojujeme minulost s přítomností.",
    routes:3,
    places:["H001","H101","H102","H201","H202","H301","H302","H203"]
  }
};
function starsHTML(score){
  return Array.from({length:5},(_,i)=>`<svg width="12" height="12" viewBox="0 0 24 24" fill="${i<Math.round(score*5)?"currentColor":"none"}" stroke="currentColor" stroke-width="1.5"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`).join("");
}
async function loadAutor(){
  const id=new URLSearchParams(location.search).get("id")||"layersofprague";
  const autor=AUTHORS[id];
  if(!autor){document.getElementById("page").innerHTML="<div style='padding:48px;text-align:center;color:var(--ink-3)'>Autor nenalezen.</div>";return;}
  document.getElementById("autorAvatar").textContent=autor.avatar;
  document.getElementById("autorName").textContent=autor.name;
  document.getElementById("autorBio").textContent=autor.bio;
  document.getElementById("statRoutes").textContent=autor.routes;
  document.title=autor.name+" — LayersOfPrague";
  let places=[];
  try{
    const res=await fetch("places.json");
    if(res.ok){const all=await res.json();places=all.filter(p=>autor.places.includes(p.id));}
  }catch(e){}
  document.getElementById("statPlaces").textContent=places.length||autor.places.length;
  document.getElementById("placesCount").textContent=String(places.length||autor.places.length).padStart(2,"0");
  const list=document.getElementById("placesList");
  if(places.length){
    list.innerHTML=places.map(p=>{
      const color=CAT_COLOR[p.cat]||"#4A4A48";
      const cat=CAT_NAME[p.cat]||"";
      const name=typeof p.name==="object"?(p.name.cs||Object.values(p.name)[0]):p.name;
      const sub=typeof p.sub==="object"?(p.sub.cs||Object.values(p.sub)[0]):(p.sub||"");
      return `<a class="place-row" href="place/${p.id}.html"><span class="place-row-dot" style="background:${color}"></span><div class="place-row-body"><div class="place-row-name">${name}</div><div class="place-row-sub">${cat}${sub?" · "+sub:""}</div></div><div class="place-row-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></div></a>`;
    }).join("");
  } else {
    list.innerHTML=autor.places.map(id=>`<a class="place-row" href="place/${id}.html"><span class="place-row-dot" style="background:var(--cat-hist)"></span><div class="place-row-body"><div class="place-row-name">${id}</div></div><div class="place-row-arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></div></a>`).join("");
  }
  try{
    const ids=autor.places.map(id=>`place_id.eq.${id}`).join(",");
    const res=await fetch(`${SUPA_URL}/rest/v1/vote_counts?or=(${ids})&select=likes,dislikes`,{headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY}});
    const data=await res.json();
    if(Array.isArray(data)){
      const likes=data.reduce((s,r)=>s+(parseInt(r.likes)||0),0);
      const dislikes=data.reduce((s,r)=>s+(parseInt(r.dislikes)||0),0);
      const total=likes+dislikes;
      document.getElementById("statLikes").textContent=likes;
      if(total>=MIN_VOTES){document.getElementById("statStars").innerHTML=starsHTML(likes/total);}
      else{document.getElementById("statStars").innerHTML="<span style='font-size:10px;color:var(--ink-4);font-family:JetBrains Mono,monospace'>čeká</span>";}
    }
  }catch(e){}
}
loadAutor();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>a-map editor</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:system-ui,sans-serif;font-size:13px;background:#f5f5f3}
#app{display:flex;height:100vh}
#sidebar{width:330px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid #ddd;background:#fff}
#topbar{padding:10px 12px;border-bottom:1px solid #eee}
#topbar h1{font-size:14px;font-weight:600;margin-bottom:6px}
#search{width:100%;padding:6px 9px;border:1px solid #ddd;border-radius:6px;font-size:12px;outline:none}
#search:focus{border-color:#888}
#stats{font-size:11px;color:#888;margin-top:5px}
#list{flex:1;overflow-y:auto}
.item{padding:7px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;align-items:center;gap:8px}
.item:hover{background:#f7f7f5}
.item.active{background:#eff6ff;border-left:3px solid #2563eb}
.item.done{border-left:3px solid #16a34a}
.item.active.done{background:#f0fdf4;border-left:3px solid #16a34a}
.item-code{font-family:monospace;font-size:10px;font-weight:700;background:#1a1a18;color:#fff;border-radius:3px;padding:2px 5px;flex-shrink:0;min-width:44px;text-align:center}
.item.active .item-code{background:#2563eb}
.item.done .item-code{background:#16a34a}
.item.active.done .item-code{background:#16a34a}
.item-name{font-size:12px;line-height:1.3;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-check{color:#16a34a;flex-shrink:0;font-size:13px;font-weight:700}
#panel{padding:10px 12px;border-top:1px solid #eee;background:#fafaf8;display:flex;flex-direction:column;gap:8px}
#cur-name{font-size:12px;font-weight:600;color:#1a1a18;line-height:1.35;min-height:32px}
#instruction{font-size:11px;color:#666;line-height:1.4}
#coords-row{display:flex;gap:6px;align-items:center}
#coords-input{flex:1;padding:6px 8px;border:1px solid #ddd;border-radius:6px;font-family:monospace;font-size:11px;outline:none;background:#fff}
#coords-input:focus{border-color:#2563eb}
#coords-input.error{border-color:#dc2626;background:#fff5f5}
#coords-input.ok{border-color:#16a34a;background:#f0fdf4}
#btn-apply{padding:6px 10px;background:#1a1a18;color:#fff;border:none;border-radius:6px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0}
#btn-apply:hover{background:#333}
#coord-hint{font-size:10px;color:#999;line-height:1.3}
#coord-hint.error{color:#dc2626}
#btnDl{width:100%;padding:9px;background:#1a1a18;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;margin-top:2px}
#btnDl:hover{background:#333}
#map{flex:1;position:relative}
.leaflet-container{background:#e8e8e4}
#cur-label{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(26,26,24,.82);color:#fff;font-size:11px;padding:4px 10px;border-radius:5px;white-space:nowrap;pointer-events:none;z-index:1000;display:none;max-width:90%;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="topbar">
      <h1>a-map editor</h1>
      <input id="search" type="text" placeholder="Hledej ID nebo název…"/>
      <div id="stats">Načítám…</div>
    </div>
    <div id="list"></div>
    <div id="panel">
      <div id="cur-name">← Vyber stavbu ze seznamu</div>
      <div id="instruction" style="color:#aaa">Klikni na stavbu vlevo, pak na mapě na přesné místo.</div>
      <div id="coords-row">
        <input id="coords-input" type="text" placeholder="50.0637303N, 14.4215800E"/>
        <button id="btn-apply" onclick="applyCoords()">Použít</button>
      </div>
      <div id="coord-hint">Formát: 50.0637303N, 14.4215800E &nbsp;nebo&nbsp; 50.063730, 14.421580</div>
      <button id="btnDl" onclick="download()">⬇ Stáhnout a-map.json</button>
    </div>
  </div>
  <div id="map">
    <div id="cur-label"></div>
  </div>
</div>

const fixed = {};
let current = null;
let activeMarker = null;
let allMarkers = {};

const map = L.map('map',{center:[50.0760,14.4300],zoom:14});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
  attribution:'© OSM © CARTO',subdomains:'abcd',maxZoom:20
}).addTo(map);

// --- ikony ---
function makeIcon(state){
  // state: 'normal' | 'active' | 'done' | 'active-done'
  const colors = {
    normal:   {bg:'#fff',   border:'#1a1a18', r:5,  w:1.5},
    active:   {bg:'#dbeafe',border:'#2563eb', r:8,  w:2.5},
    done:     {bg:'#dcfce7',border:'#16a34a', r:5,  w:1.5},
    'active-done': {bg:'#bbf7d0',border:'#16a34a', r:8, w:2.5},
  };
  const c = colors[state] || colors.normal;
  return L.circleMarker([0,0],{radius:c.r,color:c.border,fillColor:c.bg,fillOpacity:1,weight:c.w});
}

// Zobraz všechny piny
DATA.forEach(item => {
  const m = L.circleMarker([item.lat,item.lng],{
    radius:5,color:'#1a1a18',fillColor:'#fff',fillOpacity:1,weight:1.5,
    pane:'overlayPane'
  }).addTo(map);
  m.bindTooltip(item.id+': '+item.name,{direction:'top',sticky:true});
  allMarkers[item.id] = m;
  m.on('click',e=>{L.DomEvent.stopPropagation(e); selectItem(item.id);});
});

function setMarkerStyle(id, state){
  const m = allMarkers[id];
  if(!m) return;
  const styles = {
    normal:       {radius:5, color:'#1a1a18', fillColor:'#fff',    fillOpacity:1, weight:1.5},
    active:       {radius:9, color:'#2563eb', fillColor:'#dbeafe', fillOpacity:1, weight:2.5},
    done:         {radius:5, color:'#16a34a', fillColor:'#dcfce7', fillOpacity:1, weight:1.5},
    'active-done':{radius:9, color:'#16a34a', fillColor:'#bbf7d0', fillOpacity:1, weight:2.5},
  };
  m.setStyle(styles[state] || styles.normal);
  if(state==='active'||state==='active-done') m.setRadius((styles[state]||styles.normal).radius);
}

function refreshMarker(id){
  const isDone = !!fixed[id];
  const isActive = id === current;
  const state = isActive ? (isDone?'active-done':'active') : (isDone?'done':'normal');
  setMarkerStyle(id, state);
  if(isActive) allMarkers[id]?.bringToFront();
}

// Klik na mapu = ulož souřadnice
map.on('click', e=>{
  if(!current) return;
  placePin(current, e.latlng.lat, e.latlng.lng);
});

function placePin(id, lat, lng){
  // Přesuň marker
  const m = allMarkers[id];
  if(m) m.setLatLng([lat,lng]);
  
  fixed[id] = {lat, lng};
  refreshMarker(id);
  updateItem(id);
  updateStats();
  updateCoordsInput(lat, lng);

  // Přejdi na další (jen při kliknutí na mapu, ne při manuálním zadání)
  const idx = DATA.findIndex(i=>i.id===id);
  if(idx+1 < DATA.length){
    const nextId = DATA[idx+1].id;
    selectItem(nextId, false); // false = neposouvej mapu na next
  }
}

function selectItem(id, flyTo=true){
  const prev = current;
  current = id;

  // Refresh starý a nový marker
  if(prev && prev!==id) refreshMarker(prev);
  refreshMarker(id);

  // Zvýrazni v seznamu
  document.querySelectorAll('.item').forEach(el=>el.classList.toggle('active', el.dataset.id===id));
  const el = document.querySelector('.item[data-id="'+id+'"]');
  if(el) el.scrollIntoView({block:'nearest',behavior:'smooth'});

  const item = DATA.find(i=>i.id===id);
  const pos = fixed[id] || item;

  if(flyTo) map.flyTo([pos.lat, pos.lng], Math.max(map.getZoom(),17), {duration:0.6});

  // Panel
  document.getElementById('cur-name').textContent = id+' — '+item.name;
  document.getElementById('instruction').textContent = fixed[id]
    ? '✓ Opraveno. Klikni znovu pro přesun, nebo zadej souřadnice ručně.'
    : 'Klikni na mapě na přesnou polohu budovy.';
  document.getElementById('instruction').style.color = fixed[id] ? '#16a34a' : '#666';

  // Coords input
  updateCoordsInput(pos.lat, pos.lng);

  // Label na mapě
  const lbl = document.getElementById('cur-label');
  lbl.style.display='block';
  lbl.textContent = id+': '+item.name;
}

function updateCoordsInput(lat, lng){
  const fmt = lat.toFixed(7)+'N, '+lng.toFixed(7)+'E';
  const inp = document.getElementById('coords-input');
  inp.value = fmt;
  inp.classList.remove('error','ok');
  document.getElementById('coord-hint').textContent = 'Formát: 50.0637303N, 14.4215800E  nebo  50.063730, 14.421580';
  document.getElementById('coord-hint').classList.remove('error');
}

function parseCoords(str){
  str = str.trim();
  // Formát: 50.0637303N, 14.4215800E  (s nebo bez mezer, čárka nebo středník)
  let m = str.match(/(-?\d+\.\d+)\s*N?\s*[,;]\s*(-?\d+\.\d+)\s*E?/i);
  if(m){
    const lat = parseFloat(m[1]);
    const lng = parseFloat(m[2]);
    if(lat>49 && lat<51 && lng>14 && lng<15) return {lat,lng};
  }
  // Formát s N/S/E/W na začátku nebo konci
  m = str.match(/(-?\d+\.?\d*)°?\s*([NS]?)\s*[,;\s]+(-?\d+\.?\d*)°?\s*([EW]?)/i);
  if(m){
    let lat = parseFloat(m[1]);
    let lng = parseFloat(m[3]);
    if(m[2].toUpperCase()==='S') lat=-lat;
    if(m[4].toUpperCase()==='W') lng=-lng;
    if(lat>49 && lat<51 && lng>14 && lng<15) return {lat,lng};
  }
  return null;
}

function applyCoords(){
  if(!current){
    alert('Nejprve vyber stavbu ze seznamu.');
    return;
  }
  const inp = document.getElementById('coords-input');
  const hint = document.getElementById('coord-hint');
  const parsed = parseCoords(inp.value);
  if(!parsed){
    inp.classList.add('error');
    inp.classList.remove('ok');
    hint.textContent = '⚠ Nepodařilo se rozpoznat souřadnice. Zkus formát: 50.0637303N, 14.4215800E';
    hint.classList.add('error');
    return;
  }
  inp.classList.remove('error');
  inp.classList.add('ok');
  hint.textContent = '✓ Souřadnice aplikovány.';
  hint.classList.remove('error');

  const m = allMarkers[current];
  if(m) m.setLatLng([parsed.lat, parsed.lng]);
  fixed[current] = {lat:parsed.lat, lng:parsed.lng};
  refreshMarker(current);
  updateItem(current);
  updateStats();
  map.setView([parsed.lat, parsed.lng], Math.max(map.getZoom(),17));
}

// Enter v coords inputu = apply
document.getElementById('coords-input').addEventListener('keydown', e=>{
  if(e.key==='Enter') applyCoords();
});

function updateItem(id){
  const el = document.querySelector('.item[data-id="'+id+'"]');
  if(!el) return;
  el.classList.toggle('done', !!fixed[id]);
  const chk = el.querySelector('.item-check');
  chk.textContent = fixed[id] ? '✓' : '';
}

function updateStats(){
  const n = Object.keys(fixed).length;
  document.getElementById('stats').textContent = n+' / '+DATA.length+' opraveno';
}

function renderList(filter=''){
  const fl = filter.toLowerCase();
  const html = DATA
    .filter(i=>!fl || i.name.toLowerCase().includes(fl) || i.id.toLowerCase().includes(fl))
    .map(i=>`<div class="item${fixed[i.id]?' done':''}${i.id===current?' active':''}" data-id="${i.id}" onclick="selectItem('${i.id}')">
      <span class="item-code">${i.id}</span>
      <span class="item-name">${i.name}</span>
      <span class="item-check">${fixed[i.id]?'✓':''}</span>
    </div>`).join('');
  document.getElementById('list').innerHTML = html || '<div style="padding:16px;color:#aaa;text-align:center">Nic nenalezeno</div>';
}

document.getElementById('search').addEventListener('input', e=>{
  renderList(e.target.value);
  updateStats();
});

renderList();
updateStats();

function download(){
  const out = DATA.map(item=>{
    const f = fixed[item.id];
    return f ? {...item, lat: Math.round(f.lat*1e7)/1e7, lng: Math.round(f.lng*1e7)/1e7} : item;
  });
  const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'a-map.json';
  a.click();
}
</script>
</body>
</html>

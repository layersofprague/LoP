<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="color-scheme" content="light"/>
<script src="theme.js"></script>
<meta name="theme-color" content="#1a1a18"/>
<title>Sbírka razítek — LayersOfPrague</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:    #F8F8F6;
  --paper-2:  #F0F0EE;
  --paper-3:  #E8E8E6;
  --ink:      #111111;
  --ink-2:    #333331;
  --ink-3:    #666662;
  --ink-4:    #999994;
  --ink-5:    #BABAB6;
  --rule:     #E8E8E6;
  --rule-2:   #E0E0DE;
  --accent:   #B04020;
  --ok:       #3d7a4a;
  --cat-hist: #4A4A48;
  --cat-arch: #3B5F84;
  --cat-fun:  #E0A020;
  --ease:     cubic-bezier(.22,.8,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; min-height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ── PAGE ── */
.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 10px 100px;
}

/* ── HERO ── */
.hero-section { margin-bottom: 10px; }
.hero-top {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  margin-bottom: 12px;
}
.kick {
  font-family: 'Inter', sans-serif;
  font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--ink-5); margin-bottom: 12px; font-weight: 500;
}
.page-title {
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: clamp(24px, 6vw, 36px);
  line-height: 1; letter-spacing: -.03em;
  color: var(--ink); white-space: nowrap;
}
.page-title em { font-style: italic; font-weight: 300; color: #777772; }
.page-intro {
  font-size: 14px; color: var(--ink-4);
  line-height: 1.6; text-wrap: pretty;
  margin-bottom: 14px;
}

/* ── HERO META ── */
.hero-meta {
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 6px;
  display: table;
  border-spacing: 3px 2px;
}
.hero-meta tr td {
  padding: 0;
  line-height: 1;
  vertical-align: bottom;
}
/* Řádek 1 — razítka: černá, tučná */
.hero-meta tr:first-child td:first-child {
  text-align: right;
  font-family: 'Inter', sans-serif;
  font-size: 16px; font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
}
.hero-meta tr:first-child td:first-child .hero-total {
  font-size: 11px; font-weight: 700;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
}
.hero-meta tr:first-child td:first-child .hero-slash {
  font-size: 11px; font-weight: 700;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
}
.hero-meta tr:first-child td:last-child {
  text-align: left;
  font-family: 'Inter', sans-serif;
  font-size: 11px; font-weight: 300;
  font-style: italic;
  letter-spacing: 0;
  color: var(--ink);
  white-space: nowrap;
  padding-left: 5px;
}
/* Řádek 2 — body: šedá, netučná */
.hero-meta tr:last-child td:first-child {
  text-align: right;
  font-family: 'Inter', sans-serif;
  font-size: 12px; font-weight: 400;
  color: var(--ink-4);
  white-space: nowrap;
}
.hero-meta tr:last-child td:last-child {
  text-align: left;
  font-family: 'Inter', sans-serif;
  font-size: 11px; font-weight: 300;
  font-style: italic;
  letter-spacing: 0;
  color: var(--ink-4);
  white-space: nowrap;
  padding-left: 5px;
}

/* ── SEKCE KICKER ── */
.section-kicker {
  font-family: 'Inter', sans-serif;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink-5);
  margin-bottom: 10px; font-weight: 500;
}

/* ── FLAT SECTION (layout 4b) ── */
.flat-section {
  margin-bottom: 10px;
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
}
.flat-section-btn {
  width: 100%;
  background: transparent; border: none; cursor: pointer;
  padding: 8px 15px 6px; font-family: inherit; text-align: left;
  display: block;
}
.flat-section-header {
  display: flex; align-items: center; gap: 9px;
  font-family: 'Inter', sans-serif;
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-5); font-weight: 500;
  padding-bottom: 8px;
}
.flat-section-dot {
  width: 8px; height: 8px; border-radius: 50%;
  flex-shrink: 0;
}
.flat-section-dot.district { border-radius: 2px; }
.flat-section-name { flex: 1; }
.flat-section-count { color: var(--ink-4); }
.flat-section-chev {
  display: flex; color: var(--ink-3);
  transition: transform .25s var(--ease);
}
.flat-section-chev.open { transform: rotate(180deg); }

.flat-section-progress {
  height: 2px; background: var(--rule);
  position: relative; margin-bottom: 0; margin: 0 -0px;
}
.flat-section-progress-fill {
  position: absolute; left: 0; top: 0; height: 100%;
  transition: width .4s var(--ease);
}

/* ── RAZÍTKA GRID ── */
.stamps-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  column-gap: 10px;
  row-gap: 24px;
  margin-top: 8px;
}
@media (min-width: 480px) {
  .stamps-grid { grid-template-columns: repeat(4, 1fr); }
}
@media (min-width: 680px) {
  .stamps-grid { grid-template-columns: repeat(5, 1fr); }
}
.stamp-cell {
  aspect-ratio: 1;
  cursor: pointer;
  border-radius: 6px;
  overflow: visible;
  transition: transform .15s var(--ease);
  position: relative;
}
.stamp-cell:hover { transform: scale(1.05); }
.stamp-cell.empty { cursor: pointer; }
.stamp-cell.empty:hover { transform: scale(1.03); opacity: .75; }

/* ── ODZNAK TIP ── */
.badge-tip {
  margin-top: 12px;
  padding: 4px 10px;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: 6px;
  display: flex; align-items: center; gap: 8px;
  font-family: 'Inter', sans-serif; font-size: 12px; color: var(--ink-4); line-height: 1.4;
}
.badge-tip-icon {
  width: 18px; height: 18px; flex-shrink: 0;
  border-radius: 50%;
  border: 1px solid var(--rule-2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; font-style: italic; font-weight: 400;
  color: var(--ink-4); font-size: 12px; line-height: 1;
}

/* ── FLAT SECTION BODY ── */
.flat-section-body {
  overflow: hidden;
  max-height: 0;
  transition: max-height .38s var(--ease), opacity .25s;
  opacity: 0;
}
.flat-section-body.open {
  max-height: 2400px;
  opacity: 1;
  padding: 0 15px 14px;
  background: #fff;
}

/* ── AUTH CTA (nepřihlášen) ── */
.auth-cta {
  margin-top: 28px;
  padding: 22px 20px;
  background: var(--paper-2);
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  text-align: center;
}
.auth-cta-title {
  font-family: 'Inter', sans-serif;
  font-size: 18px; font-weight: 600; letter-spacing: -.02em;
  margin-bottom: 6px;
}
.auth-cta-sub {
  font-size: 13.5px; color: var(--ink-3);
  line-height: 1.5; margin-bottom: 14px;
}
.auth-cta-btn {
  display: inline-block;
  padding: 9px 22px;
  background: var(--ink); color: #fff;
  border-radius: 8px;
  font-size: 13px; font-weight: 600;
  cursor: pointer; border: none;
  font-family: inherit;
  transition: opacity .15s;
}
.auth-cta-btn:hover { opacity: .8; }

/* ── LOADING ── */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 48px; color: var(--ink-5);
  font-family: 'Inter', sans-serif;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
}

/* ── Landscape mobil — navbar vpravo ── */
@media (max-width: 600px) {
  .page { padding-top: 16px; }
  .page-intro { font-size: 13px; line-height: 1.5; }
  .hero-section { margin-bottom: 6px; }
  .hero-top { margin-bottom: 12px; }
}
@media (max-width: 819px) and (orientation: landscape) {
  #lop-nav {
    position: fixed !important;
    top: 0 !important; bottom: 0 !important;
    right: 0 !important; left: auto !important;
    width: 64px !important; height: auto !important;
    flex-direction: column !important;
    border-top: none !important;
    border-left: 1px solid var(--rule) !important;
    padding: 8px 0 14px !important;
    padding-top: var(--header-h, 52px) !important;
    justify-content: flex-start !important;
    gap: 0 !important;
  }
  #lop-nav .nav-item {
    flex: 0 0 auto !important;
    padding: 10px 4px !important;
  }
  #lop-nav .nav-item .nav-lbl { font-size: 9px !important; }
  #lop-nav .nav-item.active::before {
    top: 50% !important; left: -1px !important;
    transform: translateY(-50%) !important;
    width: 2px !important; height: 20px !important;
    bottom: auto !important;
  }
  body { padding-right: 0 !important; padding-bottom: 0 !important; }
  .page { padding-top: 16px; padding-left: 10px !important; padding-right: 74px !important; }
  .page-title { font-size: clamp(24px, 4vw, 30px); }
  .page-intro { font-size: 13px; line-height: 1.5; }
  .hero-section { margin-bottom: 6px; }
  .hero-top { margin-bottom: 12px; }
}
</style>

<div id="lop-header"></div>

<script src="header.js?v=2"></script>

<div class="page" id="page">
  <div class="loading" id="loadingEl">Načítám sbírku…</div>
</div>

<div id="lop-nav"></div>
<script src="nav.js?v=2"></script>


<!-- Supabase + stamps -->
<script src="castle-data.js"></script>
<script src="stamp.js?v=2"></script>

<script>
/* ═══════════════════════════════════════════════════════
   collections.html — Sbírka razítek (layout 4b ploché sekce)
   ═══════════════════════════════════════════════════════ */

/* Titulek a hláška o načítání — v HTML zůstává český text jako záloha
   (konvence #9), tady se přepíše podle zvoleného jazyka. */
document.title = t('collection.page_title');
(function () {
  const el = document.getElementById('loadingEl');
  if (el) el.textContent = t('collection.loading');
})();

const SUPA_URL = 'https://lomtaoctzetpweuepesp.supabase.co';
const SUPA_KEY = 'sb_publishable_uAQBxCOYWpc_PrEc78fFzw_kbeH4xj5';
// VISIT_KEY a WISH_KEY — data jdou přímo ze Supabase (_dbVisited, _dbWished)

const CAT_COLOR = { hist: '#4A4A48', arch: '#3B5F84', art: '#C0522A', fun: '#E0A020' };
/* Popisky jdou z translations.json (konvence: struktura v kódu, texty v překladech),
   proto se čtou funkcemi, ne z natvrdo zapsaných objektů — jinak by stránka
   zůstala česky i v anglické verzi. */
const catName  = cat => t('cat.' + cat);
const catBadge = cat => t('badge.' + cat);
const catTip   = cat => ({
  title:    t('tip.' + cat + '.title'),
  progress: t('tip.' + cat + '.progress'),
  complete: t('tip.' + cat + '.complete'),
});

const CAT_PREFIX = { hist: 'H', arch: 'A', art: 'U', fun: 'Z' };

/* Kurátorské tituly čtvrtí. Klíčem je SLUG (`holesovice`), ne český název —
   `district` v datech je slug, takže vyhledávání podle názvu vždycky selhalo
   a místo titulu se zobrazoval surový slug. */
function districtCurator(slug) {
  const titleKey = 'curator.' + slug + '.title';
  if (!window.lopHasKey || !window.lopHasKey(titleKey)) return null;
  return { title: t(titleKey), desc: t('curator.' + slug + '.desc') };
}

function getSession() {
  try { return JSON.parse(localStorage.getItem('lop_auth_session') || 'null'); } catch(e) { return null; }
}
function isLoggedIn() {
  try { const s = getSession(); return !!(s && s.access_token && s.user); } catch(e) { return false; }
}
async function getValidSession() {
  const s = getSession();
  if (!s?.access_token || !s?.user) return null;
  const nowSec = Math.floor(Date.now() / 1000);
  if ((s.expires_at || 0) > nowSec + 60) return s;
  if (!s.refresh_token) return null;
  try {
    const r = await fetch(SUPA_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if (!r.ok) { localStorage.removeItem('lop_auth_session'); return null; }
    const data = await r.json();
    localStorage.setItem('lop_auth_session', JSON.stringify({ ...data, user: data.user || s.user }));
    return data;
  } catch(e) { return null; }
}
function authHeaders() {
  const s = getSession();
  return { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + (s?.access_token || SUPA_KEY),
    'Content-Type': 'application/json' };
}
function getVisited() {
  return Object.keys(_dbVisited);
}

/* ── Data míst ── */
let PLACES = [];
async function loadPlaces() {
  try {
    const r = await fetch('places-index.json?v=' + (window.lopDataVer||''));
    PLACES = await r.json();
  } catch(e) { PLACES = []; }
}

/* ── Supabase sync — jediný zdroj pravdy ── */
// visited: { place_id → { score, visited_at } }
// wished:  Set of place_ids
let _dbVisited = {};  // výsledky ze Supabase
let _dbWished  = new Set();
let _dbLoaded  = false;

async function syncFromDB() {
  const s = await getValidSession();
  if (!s?.access_token || !s?.user) {
    _dbLoaded = true;
    return;
  }
  try {
    const [vRes, wRes] = await Promise.all([
      fetch(SUPA_URL + '/rest/v1/visited?user_id=eq.' + s.user.id + '&select=place_id,score,visited_at', { headers: authHeaders() }),
      fetch(SUPA_URL + '/rest/v1/wishlist?user_id=eq.' + s.user.id + '&select=place_id', { headers: authHeaders() }),
    ]);
    if (!vRes.ok) throw new Error('visited HTTP ' + vRes.status);
    const rows = await vRes.json();
    _dbVisited = {};
    rows.forEach(r => {
      _dbVisited[String(r.place_id)] = { score: r.score, visited_at: r.visited_at };
    });
    if (wRes.ok) {
      const wRows = await wRes.json();
      _dbWished = new Set(wRows.map(r => String(r.place_id)));
    }
    _dbLoaded = true;
  } catch(e) {
    throw e;  // propaguj chybu výš
  }
}

function getScores() {
  // Pouze ze Supabase dat
  const out = {};
  Object.entries(_dbVisited).forEach(([id, v]) => {
    out[id] = { score: v.score, date: v.visited_at };
  });
  return out;
}

/* ── Plurál ── */
function plural(n) {
  return lopPlural(n, t('collection.stamp_one'), t('collection.stamp_few'), t('collection.stamp_many'));
}

/* ── Formát data z ISO ── */
function fmtDate(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    return d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear();
  } catch(e) { return ''; }
}

/* ── Sestavení sekce ── */
function buildSectionData(places, visited, scores) {
  const cats = ['hist', 'arch', 'fun'];
  const sections = [];

  // Kategorie
  cats.forEach(cat => {
    const allOfCat = places.filter(p => p.cat === cat);
    const items = allOfCat.map(p => {
      const id = String(p.id);
      const isVis = visited.includes(id);
      const sc = scores[id];
      return {
        code: id,
        name: isVis ? locName(p.name) : null,
        year: p.yearBuilt || p.year,
        cat: cat,
        score: sc ? sc.score : (isVis ? 100 : undefined),
        dateLabel: sc ? fmtDate(sc.date) : undefined,
        id: id,
        empty: !isVis,
      };
    });
    sections.push({
      kind: 'cat',
      key: cat,                 // stabilní klíč (nezávislý na jazyce) pro openState
      name: catName(cat),
      color: CAT_COLOR[cat],
      cat: cat,
      badge: catBadge(cat),
      items: items,
    });
  });

  // Čtvrti — dynamicky z dat places
  const districts = [...new Set(places.map(p => p.district).filter(Boolean))];
  districts.forEach(district => {
    const allInDist = places.filter(p => p.district === district);
    const items = allInDist.map(p => {
      const id = String(p.id);
      const isVis = visited.includes(id);
      const sc = scores[id];
      return {
        code: id,
        name: isVis ? locName(p.name) : null,
        year: p.yearBuilt || p.year,
        cat: p.cat,
        score: sc ? sc.score : (isVis ? 100 : undefined),
        dateLabel: sc ? fmtDate(sc.date) : undefined,
        id: id,
        empty: !isVis,
      };
    });
    const cur = districtCurator(district);
    const distLabel = (window.LOP_TAGS && LOP_TAGS.districtLabel)
      ? LOP_TAGS.districtLabel(district) : district;
    sections.push({
      kind: 'district',
      key: district,            // slug — stabilní klíč pro openState
      name: distLabel,
      color: '#b04020',
      cat: 'hist',
      badge: cur ? cur.title : t('collection.curator_generic', { d: distLabel }),
      items: items,
    });
  });

  return sections;
}

/* ── Render ── */
const sealProps = { orientation: 'sealF', style: 'rough', castle: 'ink', eccentric: true };

// Převod AR score (0–100) na stamp quality level (1–5)
// 0 (pouze návštěva)  → 1 (nejhorší otisk)
// 1–25               → 2
// 26–50              → 3
// 51–75              → 4
// 76–100             → 5 (nejostřejší)
function arScoreToStampScore(arScore) {
  if (arScore == null || arScore === 0) return 1;   // level 1 = score 1–20
  if (arScore <= 25) return 25;                      // level 2 = score 21–40
  if (arScore <= 50) return 45;                      // level 3 = score 41–60
  if (arScore <= 75) return 65;                      // level 4 = score 61–80
  return 90;                                         // level 5 = score 81–100
}
let openState = {};

function initOpenState(sections) {
  // Pokus o načtení z localStorage
  try {
    const saved = JSON.parse(localStorage.getItem('lop_collections_open') || 'null');
    if (saved && typeof saved === 'object') { openState = saved; return; }
  } catch(e) {}
  // Výchozí: vše rozbalené
  sections.forEach(s => { if (!(s.name in openState)) openState[s.name] = true; });
}

function persistOpenState() {
  try { localStorage.setItem('lop_collections_open', JSON.stringify(openState)); } catch(e) {}
}

function renderStamp(item) {
  if (item.empty || !item.name) {
    return window.stampSVG ? stampSVG({ code: item.code, cat: item.cat, empty: true }) : '';
  }
  return window.stampSVG ? stampSVG({
    ...sealProps,
    code: item.code,
    name: item.name,
    year: item.year,
    cat: item.cat,
    score: arScoreToStampScore(item.score),
    dateLabel: item.dateLabel || '',
    k: item.code,
  }) : '';
}

/* Lokalizované jméno. Pozor: `name` je u nenavštívených záznamů záměrně null
   a `typeof null === 'object'`, proto se nejdřív testuje pravdivost. */
function locName(v) {
  if (!v) return v;                       // null / '' projde beze změny
  if (typeof v === 'object') return v[window.lopLang] || v.cs || '';
  return v;
}

function renderSection(sec, idx) {
  const got = sec.items.filter(p => locName(p.name));
  const empties = sec.items.filter(p => !locName(p.name) || p.empty);
  const total = sec.items.length;
  const pct = total > 0 ? Math.round(got.length / total * 100) : 0;
  const isOpen = !!openState[sec.key || sec.name];
  const isDistrict = sec.kind === 'district';

  let gridHTML = '';
  if (isOpen) {
    const allItems = [...got, ...empties];
    gridHTML = allItems.map(item => {
      const svgStr = renderStamp(item);
      const clickAttr = `onclick="location.href='place/${item.id}.html'"`;
      return `<div class="stamp-cell${item.empty ? ' empty' : ''}" ${clickAttr}>${svgStr}</div>`;
    }).join('');
  }

  const badgeInitial = sec.badge ? sec.badge[0].toUpperCase() : '?';

  return `<div class="flat-section" id="sec-${idx}">
    <button class="flat-section-btn" onclick="toggleSection(${idx}, '${String(sec.key || sec.name).replace(/'/g, "\\'")}')">
      <div class="flat-section-header">
        <span class="flat-section-dot${isDistrict ? ' district' : ''}" style="background:${sec.color}"></span>
        <span class="flat-section-name">${sec.name}</span>
        <span class="flat-section-count"><b>${got.length}</b> / ${total}</span>
        <span class="flat-section-chev${isOpen ? ' open' : ''}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </div>
      <div class="flat-section-progress">
        <div class="flat-section-progress-fill" style="width:${pct}%;background:${sec.color}"></div>
      </div>
    </button>
    <div class="flat-section-body${isOpen ? ' open' : ''}" id="secbody-${idx}">
      <div class="stamps-grid">${gridHTML}</div>
      <div style="height:10px"></div>
      ${(function(){
        /* Pozor: dřív se tady psalo `const t = CAT_TIP[...]`, což zastínilo
           globální překladovou funkci t() — proto se proměnná jmenuje `ct`. */
        const ct = isDistrict ? districtCurator(sec.key) : catTip(sec.cat);
        if (!ct) return '';
        const icon = '<div class="badge-tip-icon">i</div>';
        const titleTxt = ct.title || sec.badge;
        const title = '<b>' + titleTxt + '</b>';
        let txt;
        if (empties.length > 0) {
          const x = '<b>' + empties.length + ' ' + plural(empties.length) + '</b>';
          txt = isDistrict
            ? t('collection.progress_district', { x: x, title: title })
            : ct.progress.replace('{x}', x).replace(titleTxt, title);
        } else {
          const descHtml = ct.desc
            ? '<br><i style="color:var(--ink-4);font-size:11px;">' + ct.desc + '</i>' : '';
          txt = isDistrict
            ? t('collection.complete_district', { title: title }) + descHtml
            : ct.complete.replace(titleTxt, title);
        }
        return '<div class="badge-tip">' + icon + '<div>' + txt + '</div></div>';
      })()} 
    </div>
  </div>`;
}

function toggleSection(idx, name) {
  openState[name] = !openState[name];
  // Re-render jen tuto sekci
  const el = document.getElementById('sec-' + idx);
  if (!el) return;
  const _sections = el.closest('#sections-wrap')?._sections;
  if (_sections) {
    el.outerHTML = renderSection(_sections[idx], idx);
    // Po re-renderu je třeba znovu připojit _sections referenci
    const newEl = document.getElementById('sec-' + idx);
    if (newEl) newEl._sIdx = idx;
  } else {
    // Fallback: full re-render
    renderAll();
  }
}

let _allSections = [];

function renderAll() {
  try {
  const visited = getVisited();
  const scores = getScores();

  // Stavíme sekce
  const sections = buildSectionData(PLACES, visited, scores);
  _allSections = sections;
  initOpenState(sections);

  // Stats
  const totalPlaces = PLACES.length;
  const visitedCount = visited.filter(id => PLACES.some(p => String(p.id) === id)).length;
  const scoreEntries = Object.values(getScores());
  const scoreVals = scoreEntries.map(s => s.score).filter(Number.isFinite);
  const totalPoints = scoreEntries.reduce((sum, s) => {
    // Vždy počítej z score, nikdy ne z uloženého points (může být zastaralé)
    const pts = Number.isFinite(s.score) ? Math.round((100 + s.score) * 10) / 10 : 100.0;
    return sum + pts;
  }, 0);

  const catSections = sections.filter(s => s.kind === 'cat');
  const distSections = sections.filter(s => s.kind === 'district');

  let html = `
  <div class="hero-section">
    <div class="hero-top">
      <h1 class="page-title">${t('collection.h1')}</h1>
      <table class="hero-meta" style="align-self:flex-end;margin-top:0;margin-bottom:2px">
        <tr>
          <td><span id="statCount">—</span><span class="hero-slash">/</span><span class="hero-total" id="statTotal">—</span></td>
          <td>${t('collection.stamps_label')}</td>
        </tr>
        <tr>
          <td id="statPoints">—</td>
          <td>${t('collection.points')}</td>
        </tr>
      </table>
    </div>
    <p class="page-intro">${t('collection.intro')}</p>
  </div>

  <div id="sections-wrap">
    <div class="section-kicker">${t('collection.kicker_cats')}</div>
    ${catSections.map((s, i) => renderSection(s, i)).join('')}
    ${distSections.length ? `<div class="section-kicker" style="margin-top:22px">${t('collection.kicker_districts')}</div>
    ${distSections.map((s, i) => renderSection(s, catSections.length + i)).join('')}` : ''}
  </div>

  ${!isLoggedIn() ? `<div class="auth-cta">
    <div class="auth-cta-title">${t('collection.cta_title')}</div>
    <p class="auth-cta-sub">${t('collection.login_cta')}</p>
    <button class="auth-cta-btn" onclick="window.lopAuth ? window.lopAuth.open() : location.href='login.html'">${t('collection.cta_btn')}</button>
  </div>` : `<div style="text-align:center;padding:18px 10px 28px;">
    <p style="font-size:12px;color:var(--ink-4);line-height:1.5;">${t('collection.footer_a')} <b style="font-size:15px;color:var(--ink);font-weight:700;">${t('collection.footer_b')}</b></p>
    <p style="font-size:11px;color:var(--ink-5);font-style:italic;margin-top:6px;">${t('collection.footer_sub')}</p>
  </div>`}`;

  const page = document.getElementById('page');
  page.innerHTML = html;

  // Připoj reference sekcí na wrap aby toggleSection fungoval bez full re-renderu
  const wrap = document.getElementById('sections-wrap');
  if (wrap) wrap._sections = sections;
  // Aktualizuj hero meta
  const elCount  = document.getElementById('statCount');
  const elTotal  = document.getElementById('statTotal');
  const elPoints = document.getElementById('statPoints');
  if (elCount)  elCount.textContent  = visitedCount;
  if (elTotal)  elTotal.textContent  = totalPlaces;
  // Body jsou v praxi celá čísla — ".0" na konci vypadalo jako chyba.
  if (elPoints) elPoints.textContent = Number.isInteger(totalPoints)
    ? String(totalPoints) : totalPoints.toFixed(1);
  // Připoj _sections na všechny sec-N prvky
  sections.forEach((s, i) => {
    const el = document.getElementById('sec-' + i);
    if (el) { el._sIdx = i; }
  });
  } catch(err) {
    const page = document.getElementById('page');
    if (page) page.innerHTML = `<div style="padding:40px 20px;font-family:monospace;font-size:13px;color:#b04020;white-space:pre-wrap">${t('collection.err_load')}: ${err.message}</div>`;
    console.error('renderAll error:', err);
  }
}

// Globální toggle — musí být přístupný z onclick
window.toggleSection = function(idx, name) {
  openState[name] = !openState[name];
  persistOpenState();
  renderAll();
};

/* ── Init ── */
async function init() {
  const page = document.getElementById('page');
  try {
    await loadPlaces();
    if (isLoggedIn()) {
      await syncFromDB();
    } else {
      _dbLoaded = true;
    }
    renderAll();
    if (window.lopNav) window.lopNav.refresh();
  } catch(e) {
    if (page) {
      const errDiv = document.createElement('div');
      errDiv.style.cssText = 'padding:48px 20px;text-align:center;font-family:Inter,sans-serif';
      const h = document.createElement('div');
      h.style.cssText = 'font-size:22px;margin-bottom:8px';
      h.textContent = t('collection.err_load');
      const msg = document.createElement('div');
      msg.style.cssText = 'color:#6a6a64;font-size:14px;margin-bottom:16px';
      msg.textContent = e.message || t('collection.err_server');
      const btn = document.createElement('button');
      btn.style.cssText = 'padding:9px 22px;background:#1a1a18;color:#eeefeb;border:none;border-radius:100px;font-size:13px;cursor:pointer';
      btn.textContent = t('collection.btn_retry');
      btn.onclick = init;
      errDiv.appendChild(h); errDiv.appendChild(msg); errDiv.appendChild(btn);
      page.innerHTML = ''; page.appendChild(errDiv);
    }
  }
}
init();
</script>

<script src="auth-modal.js"></script>
<script>
window.lopAuth.onLogin(() => {
  init();
  if (window.lopHeader) window.lopHeader.refresh();
  if (window.lopNav)    window.lopNav.refresh();
});
window.lopAuth.onLogout(() => {
  renderAll();
  if (window.lopNav) window.lopNav.refresh();
});
</script>
</body>
</html>

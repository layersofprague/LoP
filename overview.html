/* Pole v places-index.json jsou lokalizované objekty { cs, en, … }.
   Chybí-li aktivní jazyk, spadne se na češtinu. */
function locStr(obj, field) {
  const v = obj[field];
  if (v && typeof v === 'object' && !Array.isArray(v))
    return v[window.lopLang] || v.cs || '';
  if (window.lopLang === 'en' && obj[field + '_en']) return obj[field + '_en'];   // starý zápis
  return v || '';
}

function render() {
  const visited=getVisited(), wished=getWished();
  const eraActive=ERA_STATE.from>ERA_START||ERA_STATE.to<ERA_END;
  const distActive=DIST_STATE.max!==null&&userPos;

  const filtered=PLACES.filter(p=>{
    const wish=wished.includes(String(p.id)), vis=visited.includes(String(p.id));

    /* 1. SKRÝT má přednost před vším ostatním. */
    if(FILTER.visited==='hide' && vis)  return false;
    if(FILTER.wished ==='hide' && wish) return false;

    /* 2. Výběr: kategorie, plán a navštíveno jsou rovnocenné položky
       jedné množiny. Nic nevybráno = bez omezení, jinak SJEDNOCENÍ —
       "jen plán" i "historie a k tomu plán" vyjdou z téhož pravidla. */
    const selecting = CAT_FILTER.size || FILTER.wished==='add' || FILTER.visited==='add';
    if(selecting){
      const inSel = CAT_FILTER.has(p.cat)
                 || (FILTER.wished ==='add' && wish)
                 || (FILTER.visited==='add' && vis);
      if(!inSel) return false;
    }
    if(eraActive){
      const y=locYear(p);
      if(y==null){ if(!UNDATED.include) return false; }
      else if(y<ERA_STATE.from||y>ERA_STATE.to) return false;
    }
    if(distActive){ if(haversineKm([userPos[0],userPos[1]],[p.lat,p.lng])>DIST_STATE.max) return false; }
    if(!taxMatches(p)) return false;
    if(STYLE_FILTER.size){
      const st = Array.isArray(p.style) ? p.style : p.style ? [p.style] : [];
      if(!st.some(s => STYLE_FILTER.has(s))) return false;
    }
    return true;
  });

  /* kolik míst prošlo jen díky tomu, že nemají dataci */
  const undatedCount = eraActive ? filtered.filter(p => locYear(p) == null).length : 0;
  renderTaxBanner(filtered.length, undatedCount);
  _lastCount = filtered.length; updateApplyBtn(filtered.length);

  if(filtered.length===0 && !(_devForceOnly && _devLoaded)){
    /* Které filtry to způsobily, ukazuje banner hned nad seznamem —
       nemá smysl je vypisovat podruhé. Stačí na něj odkázat. */
    const anyFilter = activeFilters(undatedCount).length > 0;
    const msg = anyFilter ? t('overview.empty_filtered') : t('overview.empty');
    const sub = anyFilter ? t('overview.empty_hint')     : t('overview.empty_sub');
    document.getElementById('placesList').innerHTML=`<div class="empty"><h3>${msg}</h3><p>${sub}</p></div>`;
    return;
  }

  let html='';
  if (!_devForceOnly) {
    ['hist','arch','art'].forEach(cat=>{
      const items=filtered.filter(p=>p.cat===cat); if(!items.length) return;
      html += `<div class="section-label section-${cat}"><span class="sn">${CAT_NAME[cat]}</span><div class="sl"></div><span class="ct">${items.length}</span></div>`;
      html += `<div class="place-section-list">`;
      html += items.map(p=>cardHTML(p,visited,wished)).join('');
      html += `</div>`;
    });
  }
  html += devSectionHTML();

  const list=document.getElementById('placesList');
  list.innerHTML=html;
  list.classList.toggle('grid-mode', viewMode==='grid');
  const _cnt=document.getElementById('filterHeadActive'); if(_cnt) _cnt.textContent=filtered.length;
  const _tot=document.getElementById('filterHeadTotal'); if(_tot) _tot.textContent='/'+PLACES.length;
  const _fbtn=document.getElementById('filterBtn');
  if(_fbtn) _fbtn.classList.toggle('has-filter', filtered.length < PLACES.length);
  const _mA=document.getElementById('fmCntActive'); if(_mA) _mA.textContent=filtered.length;
  const _mT=document.getElementById('fmCntTotal');  if(_mT) _mT.textContent='/'+PLACES.length;
  if (_devLoaded) loadDevPreviews();

  updateChipCounts();
}

/* ═══════════════ PRACOVNÍ VRSTVA (places-development.json) ═══════════════
   Načítá se ve výchozím stavu úplně pro každého (viz volání loadDevPlaces()
   za loadPlaces().then(...) dole) — karty se zobrazí jako "Coming soon",
   klikatelné na coming-soon.html (detail stránku nemají). Admin panel ve
   filtru zůstává admin-only a umožňuje ji odebrat, nebo naopak vynutit
   zobrazení jen jí (force-only) — to je jediné, co je omezené na admina. */
async function loadDevPlaces() {
  if (_devLoaded) { DEV_PLACES = []; _devLoaded = false; updateDevRowUI(); render(); return; }
  try {
    const res = await fetch('places-development.json');
    if (!res.ok) return;
    const data = await res.json();
    DEV_PLACES = data.map(item => ({ ...item, cat: _devCat(item) }));
    _devLoaded = true;
    updateDevRowUI();
    render();
  } catch (e) { console.warn('places-development.json load error:', e); }
}
function toggleDevForceOnly() {
  _devForceOnly = !_devForceOnly;
  updateDevRowUI();
  render();
}
function updateDevRowUI() {
  const loadBtn  = document.getElementById('devLoadBtn');
  const forceChk = document.getElementById('devForceOnly');
  if (loadBtn) loadBtn.textContent = t(_devLoaded ? 'admin.dev_unload' : 'admin.dev_load');
  if (forceChk) forceChk.checked = _devForceOnly;
}
function updateDevRowVisibility() {
  const row = document.getElementById('devRow');
  if (row) row.hidden = !isAdmin();
}
function devSectionHTML() {
  if (!_devLoaded || !DEV_PLACES.length) return '';
  let html = '';
  ['hist', 'arch', 'art'].forEach(cat => {
    const items = DEV_PLACES.filter(p => p.cat === cat);
    if (!items.length) return;
    html += `<div class="section-label section-${cat}"><span class="sn">${CAT_NAME[cat]}</span><div class="sl"></div><span class="ct">${items.length}</span></div>`;
    html += `<div class="place-section-list">`;
    html += items.map(devCardHTML).join('');
    html += `</div>`;
  });
  return html;
}
/* Sjednoceno s cardHTML() — stejná kostra (obrázek, cat pill, jméno,
   krátký text), jen patička/proklik jsou jiné: "Coming soon" místo
   hlasování/plánu, coming-soon.html místo place/{id}.html (ta stránka
   pro tahle místa neexistuje). Obrázek+text se dotahují živě z
   Wikipedie (window.lopWikiPreview, wiki-preview.js) — teaser budoucího
   stavu, proto zešedlý+zesvětlený (.dev-card-photo). */
function devCardHTML(item) {
  const color  = CAT_COLOR[item.cat]  || '#4A4A48';
  const letter = CAT_LETTER[item.cat] || 'H';
  const catName = CAT_NAME[item.cat] || '';
  const detailUrl = 'coming-soon.html?name=' + encodeURIComponent(item.name)
    + (item.wiki ? '&wiki=' + encodeURIComponent(item.wiki) : '');
  const mediaId = 'devMedia_' + item.id;
  const ledeId  = 'devLede_' + item.id;

  // Vzdálenost fungovat MŮŽE (dev místa mají lat/lng) — stejný výpočet
  // jako u publikovaných míst, jen bez odkazu na kompas (ten patří
  // k detail stránce, kterou tahle místa nemají).
  const dist = userPos && item.lat && item.lng ? formatDist(haversineM(userPos[0], userPos[1], item.lat, item.lng)) : '';
  const distHtml = dist
    ? `<span class="place-dist">${dist}</span>`
    : `<span class="place-dist-hint">${GEO_PERM === 'denied' ? t('place.geo_blocked') : t('sheet.enable_location')}</span>`;

  // Hlasy a plán jsou jen naznačené — žádná čísla (nejsou to skutečně
  // sledovaná/hlasovaná místa), žádná interakce (.dev-votes/.dev-wish-wrap
  // mají pointer-events:none).
  const arrowUp   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>`;
  const arrowDown = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>`;
  const votesHtml = `<div class="place-votes dev-votes">
    <span class="place-vote-btn up">${arrowUp}</span>
    <span class="place-vote-btn down">${arrowDown}</span>
  </div>`;
  const wishHtml = `<div class="place-wish-wrap dev-wish-wrap" title="${t('admin.coming_soon')}">
    <span class="place-wish-lbl">${t('place.plan_add')}</span>
    <button class="place-wish-btn" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    </button>
  </div>`;

  return `<div class="place-card dev-card" data-cat="${item.cat}" onclick="location.href='${detailUrl}'">
    <div class="place-thumb" data-cat="${item.cat}" id="${mediaId}">
      <div class="place-thumb-fallback">${letter}</div>
      <div class="place-cat-line" style="background:${color}"></div>
      <div class="place-cat-pill"><span class="dot" style="background:${color}"></span>${catName}</div>
    </div>
    <div class="dev-ribbon-wrap"><div class="dev-soon-ribbon">${t('admin.coming_soon')}</div></div>
    <div class="place-body">
      <div class="place-kick"><span class="dot" style="background:${color}"></span><span>${catName}</span></div>
      <div class="place-name">${item.name}</div>
      <div class="place-sub" id="${ledeId}"></div>
    </div>
    <div class="place-meta">
      ${distHtml}
      <span class="meta-wish-list">${wishHtml}</span>
      <span class="meta-dist-grid">${distHtml}</span>
      <div class="place-meta-right">${votesHtml}</div>
      <span class="meta-wish-grid">${wishHtml}</span>
    </div>
  </div>`;
}

/* Po vykreslení dlaždic doplní živé náhledy z Wikipedie — samostatný krok,
   ne součást devCardHTML(), protože fetch je async a innerHTML se
   nastavuje synchronně. Kontrola existence elementu při doplnění řeší
   případ, kdy uživatel mezitím přefiltroval seznam (render() smaže DOM). */
function loadDevPreviews() {
  DEV_PLACES.forEach(item => {
    if (!item.wiki || !window.lopWikiPreview) return;
    window.lopWikiPreview(item.wiki).then(info => {
      if (!info) return;
      const media = document.getElementById('devMedia_' + item.id);
      if (info.thumbnail && media && !media.querySelector('img')) {
        const img = document.createElement('img');
        img.className = 'dev-card-photo';
        img.loading = 'lazy';
        img.onerror = () => img.remove();
        img.src = info.thumbnail;
        media.insertBefore(img, media.firstChild);
      }
      const ledeBox = document.getElementById('devLede_' + item.id);
      if (info.extract && ledeBox && !ledeBox.textContent) {
        const short = info.extract.length > 140
          ? info.extract.slice(0, 140).replace(/\s+\S*$/, '') + '…'
          : info.extract;
        ledeBox.textContent = short;
      }
    });
  });
}

function cardHTML(p, visited, wished) {
  const color   = (window.lopCatColor && window.lopCatColor(p.cat)) || CAT_COLOR[p.cat] || '#4A4A48';
  const letter  = CAT_LETTER[p.cat] || 'H';
  const catName = CAT_NAME[p.cat]   || '';
  const vis     = visited.includes(String(p.id));
  const wish    = wished && wished.includes(String(p.id));
  const thumb   = p.thumb || '';
  const lede    = locStr(p,'teaser') || locStr(p,'lede');
  const detailUrl = 'place/' + p.id + '.html';
  const dist = userPos && p.lat && p.lng ? formatDist(haversineM(userPos[0],userPos[1],p.lat,p.lng)) : '';
  const loggedIn = isLoggedIn();

  // Stamp pro navštívená místa — vždy přes pravý horní roh textu
  const arScore = _arScores[String(p.id)] ?? null;
  const stampHtml = vis && loggedIn
    ? `<div class="place-stamp-body">${makeStampSVG(p, arScore)}</div>`
    : '';

  // Vzdálenost + odkaz na kompas
  const compassUrl = p.lat && p.lng
    ? `compass.html?id=${p.id}&lat=${p.lat}&lng=${p.lng}&name=${encodeURIComponent(locStr(p,'name'))}${p.thumb?'&thumb='+encodeURIComponent(p.thumb):''}${p.arRadius?'&radius='+p.arRadius:''}`
    : null;

  const compassIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>`;

  // Seznam: ikona nad číslem (flex-column)
  const geoBlocked = GEO_PERM === 'denied';
  const geoHintAttrs = geoBlocked
    ? `onclick="showGeoBlockedHint(event)"`
    : `onclick="requestLoc(event)"`;
  const geoHintTxt = geoBlocked ? t('place.geo_blocked') : t('sheet.enable_location');

  const distListHtml = dist
    ? `<a class="place-dist place-dist-link" href="${compassUrl||'#'}" onclick="event.stopPropagation()" title="${t('overview.navigate')}">
        <span class="place-dist-icon list">${compassIcon}</span>
        <span>${dist}</span>
       </a>`
    : `<span class="place-dist-hint place-dist-hint-list${geoBlocked?' geo-blocked':''}" ${geoHintAttrs}>${geoHintTxt.replace(' ','<br>')}</span>`;

  // Dlaždice: ikona před číslem (flex-row)
  const distGridHtml = dist
    ? `<a class="place-dist place-dist-link place-dist-grid" href="${compassUrl||'#'}" onclick="event.stopPropagation()" title="${t('overview.navigate')}">
        <span class="place-dist-icon grid">${compassIcon}</span>
        <span>${dist}</span>
       </a>`
    : `<span class="place-dist-hint${geoBlocked?' geo-blocked':''}" ${geoHintAttrs}>${geoHintTxt}</span>`;

  // Like/dislike — čisté šipky, s počty (TODO: Supabase)
  const voteUp   = p._voteUp   ?? Math.floor(Math.random()*40+2);  // placeholder
  const voteDown = p._voteDown ?? Math.floor(Math.random()*8);      // placeholder
  const votedUp   = p._votedUp   || false;
  const votedDown = p._votedDown || false;

  // Vote ikony — thumbs up/down, stejná tloušťka a barva linky jako srdce (stroke-width 1.5, var(--ink-5))
  const arrowUp   = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>`;
  const arrowDown = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>`;

  const votesHtml = `<div class="place-votes">
    <button class="place-vote-btn up${votedUp?' voted':''}" onclick="votePlace(event,'${p.id}','up')" title="${t('overview.vote_up')}">
      ${arrowUp}<span class="place-vote-count">${voteUp}</span>
    </button>
    <button class="place-vote-btn down${votedDown?' voted':''}" onclick="votePlace(event,'${p.id}','down')" title="${t('overview.vote_down')}">
      ${arrowDown}<span class="place-vote-count">${voteDown}</span>
    </button>
  </div>`;

  // Wish — s labelem, obaleno v place-wish-wrap
  const wishLbl = `<span class="place-wish-lbl${wish?' active':''}">${wish?t('place.plan_in'):t('place.plan_add')}</span>`;
  const wishBtn = loggedIn
    ? `<div class="place-wish-wrap" onclick="toggleWish(event,'${p.id}')">
        ${wishLbl}
        <button class="place-wish-btn ${wish?'wished':''}" title="${wish?t('place.plan_in'):t('place.plan_add')}">
          <svg viewBox="0 0 24 24" fill="${wish?'currentColor':'none'}" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
        </button>
      </div>`
    : `<div class="place-wish-wrap" onclick="event.stopPropagation();window.lopAuth?window.lopAuth.open():location.href='login.html?return='+encodeURIComponent(location.href);">
        <span class="place-wish-lbl">${t('place.plan_add')}</span>
        <button class="place-wish-btn" title="${t('overview.login_req')}" style="position:relative">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          <span class="place-wish-lock"></span>
        </button>
      </div>`;

  return `<div class="place-card" data-cat="${p.cat}" onclick="location.href='${detailUrl}'">
    <div class="place-thumb" data-cat="${p.cat}">
      ${thumb?`<img src="${thumb}" alt="${locStr(p,'name')}" onerror="this.style.display='none'"/>`:'' }
      <div class="place-thumb-fallback">${letter}</div>
      <div class="place-cat-line" style="background:${color}"></div>
      <div class="place-cat-pill"><span class="dot" style="background:${color}"></span>${catName}</div>
    </div>
    <div class="place-body">
      <div class="place-kick">
        <span class="dot" style="background:${color}"></span>
        <span>${catName}</span>
        ${votesHtml}
      </div>
      <div class="place-name">${locStr(p,'name')}</div>
      <div class="place-sub">${lede}</div>
      ${stampHtml}
    </div>
    <div class="place-meta">
      ${distListHtml}
      <span class="meta-wish-list">${wishBtn}</span>
      <span class="meta-dist-grid">${distGridHtml}</span>
      <div class="place-meta-right">${votesHtml}</div>
      <span class="meta-wish-grid">${wishBtn}</span>
    </div>
  </div>`;
}

function votePlace(e, id, dir) {
  e.preventDefault(); e.stopPropagation();
  // TODO: napojit na Supabase votes tabulku
  const btn = e.currentTarget;
  const card = btn.closest('.place-card');
  const allUp   = card.querySelectorAll('.place-vote-btn.up');
  const allDown = card.querySelectorAll('.place-vote-btn.down');
  if (dir === 'up') {
    const wasVoted = btn.classList.contains('voted');
    allUp.forEach(b => b.classList.toggle('voted', !wasVoted));
    allDown.forEach(b => b.classList.remove('voted'));
  } else {
    const wasVoted = btn.classList.contains('voted');
    allDown.forEach(b => b.classList.toggle('voted', !wasVoted));
    allUp.forEach(b => b.classList.remove('voted'));
  }
}

function toggleWish(e, id) {
  e.preventDefault(); e.stopPropagation();
  const wrap = e.currentTarget.closest ? e.currentTarget.closest('.place-wish-wrap') : e.currentTarget;
  const btn = wrap ? wrap.querySelector('.place-wish-btn') : null;
  const lbl = wrap ? wrap.querySelector('.place-wish-lbl') : null;
  const w=[...new Set(getWished())], idx=w.indexOf(String(id));
  if(idx>=0){ w.splice(idx,1); dbRemoveWish(id); } else{ w.push(String(id)); dbAddWish(id); }
  localStorage.setItem(WISH_KEY, JSON.stringify(w));
  const wished=idx<0;
  if(btn) {
    btn.classList.toggle('wished', wished);
    const svg = btn.querySelector('svg');
    if(svg) svg.setAttribute('fill', wished ? 'currentColor' : 'none');
  }
  if(lbl) {
    lbl.textContent = wished ? t('place.plan_in') : t('place.plan_add');
    lbl.classList.toggle('active', wished);
  }
  updateCounts();
  if(window.lopNav) window.lopNav.refresh();
}

const SUPA_URL = 'https://lomtaoctzetpweuepesp.supabase.co';
const SUPA_KEY = 'sb_publishable_uAQBxCOYWpc_PrEc78fFzw_kbeH4xj5';

function authHeaders() {
  const s=getSession();
  return { 'apikey':SUPA_KEY, 'Authorization':'Bearer '+(s?.access_token||SUPA_KEY), 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates' };
}
function dbAddWish(id)    { getValidSession().then(s=>{if(!s?.user) return; fetch(SUPA_URL+'/rest/v1/wishlist',{method:'POST',headers:authHeaders(),body:JSON.stringify({user_id:s.user.id,place_id:String(id)})}).catch(()=>{}); }); }
function dbRemoveWish(id) { getValidSession().then(s=>{if(!s?.user) return; fetch(SUPA_URL+'/rest/v1/wishlist?user_id=eq.'+s.user.id+'&place_id=eq.'+id,{method:'DELETE',headers:authHeaders()}).catch(()=>{}); }); }

async function syncFromDB(onDone) {
  const s=await getValidSession();
  if(!s?.access_token||!s?.user){ if(onDone) onDone(); return; }
  const SYNC_TIMEOUT_MS=10000;
  function _injectSyncUI() {
    if(document.getElementById('lop-sync-bar')) return;
    const style=document.createElement('style');
    style.textContent='#lop-sync-bar{position:fixed;bottom:0;left:0;right:0;z-index:8000;background:rgba(17,17,17,.85);color:#F8F8F6;padding:10px 16px;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.4;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.8,.36,1);font-family:Inter,system-ui,sans-serif;backdrop-filter:blur(10px);}#lop-sync-bar.show{transform:translateY(0);}#lop-sync-bar .sb-text{flex:1;}#lop-sync-bar .sb-retry{flex-shrink:0;background:transparent;border:1px solid rgba(248,248,246,.4);color:#F8F8F6;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:inherit;}#lop-sync-spinner{position:fixed;bottom:0;left:0;right:0;z-index:7999;height:2px;background:linear-gradient(90deg,transparent,#B04020,transparent);background-size:200% 100%;animation:lop-slide 1.4s linear infinite;opacity:0;transition:opacity .2s;}#lop-sync-spinner.show{opacity:1;}@keyframes lop-slide{0%{background-position:200% 0;}100%{background-position:-200% 0;}}';
    document.head.appendChild(style);
    const spinner=document.createElement('div'); spinner.id='lop-sync-spinner'; document.body.appendChild(spinner);
    const bar=document.createElement('div'); bar.id='lop-sync-bar';
    bar.innerHTML=`<span class="sb-text">${t('overview.sync_err')}</span><button class="sb-retry" onclick="window._lopSyncRetry()">${t('overview.sync_retry')}</button>`;
    document.body.appendChild(bar);
  }
  function _showSyncSpinner(on){ const el=document.getElementById('lop-sync-spinner'); if(el) el.classList.toggle('show',on); }
  function _showSyncBar(on){
    const el=document.getElementById('lop-sync-bar'); if(!el) return;
    if(on){ const nav=document.getElementById('lop-nav'); el.style.bottom=(window.innerWidth<820?nav?.getBoundingClientRect().height||56:0)+'px'; }
    el.classList.toggle('show',on);
  }
  _injectSyncUI(); _showSyncSpinner(true); _showSyncBar(false);
  window._lopSyncRetry=()=>{ _showSyncBar(false); syncFromDB(()=>{ render(); updateCounts(); }); };
  const ft=(url,opts)=>new Promise((res,rej)=>{ const t=setTimeout(()=>rej(new Error('timeout')),SYNC_TIMEOUT_MS); fetch(url,opts).then(r=>{clearTimeout(t);res(r);}).catch(e=>{clearTimeout(t);rej(e);}); });
  try {
    const [wRes,vRes]=await Promise.all([
      ft(SUPA_URL+'/rest/v1/wishlist?user_id=eq.'+s.user.id+'&select=place_id',{headers:authHeaders()}),
      ft(SUPA_URL+'/rest/v1/visited?user_id=eq.'+s.user.id+'&select=place_id,score',{headers:authHeaders()}),
    ]);
    if(!wRes.ok||!vRes.ok) throw new Error('HTTP '+(!wRes.ok?wRes.status:vRes.status));
    localStorage.setItem(WISH_KEY,  JSON.stringify((await wRes.json()).map(r=>String(r.place_id))));
    const vRows = await vRes.json();
    localStorage.setItem(VISIT_KEY, JSON.stringify(vRows.map(r=>String(r.place_id))));
    // Ulož AR score pro razítka
    _arScores = {};
    vRows.forEach(r => { _arScores[String(r.place_id)] = r.score ?? null; });
    fetch(SUPA_URL+'/rest/v1/profiles?user_id=eq.'+s.user.id+'&select=role',{headers:authHeaders()})
      .then(r=>r.ok?r.json():[]).then(rows=>{if(rows[0]?.role) localStorage.setItem('lop_user_role',rows[0].role); updateDevRowVisibility();}).catch(()=>{});
    _showSyncSpinner(false); _showSyncBar(false); if(onDone) onDone();
  } catch(e) {
    _showSyncSpinner(false); _showSyncBar(true);
    const sb=document.getElementById('lop-sync-bar'); if(sb){const t=sb.querySelector('.sb-text');if(t) t.textContent=t('overview.load_err')+': '+(e?.message||String(e));}
    if(onDone) onDone();
  }
}

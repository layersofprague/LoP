<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<link rel="manifest" href="manifest.json"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="color-scheme" content="light"/>
<meta name="theme-color" content="#111111"/>
<script src="theme.js?v=20260801"></script>
<title id="pageTitle">Přehled míst — LayersOfPrague</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper:    #F8F8F6;
  --paper-2:  #F0F0EE;
  --paper-3:  #E8E8E6;
  --ink:      #111111;
  --ink-2:    #333331;
  --ink-3:    #666662;
  --ink-4:    #999994;
  --ink-5:    #BABAB6;
  --rule:     #E8E8E6;
  --rule-2:   #E0E0DE;
  --accent:   #B04020;
  --ok:       #3d7a4a;
  --cat-hist: #4A4A48;
  --cat-arch: #3B5F84;
  /* Umění zdědilo žlutou po zrušené kategorii Zajímavosti */
  --cat-art:  #E0A020;
  --ease:     cubic-bezier(.22,.8,.36,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; min-height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }

/* ── PAGE ── */
.page {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 10px 100px;
}
@media (max-width: 600px) {
  .page { padding-top: 18px; }
}

/* ── HERO ── */
.hero-section {
  margin-bottom: 10px;
}
.hero-top {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  margin-bottom: 12px;
}
.kick { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-5); margin-bottom: 12px; font-weight: 500; }
.page-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: clamp(24px, 6vw, 36px); line-height: 1; letter-spacing: -.03em; color: var(--ink); white-space: nowrap; }
.page-title em { font-style: italic; font-weight: 300; color: #777772; }
.page-intro { font-size: 14px; color: var(--ink-4); line-height: 1.6; text-wrap: pretty; margin-bottom: 14px; }

/* ── TOOLBAR (filtr + toggle) ── */
/* ── CONTROLS BAR ── */
.controls-bar {
  display: flex; align-items: center;
  background: #F8F8F6; border: none;
  border-radius: 10px;
  overflow: hidden; flex-shrink: 0;
}
.ctrl-btn {
  appearance: none; border: none; background: transparent;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  cursor: pointer; color: var(--ink-4);
  transition: background .15s, color .15s;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
  white-space: nowrap; flex-shrink: 0;
}
.ctrl-btn:hover { background: var(--paper-2); color: var(--ink-2); }
.ctrl-btn:focus { outline: none; }
.ctrl-btn.active { background: var(--ink); color: #fff; }
@media (hover: none) {
  .ctrl-btn:hover { background: transparent; color: var(--ink-4); }
  .ctrl-btn.active:hover { background: var(--ink); color: #fff; }
}
.ctrl-btn svg { width: 14px; height: 14px; pointer-events: none; flex-shrink: 0; }
.ctrl-btn-filter {
  flex-direction: row; gap: 4px;
  padding: 5px 9px;
  border-right: 1px solid var(--rule);
}
/* ikona + tečky nad ní */
.filter-icon-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.ctrl-btn-filter .filter-dots { display: flex; gap: 2px; align-items: center; }
.ctrl-btn-filter .filter-dots span { width: 3px; height: 3px; border-radius: 50%; flex-shrink: 0; }
.ctrl-btn-filter .filter-bottom { display: flex; align-items: center; gap: 4px; font-size: 11px; }
.ctrl-btn-filter .filter-cnt { font-size: 10px; color: var(--ink-5); }
.ctrl-btn-filter.has-filter .filter-cnt { color: var(--accent); font-weight: 600; }
.ctrl-btn-view { width: 34px; padding: 6px 0; }
.ctrl-btn-view + .ctrl-btn-view { border-left: 1px solid var(--rule); }

/* ── FILTER MODAL ── */
.filter-modal-backdrop {
  position: fixed;
  top: var(--header-h, 52px); left: 0;
  right: var(--nav-inset-right, 0px); bottom: var(--nav-inset-bottom, 0px);
  z-index: 80; /* pod #lop-nav (z-index 90 v nav.js) — navbar musí zůstat viditelný i s otevřeným filtrem */
  display: none; pointer-events: none;
  background: transparent; transition: background .22s;
}
.filter-modal-backdrop.open {
  display: block; pointer-events: auto;
  background: rgba(17,17,17,.18);
  backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.filter-modal {
  position: absolute;
  top: 12px; left: 12px; right: 12px; bottom: 12px;
  background: rgba(248,248,246,.96);
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1.5px solid var(--rule); border-radius: 14px;
  box-shadow: 0 8px 40px rgba(0,0,0,.14);
  opacity: 0; transform: scale(.97) translateY(-6px);
  transition: opacity .22s var(--ease), transform .22s var(--ease);
  pointer-events: none; overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column;
}
.filter-modal-backdrop.open .filter-modal {
  opacity: 1; transform: none; pointer-events: auto;
}
.filter-modal-inner { padding: 16px 16px 20px; flex: 1; }
/* ikona s tečkami a počtem — stejná sestava i barvy jako tlačítko pod hlavičkou */
.dist-note {
  font-family: 'Inter', sans-serif; font-size: 11px; color: var(--ink-4);
  margin-top: 7px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.dist-note[hidden] { display: none; }
.dist-note button {
  background: transparent; border: 1.5px solid var(--rule); border-radius: 7px;
  padding: 3px 10px; cursor: pointer; font-family: inherit; font-size: 11px;
  color: var(--ink-2);
  transition: box-shadow .15s, transform .15s, border-color .15s;
}
.dist-note button:hover { border-color: var(--ink-4); box-shadow: 0 3px 10px rgba(26,24,20,.16); transform: translateY(-1px); }
.fm-cnt-wrap { display: flex; align-items: center; gap: 4px; }
.fm-cnt-wrap svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--ink-4); }
.fm-cnt-wrap .filter-dots { display: flex; gap: 2px; align-items: center; }
.fm-cnt-wrap .filter-dots span { width: 3px; height: 3px; border-radius: 50%; flex-shrink: 0; }
.fm-cnt-wrap .filter-cnt { font-size: 10px; color: var(--ink-5); }
.fm-cnt-wrap #fmCntActive { font-size: 12px; font-weight: 500; color: var(--ink-5); }

/* chip-wrap se stavovým popiskem — stejné jako index.html */
/* Kategorie popisek nemají, navštíveno a plán ano — zarovnat chipy dolů,
   ať stojí na společné lince bez ohledu na to, co je nad nimi. */
.chip-wrap {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
  justify-content: flex-end;
}
.chip-state-lbl {
  font-family: 'Inter', sans-serif;
  font-size: 9px; letter-spacing: .01em; text-transform: none;
  color: var(--ink-4); line-height: 1;
  width: 72px;
  padding-left: 13px;
  transition: color .15s;
}
.filter-row { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.filter-row:first-child { padding-top: 4px; }
.filter-row:last-of-type { border-bottom: none; }
.filter-lbl { display: flex; justify-content: space-between; align-items: baseline; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); margin-bottom: 10px; }
.filter-lbl-val { color: var(--ink); letter-spacing: .04em; font-size: 11px; }
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-end; }

/* ── CHIP ── */
.chip {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px; background: #fff; border: 1.5px solid var(--rule); border-radius: 7px;
  font-size: 12px; font-weight: 500; color: var(--ink-2);
  cursor: pointer; white-space: nowrap;
  transition: box-shadow .15s, transform .15s, background .15s, color .15s, border-color .15s;
}
.chip:hover  { border-color: var(--ink-4); box-shadow: 0 3px 10px rgba(26,24,20,.16); transform: translateY(-1px); }
.chip:active { transform: translateY(0); box-shadow: none; }
.chip.state-hide:hover  { box-shadow: 0 3px 10px rgba(26,24,20,.28); }
/* Kategorie i sloh jsou pozitivní výběr: zvolený má barevný obrys.
   Plná černá je vyhrazená pro skrytí (navštíveno / plán). */
.chip[data-cat].state-on { background: #fff; }
.chip[data-cat="hist"].state-on { border-color: var(--cat-hist); color: var(--cat-hist); }
.chip[data-cat="arch"].state-on { border-color: var(--cat-arch); color: var(--cat-arch); }
.chip[data-cat="art"].state-on  { border-color: var(--cat-art);  color: var(--cat-art);  }
.chip[data-cat].state-on .chip-count { opacity: .7; }
/* "jen tyto" u navštíveno a plánu — barevný obrys jako u kategorií */
.chip[data-filter="wished"].state-on  { background:#fff; border-color: var(--accent); color: var(--accent); }
.chip[data-filter="visited"].state-on { background:#fff; border-color: var(--ok);     color: var(--ok);     }
.chip[data-filter="wished"].state-on .chip-icon-heart  { background: var(--accent) !important; }
.chip[data-filter="visited"].state-on .chip-icon-check { background: var(--ok) !important; }
.chip[data-filter].state-on svg { color: currentColor !important; fill: currentColor !important; stroke: currentColor !important; }

/* sloh je pozitivní výběr — zvolený má barevný obrys, shodně s kategoriemi */
.chip.chip-style.state-on { background: #fff; border-color: var(--cat-arch); color: var(--cat-arch); }
.chip.chip-style.state-on .chip-swatch { background: var(--cat-arch) !important; }
.chip.chip-style.state-on .chip-count  { color: var(--cat-arch); opacity: .7; }
.chip.state-on:hover { box-shadow: 0 3px 10px rgba(26,24,20,.16); }
.chip .chip-swatch { width: 7px; height: 7px; border-radius: 2px; flex-shrink: 0; }
.chip .chip-icon { width: 12px; height: 12px; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; -webkit-mask-size: contain; mask-size: contain; }
.chip .chip-icon-check {
  background-color: var(--ok);
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>");
          mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>");
}
.chip .chip-icon-heart {
  background-color: var(--accent);
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z'/></svg>");
          mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><path d='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z'/></svg>");
  width: 11px; height: 11px;
}
.chip.chip-locked { position: relative; }
.chip.chip-locked::before {
  content: attr(data-tooltip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; font-size: 12px; line-height: 1.4; padding: 6px 10px; border-radius: 6px;
  white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 1000;
  font-family: 'Inter', sans-serif; font-weight: 400; box-shadow: 0 2px 8px rgba(0,0,0,.2);
}
.chip.chip-locked::after {
  content: ''; position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%);
  border: 4px solid transparent; border-top-color: var(--ink); pointer-events: none; opacity: 0; transition: opacity .15s;
}
.chip.chip-locked:hover::before, .chip.chip-locked:hover::after { opacity: 1; }
.chip.state-hide { background: var(--ink) !important; color: #fff !important; border-color: var(--ink) !important; }
.chip.state-hide .chip-swatch { background: #fff !important; }
.chip.state-hide:not(.chip-locked)::after { content: none; }
.chip .chip-count { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-5); margin-left: 2px; }
.chip .chip-filter-icon {
  display: none; width: 9px; height: 9px; margin-left: 2px; flex-shrink: 0; background: currentColor;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polygon points='22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3'/></svg>") center/contain no-repeat;
}
.chip.state-hide .chip-count { display: none; }
.chip.state-hide .chip-filter-icon { display: inline-block; background: #fff; }
.chip.all { background: var(--ink); color: #fff; border-color: var(--ink); }
.chip.all .chip-count { color: rgba(255,255,255,.5); }
.chip-lock { opacity: .5; }
.filter-chip { display: none; }

/* ── ERA TIMELINE ── */
.filter-timeline { position: relative; height: 46px; }
.filter-timeline .ft-track { position: absolute; left: 0; right: 0; top: 20px; height: 4px; background: var(--rule); border-radius: 2px; }
.filter-timeline .ft-fill { position: absolute; top: 20px; height: 4px; background: var(--ink); border-radius: 2px; }
.filter-timeline .ft-h { position: absolute; top: 22px; transform: translate(-50%,-50%); width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.2); cursor: grab; z-index: 3; touch-action: none; }
.filter-timeline .ft-h:active { cursor: grabbing; }
.filter-timeline .ft-year { position: absolute; top: 32px; transform: translateX(-50%); font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-5); letter-spacing: .05em; pointer-events: none; }
.filter-timeline .ft-year-tick { position: absolute; top: 27px; width: 1px; height: 3px; background: var(--rule-2); transform: translateX(-50%); pointer-events: none; }
/* Výchozí stav = celý rozsah, tedy stopa černá jako u časové osy.
   Šedne až část za táhlem — plní se z JS přes --fill. */
.filter-range-input {
  appearance: none; -webkit-appearance: none;
  width: 100%; height: 4px; border-radius: 2px; outline: none; margin-top: 2px;
  background: linear-gradient(to right,
    var(--ink) 0%, var(--ink) var(--fill, 100%),
    var(--rule) var(--fill, 100%), var(--rule) 100%);
}
.filter-range-input::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.filter-range-input::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); cursor: pointer; }
/* Reset vlevo, potvrzení vpravo — zavření křížkem nemusí být každému zřejmé. */
.filter-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; }
.filter-apply {
  background: var(--ink); border: 1.5px solid var(--ink); border-radius: 7px;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
  color: var(--paper); cursor: pointer; padding: 6px 16px;
  transition: box-shadow .15s, transform .15s;
}
.filter-apply:hover  { box-shadow: 0 3px 10px rgba(26,24,20,.28); transform: translateY(-1px); }
.filter-apply:active { transform: translateY(0); box-shadow: none; }
.filter-reset { background: transparent; border: none; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-4); cursor: pointer; padding: 4px 0; }
.filter-reset:hover { color: var(--ink); }
/* Admin-only sekce — pracovní vrstva places-development.json. */
#devRow { border-top: 1px dashed var(--rule); padding-top: 12px; }
#devRow .filter-lbl { color: #b04020; }
.dev-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.dev-btn {
  appearance: none; cursor: pointer;
  background: #fff; border: 1.5px solid var(--rule); border-radius: 7px;
  padding: 5px 12px;
  font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
  color: var(--ink-2);
  transition: box-shadow .15s, transform .15s, border-color .15s;
}
.dev-btn:hover { border-color: var(--ink-4); box-shadow: 0 3px 10px rgba(26,24,20,.16); transform: translateY(-1px); }
.dev-check { display: flex; align-items: center; gap: 6px; font-family: 'Inter', sans-serif; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.dev-check input { cursor: pointer; }
/* Dev karty — teď klikatelné (vedou na coming-soon.html, viz devCardHTML),
   ale bez plné interaktivity skutečných karet (žádné hlasování/plán).
   Páska "Coming soon" má mírně přesahovat přes roh ven (jako vlaječka) —
   proto overflow:visible na dev kartě samotné; v list módu (foto jen
   80px sloupec vlevo) by přesahující páska zasahovala do textu, tam
   zůstává bezpečněji ořezaná. */
.place-card.dev-card { overflow: visible; }
#placesList:not(.grid-mode) .place-card.dev-card { overflow: hidden; }
.place-card.dev-card .place-thumb {
  overflow: hidden;
  border-radius: 10px 0 0 10px; /* list mód — foto vlevo, zaoblená levá strana */
}
#placesList.grid-mode .place-card.dev-card .place-thumb {
  border-radius: 10px 10px 0 0; /* grid mód — foto nahoře, zaoblený horní okraj */
}
/* Fotka z Wikipedie je jen "teaser" budoucího stavu — zešedlá a
   zesvětlená, ať je na první pohled jasné, že to není finální fotka. */
.dev-card-photo {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
  filter: grayscale(1) brightness(1.3) opacity(.55);
}
/* Wrapper posunutý MIMO roh (ne flush s ním) — dává pásce rovné konce
   rovnoběžné s hranami karty (ne obyčejný obdélníkový konec), a
   zároveň zůstává vidět mírný přesah ven jako u vlaječky. */
/* Wrapper posunutý MIMO roh — dává pásce rovné konce rovnoběžné
   s hranami karty a jemný přesah ven. Rozměry ověřené výpočtem
   (Playwright bounding_box), ať protíná ČISTĚ jen horní a pravou
   hranu wrapperu. */
.dev-ribbon-wrap {
  position: absolute; top: -4px; right: -4px;
  width: 90px; height: 90px;
  overflow: hidden;
  z-index: 5;
  pointer-events: none;
}
.dev-soon-ribbon {
  position: absolute; top: 27px; right: -15px;
  width: 99px;
  background: #b04020;
  color: #fff;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  text-align: center;
  padding: 4px 0;
  transform: rotate(45deg);
  box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
/* Hlasy/plán u pracovní vrstvy jsou jen naznačené — žádná čísla, žádná
   interakce (nejsou to skutečně sledovaná místa, jen teaser). */
.dev-votes, .dev-wish-wrap { opacity: .45; pointer-events: none; }
.dev-wish-wrap .place-wish-lbl { color: var(--ink-4) !important; }
.dev-wish-wrap .place-wish-btn { color: var(--ink-4) !important; }

/* ── SECTION LABEL ── */
.section-label {
  display: flex; align-items: center; gap: 12px;
  margin-top: 16px; margin-bottom: 10px;
}
#placesList.grid-mode .section-label { grid-column: 1 / -1; margin-top: 16px; margin-bottom: 8px; }
.section-label .sn { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-5); white-space: nowrap; }
.section-label .sl { flex: 1; height: 1px; background: var(--rule); }
.section-label .ct { font-size: 10px; color: var(--ink-5); }

/* ── LIST MODE ── */
#placesList {
  display: flex; flex-direction: column; gap: 0;
}
.place-section-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 5px; }

/* ── LIST CARD ── */
.place-card {
  display: grid;
  grid-template-columns: 80px 1fr auto;
  align-items: stretch;
  position: relative;
  border: 1.5px solid var(--rule);
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
  cursor: pointer;
  transition: box-shadow .2s var(--ease), transform .2s var(--ease);
}
.place-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.09); transform: translateY(-1px); }
.place-card:hover .place-name { color: #000; }

.place-thumb {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Inter', sans-serif; font-size: 23px; font-weight: 700;
  letter-spacing: -.04em; color: rgba(0,0,0,.10);
  min-height: 62px; flex-shrink: 0;
  background: #EFEFED;
}
.place-thumb[data-cat="arch"] { background: #EEF2F7; }
.place-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.place-thumb-fallback { position: relative; z-index: 1; pointer-events: none; }
.place-cat-line { position: absolute; top: 0; left: 0; bottom: 0; width: 3px; z-index: 2; }

/* body */
.place-body {
  position: relative;
  padding: 6px 6px 6px 8px;
  border-left: 1px solid var(--paper-2);
  min-width: 0; display: flex; flex-direction: column; justify-content: center;
}
.place-kick {
  display: flex; align-items: center; gap: 5px;
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-5); margin-bottom: 2px;
}
.place-kick .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.place-name {
  font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
  color: var(--ink); letter-spacing: -.01em; line-height: 1.2;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: color .15s;
}
.place-sub {
  font-size: 12px; color: var(--ink-4); margin-top: 2px; line-height: 1.4;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

/* stamp — absolutně, zarovnán na střed POPISU (kick+name+sub), ne celé karty */
.place-stamp-body {
  position: absolute; bottom: 6px; right: 8px;
  width: 46px; height: 46px;
  pointer-events: none; z-index: 3;
}
.place-stamp-body svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* meta column — pevná šířka, nikdy se nemění, wish je zde */
.place-meta {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  gap: 4px; padding: 6px 6px;
  border-left: 1px solid var(--paper-2);
  width: 52px; flex-shrink: 0; flex-grow: 0;
}
.place-dist { font-size: 11px; color: var(--ink-5); font-family: 'Inter', sans-serif; text-align: center; white-space: nowrap; }
.place-dist-link {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  text-decoration: none; color: var(--ink-5);
  transition: color .15s;
}
.place-dist-link:hover { color: var(--ink-3); }
.place-dist-link.place-dist-grid { flex-direction: row; gap: 4px; }
.place-dist-icon svg { width: 12px; height: 12px; display: block; }
.place-dist-hint { font-size: 9px; color: var(--ink-5); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-align: center; }
.place-dist-hint:hover { color: var(--ink-4); }
.place-dist-hint.geo-blocked { cursor: default; text-decoration: none; }
.place-dist-hint.geo-blocked:hover { color: var(--ink-5); }

/* tooltip po kliku na zablokovanou polohu — druhé okno prohlížeč nezobrazí,
   takže tohle je jediná viditelná odpověď na klik */
.geo-tip {
  position: fixed; z-index: 2000; max-width: 240px;
  background: var(--ink); color: var(--paper);
  font-family: 'Inter', sans-serif; font-size: 11px; line-height: 1.4;
  padding: 8px 11px; border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
  opacity: 0; transform: translateY(4px);
  transition: opacity .15s, transform .15s;
  pointer-events: none;
}
.geo-tip.visible { opacity: 1; transform: translateY(0); }

/* meta-dist-grid: skrytý v listu, viditelný v gridu */
.meta-dist-grid { display: none; }

/* list: meta-wish-list viditelný, meta-right a meta-wish-grid skryté */
.meta-wish-list { display: flex; }
.meta-wish-grid { display: none; }
.place-meta-right { display: none; }

/* like/dislike */
.place-votes { display: flex; align-items: center; gap: 4px; }
.place-vote-btn {
  appearance: none; background: transparent; border: none;
  display: flex; align-items: center; gap: 3px;
  padding: 2px 5px; border-radius: 5px; cursor: pointer;
  color: var(--ink-5); transition: color .15s, background .15s;
  flex-shrink: 0;
}
.place-vote-btn:hover { background: var(--paper-3); color: var(--ink-2); }
.place-vote-btn.up.voted svg,
.place-vote-btn.down.voted svg { fill: var(--ink-2); stroke: var(--ink-5); }
.place-vote-btn svg { width: 14px; height: 14px; pointer-events: none; }
/* čísla liků — Inter 10px stejně v obou módech */
.place-vote-count {
  font-family: 'Inter', sans-serif;
  font-size: 10px; line-height: 1; color: inherit;
  min-width: 14px; text-align: left;
}
.place-kick .place-votes { margin-left: auto; }

/* wish wrapper */
.place-wish-wrap {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  cursor: pointer;
}
/* wish label — stejný font jako dist-hint */
.place-wish-lbl {
  font-size: 10px; font-family: 'Inter', sans-serif;
  color: var(--ink-5); text-align: center;
  letter-spacing: .01em; line-height: 1.15;
  /* Sloupec má 52 px — delší jazyky se musí zalomit, ne přetéct do srdíčka. */
  white-space: normal; overflow-wrap: anywhere; max-width: 100%;
  pointer-events: none;
}
.place-wish-lbl.active { color: var(--accent); }

/* wish button */
.place-wish-btn {
  appearance: none; background: transparent; border: none;
  display: flex; align-items: center; justify-content: center;
  padding: 3px; border-radius: 6px; cursor: pointer;
  color: var(--ink-5); position: relative;
  transition: color .15s; flex-shrink: 0;
}
.place-wish-btn:hover { color: var(--ink-3); }
.place-wish-btn.wished { color: var(--accent); }
.place-wish-btn svg { width: 16px; height: 16px; pointer-events: none; }
.place-wish-lock {
  position: absolute; top: 0; right: 0;
  width: 9px; height: 9px; background: var(--ink-4); border-radius: 50%;
}
.place-wish-lock::after {
  content: ''; position: absolute; inset: 0; margin: auto; width: 5px; height: 5px; background: white;
  -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center/contain no-repeat;
          mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='11' width='18' height='11' rx='2'/><path d='M7 11V7a5 5 0 0 1 10 0v4'/></svg>") center/contain no-repeat;
}

/* dist-hint: šedé, kurzíva, bez podtržení */
.place-dist-hint {
  font-size: 10px; font-family: 'Inter', sans-serif;
  font-style: italic; color: var(--ink-4);
  cursor: pointer; text-align: center; line-height: 1.3;
  pointer-events: auto; text-decoration: none;
}
.place-dist-hint:hover { color: var(--ink-3); }
.place-dist-hint.geo-blocked { cursor: default; }
.place-dist-hint.geo-blocked:hover { color: var(--ink-4); }

/* grid: wish-wrap vodorovně, label PEVNÁ šířka aby liky neskákaly */
#placesList.grid-mode .place-wish-wrap {
  flex-direction: row; align-items: center; gap: 4px;
}
#placesList.grid-mode .place-wish-lbl {
  font-size: 10px; width: 56px; text-align: right; flex-shrink: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#placesList.grid-mode .place-wish-btn { flex-shrink: 0; }

/* ── GRID MODE ── */
#placesList.grid-mode {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  flex-direction: unset;
}
@media (max-width: 819px) {
  #placesList.grid-mode { grid-template-columns: repeat(2, 1fr); }
}

/* grid card overrides */
#placesList.grid-mode .place-section-list {
  display: contents; /* položky přímo do gridu */
}
#placesList.grid-mode .place-card {
  display: flex; flex-direction: column;
  grid-template-columns: unset;
}
#placesList.grid-mode .place-thumb {
  width: 100%; aspect-ratio: 3/2; min-height: unset;
  font-size: 37px;
}
#placesList.grid-mode .place-cat-pill {
  display: flex;
}
#placesList.grid-mode .place-body {
  border-left: none;
  border-top: 1px solid var(--paper-2);
  padding: 10px 12px 0;
}
#placesList.grid-mode .place-name { padding-right: 0; }
#placesList.grid-mode .place-kick { display: none; }
#placesList.grid-mode .place-sub {
  font-size: 12px; -webkit-line-clamp: 2;
  min-height: 2.8em; /* 2 řádky i pro kratší teaser — lišta dole musí sedět mezi kartami */
}
/* grid meta: dist vlevo, votes absolutně na střed, wish vpravo */
#placesList.grid-mode .place-meta {
  border-left: none;
  border-top: 1px solid var(--paper-2);
  flex-direction: row; align-items: center; justify-content: space-between;
  position: relative;
  padding: 4px 10px;
  width: unset; height: auto;
}
/* v gridu: skrýt list dist, ukázat grid dist */
#placesList.grid-mode .place-meta > .place-dist-link,
#placesList.grid-mode .place-meta > .place-dist-hint,
#placesList.grid-mode .place-meta > .place-dist { display: none; }
#placesList.grid-mode .meta-dist-grid { display: flex; flex-shrink: 0; }
/* votes absolutně na střed spodní lišty */
#placesList.grid-mode .place-meta-right {
  display: flex; align-items: center;
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: auto;
}
#placesList.grid-mode .place-meta-right .place-wish-wrap { display: none; }
#placesList.grid-mode .meta-wish-list { display: none; }
#placesList.grid-mode .meta-wish-grid { display: flex; flex-shrink: 0; }

/* více místa pod textem před dělicí čárou */
#placesList.grid-mode .place-body { padding-bottom: 12px; }
#placesList.grid-mode .place-vote-btn { padding: 2px 5px; }
/* grid body: stamp dole vpravo */
#placesList.grid-mode .place-stamp-body {
  width: 52px; height: 52px;
  bottom: 8px; right: 10px; top: unset;
}

/* cat pill (grid only) */
.place-cat-pill {
  display: none;
  position: absolute; top: 8px; left: 8px; z-index: 3;
  align-items: center; gap: 5px;
  background: #fff; border: 1px solid var(--rule); border-radius: 6px;
  padding: 4px 9px 4px 7px;
  font-size: 9px; font-weight: 500; letter-spacing: .12em;
  text-transform: uppercase; color: var(--ink-5);
}
.place-cat-pill .dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

/* ── EMPTY & LOADING ── */
.empty { text-align: center; padding: 60px 20px; color: var(--ink-4); }
.empty h3 { font-size: 21px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
.empty p { font-size: 14px; line-height: 1.5; }
.loading { display: flex; align-items: center; justify-content: center; padding: 64px; color: var(--ink-5); font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  #placesList.grid-mode { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .page-intro { font-size: 13px; line-height: 1.5; }
  .hero-section { margin-bottom: 6px; }
  .hero-top { margin-bottom: 12px; }
  .section-label { margin-top: 10px; }
  #placesList.grid-mode .section-label { margin-top: 10px; }
}
@media (max-width: 819px) and (orientation: landscape) {
  #lop-nav {
    position: fixed !important; top: 0 !important; bottom: 0 !important;
    right: 0 !important; left: auto !important; width: 64px !important; height: auto !important;
    flex-direction: column !important; border-top: none !important;
    border-left: 1px solid var(--rule) !important;
    padding: 8px 0 14px !important; padding-top: var(--header-h, 52px) !important;
    justify-content: flex-start !important; gap: 0 !important;
  }
  body { padding-right: 0 !important; padding-bottom: 0 !important; }
  .page { padding-top: 16px; padding-left: 10px !important; padding-right: 74px !important; }
  .page-title { font-size: clamp(24px, 4vw, 30px); }
  .page-intro { font-size: 13px; line-height: 1.5; }
  .hero-section { margin-bottom: 6px; }
  .hero-top { margin-bottom: 12px; }
  .section-label { margin-top: 14px; }
  #placesList.grid-mode .section-label { margin-top: 14px; }
}


/* ── AKTIVNÍ FILTRY — volně ložené chipy, bez rámečku ── */
.tax-banner {
  display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap;
  margin: 0 0 14px;
}
.tax-banner .tb-wrap {
  display: flex; flex-direction: column; align-items: flex-start; gap: 3px;
}
.tax-banner .tb-state {
  font-family: 'Inter', sans-serif;
  font-size: 9px; letter-spacing: .01em;
  color: var(--ink-4); line-height: 1;
  padding-left: 11px;
}
.tax-banner[hidden] { display: none; }
.tax-banner .tb-chip {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--ink); border: 1.5px solid var(--ink); border-radius: 7px;
  padding: 4px 9px 4px 11px; cursor: pointer;
  color: var(--paper); font-family: inherit; font-size: 12px; font-weight: 500;
  transition: box-shadow .15s, transform .15s;
}
.tax-banner .tb-ico {
  width: 11px; height: 11px; flex-shrink: 0;
  background-color: currentColor;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center;  mask-position: center;
  -webkit-mask-size: contain;     mask-size: contain;
}
.tax-banner .tb-ico-check {
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>");
          mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='black' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='4 12 10 18 20 6'/></svg>");
}
.tax-banner .tb-ico-heart {
  -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black' stroke='black' stroke-width='2' stroke-linejoin='round'><path d='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z'/></svg>");
          mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black' stroke='black' stroke-width='2' stroke-linejoin='round'><path d='M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1a5.5 5.5 0 1 0-7.8 7.8l1 1 7.8 7.8 7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z'/></svg>");
}
.tax-banner .tb-chip[data-tone="accent"] {
  background: #fff; border-color: var(--accent); color: var(--accent);
}
.tax-banner .tb-chip[data-tone="ok"] {
  background: #fff; border-color: var(--ok); color: var(--ok);
}
.tax-banner .tb-chip[data-tone="arch"] {
  background: #fff; border-color: var(--cat-arch); color: var(--cat-arch);
}
.tax-banner .tb-chip[data-tone="cat-hist"] { background:#fff; border-color: var(--cat-hist); color: var(--cat-hist); }
.tax-banner .tb-chip[data-tone="cat-arch"] { background:#fff; border-color: var(--cat-arch); color: var(--cat-arch); }
.tax-banner .tb-chip[data-tone="cat-art"]  { background:#fff; border-color: var(--cat-art);  color: var(--cat-art);  }
.tax-banner .tb-chip:hover { box-shadow: 0 3px 10px rgba(26,24,20,.28); transform: translateY(-1px); }
.tax-banner .tb-chip:active { transform: translateY(0); box-shadow: none; }
.tax-banner .tb-chip svg { opacity: .65; flex-shrink: 0; }
.tax-banner .tb-chip:hover svg { opacity: 1; }
</style>

<div class="page">

      <h1 class="page-title"><span id="h1a">Přehled</span> <em id="h1b">míst</em></h1>
      <!-- Controls: Filtr + Seznam + Dlaždice -->
      <div class="controls-bar">
        <button class="ctrl-btn ctrl-btn-filter" id="filterBtn" onclick="toggleFilter()">
          <span class="filter-bottom">

              <span class="filter-dots">

              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>

            Filtr
            <span class="filter-cnt" id="filterHeadCnt"><span id="filterHeadActive" style="color:var(--ink-5);font-size:12px;font-weight:500;">—</span><span id="filterHeadTotal" style="color:var(--ink-5);font-size:10px;"></span></span>

          <svg id="viewIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>

    <p class="page-intro" id="pageIntro">Vyhovuje Vám více forma seznamu než mapa? Všechna místa seřazená přehledně podle kategorií s možností filtrování. Stačí začít prozkoumávat.</p>

  <!-- Filter modal -->
  <div class="filter-modal-backdrop" id="filterBackdrop">
    <div class="filter-modal" id="filterModal">
      <div class="filter-modal-inner">

                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>

const CAT_COLOR  = { hist: '#4A4A48', arch: '#3B5F84', art: '#E0A020' };

/* ── Stamp — napojení na stamp.js (stejné jako collections.html) ── */
const STAMP_PROPS = { orientation: 'sealF', style: 'rough', castle: 'ink', eccentric: true };

function arScoreToStampScore(arScore) {
  if (arScore == null || arScore === 0) return 1;
  if (arScore <= 25) return 25;
  if (arScore <= 50) return 45;
  if (arScore <= 75) return 65;
  return 90;
}

function makeStampSVG(p, arScore) {
  if (!window.stampSVG) return ''; // stamp.js ještě nenačteno
  return window.stampSVG({
    ...STAMP_PROPS,
    code:      p.id,
    name:      locStr(p,'name'),
    year:      p.yearBuilt || p.yearThen || '',
    cat:       p.cat,
    score:     arScoreToStampScore(arScore),
    dateLabel: '',
    k:         p.id,
  });
}

/* ── Auth / session ── */
function getSession() { try { return JSON.parse(localStorage.getItem('lop_auth_session') || 'null'); } catch(e) { return null; } }
async function getValidSession() {
  const s = getSession();
  if (!s?.access_token || !s?.user) return null;
  const nowSec = Math.floor(Date.now() / 1000);
  if ((s.expires_at || 0) > nowSec + 60) return s;
  if (!s.refresh_token) return null;
  try {
    const r = await fetch(SUPA_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: { 'apikey': SUPA_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    });
    if (!r.ok) { localStorage.removeItem('lop_auth_session'); return null; }
    const data = await r.json();
    localStorage.setItem('lop_auth_session', JSON.stringify({ ...data, user: data.user || s.user }));
    return data;
  } catch(e) { return null; }
}
function isLoggedIn() { try { const s = getSession(); return !!(s && s.access_token && s.user); } catch(e) { return false; } }
function getUserRole() { return localStorage.getItem('lop_user_role') || 'member'; }
function isAdmin()     { return isLoggedIn() && getUserRole() === 'admin'; }
function getWished()  { try { return JSON.parse(localStorage.getItem(WISH_KEY)  || '[]').map(String); } catch(e) { return []; } }
function getVisited() { try { return JSON.parse(localStorage.getItem(VISIT_KEY) || '[]').map(String); } catch(e) { return []; } }

/* ── AR scores (ze Supabase visited tabulky, field score) ── */
// Ukládáme jako { placeId: score } po syncu
let _arScores = {};

function haversineM(lat1, lng1, lat2, lng2) {
  const R=6371000, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function formatDist(m) { return m<1000?Math.round(m)+' m':(m/1000).toFixed(1).replace('.', ',')+' km'; }

let userPos = null;
let PLACES  = [];
let DEV_PLACES   = [];
let _devLoaded   = false;
let _devForceOnly = false;
function _devCat(item) {
  // Přesunutá publikovaná místa (H101, H201...) mají explicitní cat —
  // ID u nich nekóduje sloh jako u zbytku pracovní vrstvy.
  if (item.cat) return item.cat;
  return /^U\d/.test(item.id) ? 'art' : 'arch';
}
const _urlFilter = new URLSearchParams(location.search).get('filter');

const TAX = (() => {
  const q = new URLSearchParams(location.search);
  for (const kind of ['tag', 'district', 'person', 'prague']) {
    const raw = q.get(kind);
    if (raw) return { kind, value: raw };
  }
  return null;
})();

/** Odpovídá místo aktivnímu taxonomickému filtru? */
function taxMatches(p) {
  if (!TAX) return true;
  const T = window.LOP_TAGS, v = TAX.value;
  switch (TAX.kind) {
    case 'tag': {
      const slug = (T && T.canon(v)) || v;
      return (p.tags || []).includes(slug);
    }
    case 'district': return p.district === v;
    case 'person':   return (p.people || []).includes(v);
    case 'prague':   return String(p.prague) === String(v);
  }
  return true;
}

/** Přeložený název aktivního filtru */
function taxLabel() {
  if (!TAX) return '';
  const T = window.LOP_TAGS;
  if (!T) return TAX.value;
  switch (TAX.kind) {
    case 'tag':      return T.label(TAX.value);
    case 'district': return T.districtLabel(TAX.value);
    case 'person':   return TAX.value;
    case 'prague':   return T.pragueLabel(TAX.value);
  }
  return TAX.value;
}

/** Zrušit filtr — odebere parametr a zůstane na stránce */
function clearTaxFilter() {

}


/* ── Jediné místo, které promítá stav filtrů do ovládacích prvků.
   Volá se z kliku na chip, z banneru i z resetu — nemá se jak rozejít. ── */
/* Text potvrzovacího tlačítka nese počet výsledků — je z něj tak zřejmé,
   co se po kliknutí objeví, aniž by tam muselo být "zavřít". */
function updateApplyBtn(n) {

/* Jediná povolená cesta ke změně stavu filtru. Mutace je argument, takže
   překreslení ani přefiltrování nelze vynechat — právě to byla opakovaná chyba. */
function updateFilter(mutate) {
  mutate();
  syncFilterUI();
  applyFilter();
}

function syncFilterUI() {
  /* statické popisky modálu — v HTML jsou jen jako fallback */
  const setTxt = (id, key) => { const e = document.getElementById(id); if (e) e.textContent = t(key); };
  setTxt('loadingMsg', 'overview.loading');
  setTxt('h1a',        'overview.h1a');
  setTxt('h1b',        'overview.h1b');
  setTxt('pageIntro',  'overview.intro');
  setTxt('pageTitle',  'overview.page_title');
  const setTip = (id, key) => { const e = document.getElementById(id); if (e) e.title = t(key); };
  setTip('btnViewT',  'overview.toggle_view');
  setTxt('fmCategory', 'overview.category');
  setTxt('fmStyle',    'overview.style');
  setTxt('fmEra',      'overview.era');
  setTxt('fmDist',     'overview.dist_from_you');
  setTxt('fmReset',    'overview.reset');
  setTxt('devSectionLbl', 'admin.dev_section');
  setTxt('devForceLbl',   'admin.dev_force');
  const devLoadBtn = document.getElementById('devLoadBtn');
  if (devLoadBtn) devLoadBtn.textContent = t(_devLoaded ? 'admin.dev_unload' : 'admin.dev_load');
  updateApplyBtn();

  const S_WISH = { full:'filter.state_default', add:'filter.state_selected', hide:'filter.state_hidden' };

  /* Kategorie: vybráno / nevybráno. Stav je vidět z chipu, popisek netřeba. */
  document.querySelectorAll('.chip[data-cat]').forEach(btn => {
    btn.classList.toggle('state-on', CAT_FILTER.has(btn.dataset.cat));
  });

  document.querySelectorAll('.chip[data-filter]').forEach(btn => {
    const f = btn.dataset.filter, st = FILTER[f];
    btn.classList.remove('state-hide','state-on');
    if (st === 'hide') btn.classList.add('state-hide');
    else if (st === 'add') btn.classList.add('state-on');
    const lbl = document.getElementById('lbl-' + f);
    if (lbl) lbl.textContent = t(S_WISH[st] || 'filter.state_default');
  });

  document.querySelectorAll('.chip-style').forEach(btn => {
    btn.classList.toggle('state-on', STYLE_FILTER.has(btn.dataset.style));
  });

  const note = document.getElementById('distNote');
  if (note) {
    if (userPos || DIST_STATE.max == null) note.hidden = true;
    else {
      note.hidden = false;
      note.innerHTML = GEO_PERM === 'denied'
        ? `<span>${t('overview.geo_blocked')}</span>`
        : `<span>${t('overview.geo_needed')}</span>` +
          `<button type="button" onclick="requestLoc(event)">${t('overview.geo_enable')}</button>`;
    }
  }

  const ds = document.getElementById('distSlider');
  if (ds) ds.style.opacity = (DIST_STATE.max != null && !userPos) ? '.45' : '1';
  const dv = document.getElementById('distV');
  if (ds) ds.value = DIST_STATE.max == null ? 100 : Math.round((DIST_STATE.max - 0.2) / 4.8 * 100);
  if (ds) ds.style.setProperty('--fill', (DIST_STATE.max == null ? 100 : Math.round((DIST_STATE.max - 0.2) / 4.8 * 100)) + '%');
  if (dv) dv.textContent = DIST_STATE.max == null
      ? t('overview.any_dist') : '< ' + DIST_STATE.max.toFixed(1) + ' km';

  renderEra();
}

/* ── Seznam aktivních filtrů pro bannerové boxy ── */
function activeFilters(undatedCount) {
  const out = [];

  if (TAX) out.push({ label: taxLabel(), clear: clearTaxFilter });

  /* Popisky se skládají ze STEJNÝCH klíčů jako stavy chipů v modálu,
     jinak se obě místa dřív nebo později rozejdou. */
  const STATE_KEY = { hide:'filter.state_hidden', add:'filter.state_selected' };

  CAT_FILTER.forEach(cat => {
    out.push({ label: t('cat.' + cat), tone: 'cat-' + cat,
               clear: () => { CAT_FILTER.delete(cat); } });
  });

  [['wished','place.plan','accent'], ['visited','overview.visited','ok']].forEach(([f, key, tone]) => {
    const st = FILTER[f]; if (st === 'full') return;
    /* barevný obrys jen u "vždy" — u skrytí by barva pletla */
    out.push({ label: t(key), state: t(STATE_KEY[st]),
               tone: st === 'add' ? tone : null,
               icon: f === 'wished' ? 'heart' : 'check',
               clear: () => { FILTER[f] = 'full'; } });
  });

  if (ERA_STATE.from > ERA_START || ERA_STATE.to < ERA_END) {
    const to = ERA_STATE.to >= ERA_END ? '2000+' : ERA_STATE.to;
    out.push({ label: ERA_STATE.from + '–' + to,
               clear: () => { ERA_STATE.from = ERA_START; ERA_STATE.to = ERA_END; UNDATED.include = true; } });
  }

  STYLE_FILTER.forEach(code => {
    out.push({ label: window.LOP_TAGS ? window.LOP_TAGS.styleLabel(code) : code,
               tone: 'arch',
               clear: () => { STYLE_FILTER.delete(code); } });
  });

  if (DIST_STATE.max != null && userPos)
    out.push({ label: t('filter.distance', { x: DIST_STATE.max.toFixed(1) }),
               clear: () => { DIST_STATE.max = null; } });

  /* Nedatovaná místa — jen když filtr období běží a nějaká by propadla.
     Uživatel je vidí a může je odebrat; výchozí je ponechat. */
  if (UNDATED.include && undatedCount > 0 &&
      (ERA_STATE.from > ERA_START || ERA_STATE.to < ERA_END))
    out.push({ label: t('filter.undated') + ' (' + undatedCount + ')',
               clear: () => { UNDATED.include = false; } });

  return out;
}

function clearOneFilter(i, undatedCount) {
  const f = activeFilters(undatedCount)[i];
  if (!f) return;
  updateFilter(f.clear);
}

function renderTaxBanner(count, undatedCount) {
  const el = document.getElementById('taxBanner');
  if (!el) return;
  const items = activeFilters(undatedCount);
  if (!items.length) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = items.map((f, i) =>
    `<div class="tb-wrap">` +
      `<span class="tb-state">${f.state || '&nbsp;'}</span>` +
      `<button class="tb-chip"${f.tone ? ` data-tone="${f.tone}"` : ''} onclick="clearOneFilter(${i}, ${undatedCount})">` +
        (f.icon ? `<span class="tb-ico tb-ico-${f.icon}"></span>` : '') +
        `<span>${f.label}</span>` +
        `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>` +
      `</button>` +
    `</div>`).join('');
}

/* Stav oprávnění: 'prompt' | 'denied' | 'granted' | null (API nedostupné).
   Po zamítnutí už prohlížeč výzvu znovu nezobrazí — je potřeba poradit jinak. */
let GEO_PERM = null;
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: 'geolocation' }).then(st => {
    GEO_PERM = st.state;
    syncFilterUI();
    if (PLACES.length) render();
    /* Když si to uživatel přepne v nastavení prohlížeče, zachytíme to. */
    st.onchange = () => {
      GEO_PERM = st.state;
      if (st.state === 'granted') locateUser();
      syncFilterUI();
      if (PLACES.length) render();
    };
  }).catch(() => {});
}

function requestLoc(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  navigator.geolocation.getCurrentPosition(pos => { userPos=[pos.coords.latitude,pos.coords.longitude]; syncFilterUI(); render(); },
    err => { if(err.code===1) GEO_PERM='denied'; syncFilterUI(); render(); }, { enableHighAccuracy:true, timeout:8000 });
}

/* Poloha je natvrdo zablokovaná v prohlížeči — druhé okno se nezobrazí,
   takže klik musí dát viditelnou odpověď rovnou na stránce, ne jen v title. */
let _geoTip = null;
function showGeoBlockedHint(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (_geoTip) { _geoTip.remove(); _geoTip = null; }
  const target = e.currentTarget;
  const rect = target.getBoundingClientRect();
  const tip = document.createElement('div');
  tip.className = 'geo-tip';
  tip.textContent = t('overview.geo_blocked');
  document.body.appendChild(tip);
  const tipRect = tip.getBoundingClientRect();
  let left = rect.left + rect.width / 2 - tipRect.width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));
  tip.style.left = left + 'px';
  tip.style.top = (rect.top - tipRect.height - 8 + window.scrollY) + 'px';
  requestAnimationFrame(() => tip.classList.add('visible'));
  _geoTip = tip;
  const remove = () => { if (_geoTip === tip) { tip.remove(); _geoTip = null; } };
  setTimeout(remove, 5000);
  document.addEventListener('click', remove, { once: true, capture: true });
}
function locateUser() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => { userPos=[pos.coords.latitude,pos.coords.longitude]; syncFilterUI(); render(); },
    ()=>{}, { enableHighAccuracy:true, timeout:8000 });
}

/* Kategorie i slohy = POZITIVNÍ výběr (prázdná množina znamená vše).
   Navštíveno a plán mají tři stavy, protože u nich dává smysl i skrytí. */
const CAT_FILTER = new Set();
const FILTER = { visited:'full', wished:'full' };
/* Cykly stavů. 'dim' se v přehledu nepoužívá — jen zobrazeno/skryto,
   u plánu a navštívených navíc 'vždy'. */
/* výchozí → vybráno → skryto → výchozí */
const FILTER_NEXT = { full:'add', add:'hide', hide:'full' };
const ERA_START=1000, ERA_END=2025;
const ERA_STATE = { from:ERA_START, to:ERA_END };
const DIST_STATE = { max:null };
const UNDATED = { include:true };   // nedatovaná místa při aktivním filtru období

/* Slohy — POZITIVNÍ výběr: prázdná množina znamená "vše".
   Liší se od kategorií záměrně; u 17 slohů chce člověk vybírat, ne odškrtávat. */
const STYLE_FILTER = new Set();
(new URLSearchParams(location.search).getAll('style')).forEach(s => STYLE_FILTER.add(s));

/* Osa je progresivní, ne lineární — do roku 1000 spadá málo staveb, k současnosti
   jich exponenciálně přibývá. ERA_CURVE > 1 komprimuje starší roky do menší
   plochy táhla a dává víc místa (a tedy přesnosti) novější historii. */
const ERA_CURVE = 2.2;
const eraPct = y => {
  const t = Math.max(0, Math.min(1, (y-ERA_START)/(ERA_END-ERA_START)));
  return Math.pow(t, ERA_CURVE) * 100;
};
const pctToYear = p => {
  const t = Math.pow(Math.max(0, Math.min(1, p)), 1/ERA_CURVE);
  return Math.round(ERA_START + t*(ERA_END-ERA_START));
};

function toggleFilter() {
  const backdrop = document.getElementById('filterBackdrop');
  const wasOpen = backdrop.classList.contains('open');
  if (!wasOpen) syncNavInset();
  backdrop.classList.toggle('open');
  if (!wasOpen) buildEraTimeline();
  document.getElementById('filterBtn')?.blur();
}

/* Backdrop filtru nesmí zasahovat pod navbar. Čtení body paddingu (které si
   nastavuje nav.js) bylo závislé na pořadí dvou nezávislých requestAnimationFrame
   volání — v landscape se to spolehlivě netrefilo. Měříme přímo skutečnou
   pozici #lop-nav v DOMu, to je vždy aktuální bez ohledu na timing. */
function syncNavInset() {
  const nav = document.getElementById('lop-nav');
  let right = 0, bottom = 0;
  if (nav) {
    const r = nav.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    // boční lišta (landscape mobil / desktop) — sahá k pravému okraji přes celou výšku
    if (r.width > 0 && r.right >= vw - 2 && r.height >= vh - 2) right = vw - r.left;
    // spodní lišta (portrait mobil) — sahá k dolnímu okraji přes celou šířku
    if (r.height > 0 && r.bottom >= vh - 2 && r.width >= vw - 2) bottom = vh - r.top;
  }
  document.documentElement.style.setProperty('--nav-inset-right', right + 'px');
  document.documentElement.style.setProperty('--nav-inset-bottom', bottom + 'px');
}
syncNavInset();
if (document.readyState === 'loading') {
  // nav.js čeká na DOMContentLoaded a teprve v něm plánuje svůj vlastní rAF;
  // stejným pořadím zajistíme, že náš sync doběhne AŽ PO tom, ne dřív.
  document.addEventListener('DOMContentLoaded', () => requestAnimationFrame(syncNavInset));
} else {
  requestAnimationFrame(syncNavInset);
}
window.addEventListener('resize', syncNavInset);
window.addEventListener('orientationchange', () => setTimeout(syncNavInset, 250));

/* Chipy slohů — jen ty, které se v datech vyskytují. Pořadí podle
   slovníku, tedy zhruba chronologicky. */
function buildStyleChips() {
  const row = document.getElementById('styleRow');
  const box = document.getElementById('styleChips');
  if (!row || !box || !window.LOP_TAGS) return;

  const counts = {};
  PLACES.forEach(p => (Array.isArray(p.style) ? p.style : p.style ? [p.style] : [])
    .forEach(s => counts[s] = (counts[s] || 0) + 1));

  const codes = Object.keys(window.LOP_TAGS.styles).filter(s => counts[s]);
  if (!codes.length) { row.hidden = true; return; }
  row.hidden = false;

  box.innerHTML = codes.map(code =>
    `<button class="chip chip-style" data-style="${code}">` +
      `<span class="chip-swatch" style="background:var(--ink-5)"></span>` +
      `${window.LOP_TAGS.styleLabel(code)} <span class="chip-count">${counts[code]}</span>` +
    `</button>`).join('');

  box.querySelectorAll('.chip-style').forEach(btn => {
    btn.addEventListener('click', () => {
      const s = btn.dataset.style;
      updateFilter(() => STYLE_FILTER.has(s) ? STYLE_FILTER.delete(s) : STYLE_FILTER.add(s));
    });
  });
}

function buildChips() {
  const el = document.getElementById('mapChips'); if (!el) return;
  const counts = { hist:0, arch:0, art:0 };
  PLACES.forEach(l => { if(counts[l.cat] !== undefined) counts[l.cat]++; });
  el.innerHTML = `
    <div class="chip-wrap">
      <button class="chip" data-cat="hist"><span class="chip-swatch" style="background:var(--cat-hist)"></span>Historie <span class="chip-count">${counts.hist}</span><span class="chip-filter-icon"></span></button>
    </div>
    <div class="chip-wrap">

    </div>

    </div>
  `;
  el.querySelectorAll('.chip[data-cat]').forEach(btn => {
    btn.addEventListener('click', () => {

    });

  el.querySelectorAll('.chip[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!isLoggedIn()) { window.lopAuth?window.lopAuth.open():location.href='login.html?return='+encodeURIComponent(location.href); return; }
      const f = btn.dataset.filter;
      updateFilter(() => { FILTER[f] = FILTER_NEXT[FILTER[f]]; });

  if(wrapW) wrapW.innerHTML=loggedIn?'<span class="chip-count">'+PLACES.filter(p=>wished.includes(String(p.id))).length+'</span><span class="chip-filter-icon"></span>':lockSVG;

function buildEraTimeline() {
  const el=document.getElementById('eraTimeline'); if(!el) return;
  const years=[1000,1200,1400,1600,1800,1900,2000], html=[];
  html.push('<div class="ft-track"></div>','<div class="ft-fill" id="eraFill"></div>');
  years.forEach(y=>{ html.push(`<span class="ft-year-tick" style="left:calc(8px + (100% - 16px) * ${eraPct(y)/100})"></span>`,`<span class="ft-year" style="left:calc(8px + (100% - 16px) * ${eraPct(y)/100})">${y===2000?t('era.now'):y}</span>`); });
  html.push('<div class="ft-h" id="eraHFrom" data-which="from"></div>','<div class="ft-h" id="eraHTo" data-which="to"></div>');
  el.innerHTML=html.join(''); renderEra();
  el.querySelectorAll('.ft-h').forEach(h=>{
    const onDown=ev=>{
      ev.preventDefault(); const which=h.dataset.which, rect=el.getBoundingClientRect();
      const onMove=e=>{ const cx=e.touches?e.touches[0].clientX:e.clientX; /* táhlo jezdí od 8px do W−8px — mapovat kurzor na týž rozsah */
        const usable=rect.width-16;
        const p=Math.max(0,Math.min(1,(cx-rect.left-8)/usable)), y=pctToYear(p); if(which==='from') ERA_STATE.from=Math.min(y,ERA_STATE.to-20); else ERA_STATE.to=Math.max(y,ERA_STATE.from+20); renderEra(); applyFilter(); };
      const onUp=()=>{ window.removeEventListener('mousemove',onMove); window.removeEventListener('mouseup',onUp); window.removeEventListener('touchmove',onMove); window.removeEventListener('touchend',onUp); };
      window.addEventListener('mousemove',onMove); window.addEventListener('mouseup',onUp);
      window.addEventListener('touchmove',onMove,{passive:false}); window.addEventListener('touchend',onUp);
    };
    h.addEventListener('mousedown',onDown); h.addEventListener('touchstart',onDown,{passive:false});
  });
}

function renderEra() {
  const fromP=eraPct(ERA_STATE.from), toP=eraPct(ERA_STATE.to);
  const fromH=document.getElementById('eraHFrom'), toH=document.getElementById('eraHTo'), fill=document.getElementById('eraFill');
  /* Nativní <input type=range> vede střed táhla od 8px do W−8px (půl šířky
     táhla na každé straně). Osa to napodobuje, aby byly obě stopy stejně široké. */
  const pos = pct => `calc(8px + (100% - 16px) * ${pct/100})`;
  if(fromH) fromH.style.left = pos(fromP);
  if(toH)   toH.style.left   = pos(toP);
  if(fill){ fill.style.left  = pos(fromP);
            fill.style.width = `calc((100% - 16px) * ${(toP-fromP)/100})`; }
  const fv=document.getElementById('eraFromV'), tv=document.getElementById('eraToV');
  if(fv) fv.textContent=ERA_STATE.from; if(tv) tv.textContent=ERA_STATE.to>=2025?'2000+':ERA_STATE.to;
}

function initDistSlider() {
  const slider=document.getElementById('distSlider'), label=document.getElementById('distV'); if(!slider) return;
  slider.addEventListener('input',()=>{
    const v=+slider.value;
    slider.style.setProperty('--fill', v+'%');
    /* Bez polohy nemá filtr podle čeho měřit — požádat právě teď,
       kdy uživatel svůj záměr projevil posunutím táhla. */
    if (v < 100 && !userPos && GEO_PERM !== 'denied') requestLoc();
    updateFilter(() => {
      if(v>=100) DIST_STATE.max=null;
      else       DIST_STATE.max=0.2+(v/100)*4.8;
    });
  });
}

function haversineKm(a,b) {
  const R=6371, dLat=(b[0]-a[0])*Math.PI/180, dLon=(b[1]-a[1])*Math.PI/180;
  const lat1=a[0]*Math.PI/180, lat2=b[0]*Math.PI/180;
  return 2*R*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2));
}

function resetFilters() {
  updateFilter(() => {
    CAT_FILTER.clear(); STYLE_FILTER.clear();
    FILTER.visited=FILTER.wished='full';
    ERA_STATE.from=ERA_START; ERA_STATE.to=ERA_END; DIST_STATE.max=null;
    UNDATED.include=true;
  });
}

function locYear(p) {
  if(p.yearBuilt) return p.yearBuilt;
  const parse=s=>{ const v=String(s), y=v.match(/\d{3,4}/); if(y) return parseInt(y[0]); const cc=v.match(/(\d{1,2})\.\s*stol/i); if(cc) return (parseInt(cc[1])-1)*100+50; return null; };
  /* facts se přesunuly do places/HXXX.json — v indexu je yearBuilt */
  if(p.yearThen){ const y=parse(p.yearThen); if(y) return y; }
  return null;
}
